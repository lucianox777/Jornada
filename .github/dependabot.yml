version: 2
updates:
  - package-ecosystem: nuget
    directory: /Solution
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      nuget-all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      github-actions-all:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
