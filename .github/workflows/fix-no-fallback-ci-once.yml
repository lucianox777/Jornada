name: fix-no-fallback-ci-once
on:
  push:
    paths:
      - '.github/workflows/fix-no-fallback-ci-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/remove-semantic-fallbacks
      - run: python3 Solution/scripts/fix-no-fallback-ci-once.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: alinha PostgreSQL e BI à semântica residencial'
          git push origin HEAD:feat/remove-semantic-fallbacks
