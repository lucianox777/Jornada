name: V9 TEST credential and one-use preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TEST_PUBLIC_CERT_B64: ${{ secrets.V9_TF4_TEST_PUBLIC_CERT_B64 }}
      TEST_PRIVATE_KEY_B64: ${{ secrets.V9_TF4_TEST_PRIVATE_KEY_B64 }}
      TEST_PUBLIC_CERT_SHA: ${{ vars.V9_TF4_TEST_PUBLIC_CERT_SHA256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify credentials and global TEST exposure without opening data
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$TEST_PUBLIC_CERT_B64" || -z "$TEST_PRIVATE_KEY_B64" || -z "$TEST_PUBLIC_CERT_SHA" ]]; then
            echo "::error::V9_TEST_PREFLIGHT_CREDENTIALS_MISSING"
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$TEST_PUBLIC_CERT_B64" | base64 --decode > "$tmp/cert.pem" || {
            echo "::error::V9_TEST_PREFLIGHT_CERT_INVALID_BASE64"; exit 1;
          }
          printf '%s' "$TEST_PRIVATE_KEY_B64" | base64 --decode > "$tmp/key.pem" || {
            echo "::error::V9_TEST_PREFLIGHT_KEY_INVALID_BASE64"; exit 1;
          }
          actual_sha="$(sha256sum "$tmp/cert.pem" | cut -d' ' -f1)"
          if [[ "${actual_sha,,}" != "${TEST_PUBLIC_CERT_SHA,,}" ]]; then
            echo "::error::V9_TEST_PREFLIGHT_CERT_SHA_MISMATCH"; exit 1
          fi
          if ! openssl x509 -in "$tmp/cert.pem" -noout -checkend 86400 >/dev/null 2>&1; then
            echo "::error::V9_TEST_PREFLIGHT_CERT_EXPIRED_OR_INVALID"; exit 1
          fi
          if ! openssl pkey -in "$tmp/key.pem" -noout >/dev/null 2>&1; then
            echo "::error::V9_TEST_PREFLIGHT_PRIVATE_KEY_INVALID"; exit 1
          fi
          cert_pub="$(openssl x509 -in "$tmp/cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)"
          key_pub="$(openssl pkey -in "$tmp/key.pem" -pubout -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)"
          if [[ "$cert_pub" != "$key_pub" ]]; then
            echo "::error::V9_TEST_PREFLIGHT_CERT_KEY_MISMATCH"; exit 1
          fi
          echo "V9_TEST_PREFLIGHT_CREDENTIALS_OK"
          set +e
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v9-tf4-test-seed-20261113001-exposed" --silent > /dev/null 2>"$tmp/ref-error"
          rc=$?
          set -e
          if [[ "$rc" == 0 ]]; then
            echo "::error::V9_TEST_PREFLIGHT_SEED_ALREADY_EXPOSED"; exit 1
          fi
          if grep -q 'HTTP 404' "$tmp/ref-error"; then
            echo "V9_TEST_PREFLIGHT_SEED_UNEXPOSED"
          else
            echo "::error::V9_TEST_PREFLIGHT_TAG_STATUS_UNVERIFIED"; exit 1
          fi
          echo "V9_TEST_PREFLIGHT_READY_CREDENTIALS_AND_TAG_ONLY"
