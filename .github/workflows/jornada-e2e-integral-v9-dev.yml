name: Jornada E2E integral V9 DEV

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'SHA completo da master protegida a verificar'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jornada-e2e-integral-v9-dev
  cancel-in-progress: false

jobs:
  dev-1k:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      COMPOSE_PROJECT_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      JORNADA_SQL_CONTAINER_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-sql
      JORNADA_SQL_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-data
      JORNADA_BRONZE_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-bronze
      JORNADA_STAGING_1_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-staging-1
      JORNADA_STAGING_2_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-staging-2
      JORNADA_LOGS_1_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-logs-1
      JORNADA_LOGS_2_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-logs-2
      JORNADA_NODE_DATA_1_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-node-1
      JORNADA_NODE_DATA_2_VOLUME_NAME: jornada-e2e-${{ github.run_id }}-${{ github.run_attempt }}-node-2
    steps:
      - name: Autorizar despacho antes de obter código
        id: admission
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == lucianox777/Jornada ]]
          [[ "$GITHUB_ACTOR" == "$GITHUB_REPOSITORY_OWNER" && "$GITHUB_TRIGGERING_ACTOR" == "$GITHUB_REPOSITORY_OWNER" ]]
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/master ]]
          [[ "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Conferir checkout e HEAD remoto
        id: checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote --exit-code origin refs/heads/master)" = "$GITHUB_SHA"$'\t'refs/heads/master
          git diff --quiet HEAD --
      - name: Contratos bidirecionais das APIs
        id: contracts
        run: |
          python3 Solution/scripts/openapi-contract-gate.py
          python3 Solution/scripts/resultado-openapi-contract-gate.py
      - name: ZIP determinístico da Solução de Apoio sem envio
        id: apoio
        run: |
          python3 -m venv "$RUNNER_TEMP/apoio-venv"
          "$RUNNER_TEMP/apoio-venv/bin/pip" install -r Produtos/ApoioSecretarias/requirements.txt
          "$RUNNER_TEMP/apoio-venv/bin/python" Produtos/ApoioSecretarias/testes/test_cli_zip_e2e.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Preparar restore bloqueado
        working-directory: Solution
        run: ./scripts/nuget-lock-bootstrap.sh
      - name: Reservar infraestrutura descartável da tentativa
        id: isolation
        working-directory: Solution
        run: |
          set -euo pipefail
          [[ "$COMPOSE_PROJECT_NAME" == "jornada-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]
          [[ "$JORNADA_SQL_CONTAINER_NAME" == "$COMPOSE_PROJECT_NAME-sql" ]]
          [[ "$JORNADA_SQL_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-data" ]]
          [[ "$JORNADA_BRONZE_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-bronze" ]]
          [[ "$JORNADA_STAGING_1_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-staging-1" ]]
          [[ "$JORNADA_STAGING_2_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-staging-2" ]]
          [[ "$JORNADA_LOGS_1_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-logs-1" ]]
          [[ "$JORNADA_LOGS_2_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-logs-2" ]]
          [[ "$JORNADA_NODE_DATA_1_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-node-1" ]]
          [[ "$JORNADA_NODE_DATA_2_VOLUME_NAME" == "$COMPOSE_PROJECT_NAME-node-2" ]]
          [[ ! -e .env && ! -L .env && ! -e .local/e2e && ! -L .local/e2e ]]
          named="$(docker ps -aq --filter "name=^/$JORNADA_SQL_CONTAINER_NAME$")"
          project="$(docker ps -aq --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          [[ -z "$named" && -z "$project" ]]
          volumes="$(docker volume ls --format '{{.Name}}')"
          networks="$(docker network ls --format '{{.Name}}')"
          for volume in "$JORNADA_SQL_VOLUME_NAME" "$JORNADA_BRONZE_VOLUME_NAME" "$JORNADA_STAGING_1_VOLUME_NAME" "$JORNADA_STAGING_2_VOLUME_NAME" "$JORNADA_LOGS_1_VOLUME_NAME" "$JORNADA_LOGS_2_VOLUME_NAME" "$JORNADA_NODE_DATA_1_VOLUME_NAME" "$JORNADA_NODE_DATA_2_VOLUME_NAME"; do
            [[ $'\n'"$volumes"$'\n' != *$'\n'"$volume"$'\n'* ]]
          done
          [[ $'\n'"$networks"$'\n' != *$'\n'"${COMPOSE_PROJECT_NAME}_default"$'\n'* ]]
          python3 scripts/local_env_bootstrap.py
      - name: Executar aplicação HTTP e SQL descartável para 1k
        id: http
        timeout-minutes: 85
        working-directory: Solution
        env:
          JORNADA_E2E_LOCKED_RESTORE: 'true'
          JORNADA_E2E_CONSOLE_ZIP: 'false'
          JORNADA_E2E_HTTP_VOLUME_COUNT: '1000'
          JORNADA_E2E_STATUS_POLL_SECONDS: '4'
          JORNADA_E2E_RESULTADO_API: 'true'
          JORNADA_E2E_SEMIBLIND_DENIALS: 'true'
        run: |
          umask 077
          /usr/bin/time -f '%U %S %M' -o "$RUNNER_TEMP/harness-resources" \
            python3 scripts/jornada-runner.py --profile e2e --allow-reset e2e \
            >"$RUNNER_TEMP/jornada-e2e-internal.log" 2>&1
      - name: Conferir rotas efetivamente mapeadas nos dois hosts
        id: runtime
        run: |
          dotnet test Solution/tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build \
            --filter TestCategory=OpenApiRouteInventory --results-directory "$RUNNER_TEMP/route-inventory" \
            --logger 'trx;LogFileName=routes.trx'
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path(os.environ["RUNNER_TEMP"], "route-inventory/routes.trx")
          results = ET.parse(path).findall(".//{*}UnitTestResult")
          if len(results) != 2 or any(r.get("outcome") != "Passed" for r in results):
              raise SystemExit("Os dois hosts devem executar e aprovar os contratos.")
          PYTHON
      - name: Descartar SQL, volumes e armazenamento DEV
        id: cleanup
        if: always() && steps.isolation.outcome == 'success'
        working-directory: Solution
        run: |
          set -euo pipefail
          docker compose --env-file .env down
          volumes="$(docker volume ls --format '{{.Name}}')"
          for volume in "$JORNADA_SQL_VOLUME_NAME" "$JORNADA_BRONZE_VOLUME_NAME" "$JORNADA_STAGING_1_VOLUME_NAME" "$JORNADA_STAGING_2_VOLUME_NAME" "$JORNADA_LOGS_1_VOLUME_NAME" "$JORNADA_LOGS_2_VOLUME_NAME" "$JORNADA_NODE_DATA_1_VOLUME_NAME" "$JORNADA_NODE_DATA_2_VOLUME_NAME"; do
            if [[ $'\n'"$volumes"$'\n' == *$'\n'"$volume"$'\n'* ]]; then
              owner="$(docker volume inspect -f '{{ index .Labels "com.docker.compose.project" }}' "$volume")"
              [[ "$owner" == "$COMPOSE_PROJECT_NAME" ]]
              docker volume rm "$volume"
            fi
          done
          rm -rf -- .local/e2e/bronze .local/e2e/staging .local/e2e/packages .local/e2e/volume-1k-fixture
          rm -f -- .env "$RUNNER_TEMP/jornada-e2e-internal.log"
      - name: Avaliar evidências dos dois marcos
        if: always() && steps.checkout.outcome == 'success'
        env:
          ADMISSION_STEP: ${{ steps.admission.outcome }}
          CHECKOUT_STEP: ${{ steps.checkout.outcome }}
          ISOLATION_STEP: ${{ steps.isolation.outcome }}
          HTTP_STEP: ${{ steps.http.outcome }}
          CONTRACTS_STEP: ${{ steps.contracts.outcome }}
          APOIO_STEP: ${{ steps.apoio.outcome }}
          RUNTIME_STEP: ${{ steps.runtime.outcome }}
          CLEANUP_STEP: ${{ steps.cleanup.outcome }}
        run: python3 Solution/scripts/e2e-integral-dev-evidence.py
      - name: Publicar somente o recibo agregado
        id: evidence
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-integral-dev-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-integral-dev.json
          if-no-files-found: error
          retention-days: 30
      - name: Link do recibo da tentativa
        if: always() && steps.evidence.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: echo "[Recibo agregado desta tentativa]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
