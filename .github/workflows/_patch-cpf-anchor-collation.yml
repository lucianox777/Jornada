name: patch-cpf-anchor-collation

on:
  push:
    branches:
      - work/cpf-anchor-resolution-api
    paths:
      - .github/workflows/_patch-cpf-anchor-collation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/cpf-anchor-resolution-api
          persist-credentials: true
      - name: Patch test and normative docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test = Path('Solution/tests/Jornada.Integration.Tests/Integration/CpfAnchorResolutionApiTests.cs')
          text = test.read_text(encoding='utf-8')
          old = "JOIN identidade.identity_map m ON m.tipo='CPF' AND m.identificador=a.cpf AND m.vigencia_fim IS NULL"
          new = "JOIN identidade.identity_map m ON m.tipo='CPF' AND m.identificador COLLATE Latin1_General_100_BIN2=a.cpf AND m.vigencia_fim IS NULL"
          if text.count(old) != 1:
              raise SystemExit(f'Join do teste esperado não é único: {text.count(old)}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          api = Path('Solution/docs/API.md')
          text = api.read_text(encoding='utf-8')
          old = "divergência forte gera `EM_CONFLITO`, e `/identidade/resolver` devolve `CONFLITO / CPF_EM_CONFLITO_IDENTIDADE` sem UUID enquanto houver ambiguidade."
          new = "divergência forte gera `EM_CONFLITO`. A âncora permanente CPF→UUID continua imutável: `/identidade/resolver` devolve `CONFLITO / CPF_EM_CONFLITO_IDENTIDADE` preservando o UUID permanente, enquanto a atribuição factual permanece suspensa até correção governada. Se não houver mapa corrente, o endpoint ainda resolve pela âncora e sinaliza `CPF_ANCORA_SEM_MAPA_CORRENTE`."
          if text.count(old) != 1:
              raise SystemExit(f'Texto legado API esperado não é único: {text.count(old)}')
          api.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('Solution/README.md')
          text = readme.read_text(encoding='utf-8')
          old = "enquanto isso, CPF→UUID devolve `CONFLITO / CPF_EM_CONFLITO_IDENTIDADE`, sem UUID."
          new = "enquanto isso, CPF→UUID devolve `CONFLITO / CPF_EM_CONFLITO_IDENTIDADE` preservando o UUID da âncora permanente; a atribuição factual continua suspensa."
          if text.count(old) != 1:
              raise SystemExit(f'Texto legado README esperado não é único: {text.count(old)}')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          git diff -- Solution/tests/Jornada.Integration.Tests/Integration/CpfAnchorResolutionApiTests.cs Solution/docs/API.md Solution/README.md
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'jornada-ci'
          git config user.email 'jornada-ci@users.noreply.github.com'
          git add Solution/tests/Jornada.Integration.Tests/Integration/CpfAnchorResolutionApiTests.cs Solution/docs/API.md Solution/README.md
          git commit -m 'test: fixar semântica da âncora na API CPF'
          git push origin HEAD:work/cpf-anchor-resolution-api
