name: temp-generate-v5-document-deliverables

on:
  push:
    branches:
      - docs/rebaseline-fabric-operacional-v5
    paths:
      - '.github/workflows/_temp_generate_docs_v5.yml'
      - 'Documentos/**/*.md'
      - 'Solution/scripts/generate-document-deliverables.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install document toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer pandoc poppler-utils fonts-dejavu-core
          python3 -m pip install --disable-pip-version-check python-docx matplotlib

      - name: Generate and validate DOCX/PDF deliverables
        run: python3 Solution/scripts/generate-document-deliverables.py --root .

      - name: Commit generated deliverables to this branch
        shell: bash
        run: |
          git add \
            Documentos/Requisitos/02_Requisitos_Funcionais_Jornada_v1.1.docx \
            Documentos/Requisitos/02_Requisitos_Funcionais_Jornada_v1.1.pdf \
            Documentos/Requisitos/03_Requisitos_Nao_Funcionais_Jornada_v1.1.docx \
            Documentos/Requisitos/03_Requisitos_Nao_Funcionais_Jornada_v1.1.pdf \
            Documentos/Requisitos/05_Matriz_Rastreabilidade_Requisitos_Jornada_v1.1.docx \
            Documentos/Requisitos/05_Matriz_Rastreabilidade_Requisitos_Jornada_v1.1.pdf \
            Documentos/Anexo_Modelo_Fisico_Jornada_v1.40.docx \
            Documentos/Anexo_Modelo_Fisico_Jornada_v1.40.pdf
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerar entregáveis normativos do candidato v5.00'
          git push origin HEAD:docs/rebaseline-fabric-operacional-v5
