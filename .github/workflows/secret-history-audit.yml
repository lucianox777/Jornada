name: jornada-secret-history-audit

# Discovery on changes to this workflow; thereafter explicitly runnable on demand.
# This is NOT a promotion gate. Findings require human security triage (#405).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/secret-history-audit.yml'

permissions:
  contents: read

jobs:
  historical-gitleaks-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Solution
    steps:
      - name: Checkout full reachable Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test aggregate report redaction and failure handling
        run: python3 scripts/gitleaks-history-audit-summary.py --self-test
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jornada-gitleaks"
          archive="$RUNNER_TEMP/jornada-gitleaks/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --
          tar -xzf "$archive" -C "$RUNNER_TEMP/jornada-gitleaks" gitleaks
          chmod 0755 "$RUNNER_TEMP/jornada-gitleaks/gitleaks"
          echo "$RUNNER_TEMP/jornada-gitleaks" >> "$GITHUB_PATH"
      - name: Scan tree and full reachable Git history
        run: |
          set -uo pipefail
          mkdir -p .local/gitleaks
          scan_rc=0
          ./scripts/security-secret-scan.sh > .local/gitleaks/history-audit-session.log 2>&1 || scan_rc=$?
          if (( scan_rc > 1 )); then
            echo "::error::Operational Gitleaks failure (exit $scan_rc); raw local log is not exported."
            exit "$scan_rc"
          fi
          python3 scripts/gitleaks-history-audit-summary.py \
            --current .local/gitleaks/current-tree.json \
            --history .local/gitleaks/git-history.json \
            --scanner-exit "$scan_rc" \
            --output .local/gitleaks/history-audit-summary.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          summary=json.loads(Path('.local/gitleaks/history-audit-summary.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('## Histórico Gitleaks — diagnóstico, não homologação\n\n')
              output.write(f"Árvore: {summary['currentTree']['findings']} achados; ")
              output.write(f"histórico: {summary['gitHistory']['findings']} achados. ")
              output.write(f"Estado: {summary['outcome']}.\n\n")
              output.write('Relatório agregado no artifact; arquivos brutos permanecem no runner. ')
              output.write('Não gerar baseline automático nem reescrever histórico.\n')
          if summary['outcome'] == 'FINDINGS_REQUIRE_TRIAGE':
              print('::warning::Gitleaks encontrou ocorrências: classificar na issue #405.')
          PY
      - name: Upload aggregate evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-history-audit-summary
          path: Solution/.local/gitleaks/history-audit-summary.json
          if-no-files-found: warn
          retention-days: 30
