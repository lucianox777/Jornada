name: refresh-integrator-provenance

on:
  push:
    branches:
      - work/integrador-identificador-config
    paths:
      - '.github/workflows/refresh-integrator-provenance.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Refresh NuGet provenance inventory
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          root = Path('Solution')
          manifest_path = root / 'config/release/nuget-lock-provenance.json'
          data = json.loads(manifest_path.read_text(encoding='utf-8'))

          origin = 'REGENERATED_OR_VERIFIED_V405_SDK_8_0_424'
          status = 'CI_FORCE_EVALUATE_AND_LOCK_GATE_PASS_V405'
          existing = {row['path']: row for row in data.get('locks', [])}
          rows = []
          combined_rows = []

          for lock in sorted(
              p for p in root.rglob('packages.lock.json')
              if '.local' not in p.parts and 'obj' not in p.parts and 'bin' not in p.parts
          ):
              rel = lock.relative_to(root).as_posix()
              digest = hashlib.sha256(lock.read_bytes()).hexdigest()
              row = existing.get(rel, {
                  'path': rel,
                  'origin': origin,
                  'note': 'Lock reproduzido/verificado com dotnet SDK 8.0.424 e --use-lock-file --force-evaluate; a promoção exige repetição sem diff seguida de --locked-mode.',
                  'verificationStatus': status,
              })
              row['origin'] = origin
              row['sourceSha256'] = digest
              row['sha256'] = digest
              row['verificationStatus'] = status
              if rel == 'tests/Jornada.Integrador.Tests/packages.lock.json':
                  row['note'] = 'Harness C# do integrador sem PackageReference externo; referencia o projeto Jornada.Integrador.CSharp e é validado em --locked-mode.'
              if rel == 'src/Jornada.Resultado.Api/packages.lock.json':
                  row['note'] = 'Grafo transitivo via Jornada.Operational.Sql; lock regenerado pelo SDK 8.0.424 e validado em --locked-mode.'
              rows.append(row)
              combined_rows.append(f'{digest}  {rel}')

          data['locks'] = rows
          generation = data['lockGraphGeneration']
          generation['lockCount'] = len(rows)
          generation['combinedSha256'] = hashlib.sha256(('\n'.join(combined_rows)).encode()).hexdigest()
          data['promotionRequirements'] = [
              item.replace('clientes C#/Python', 'cliente C#')
              for item in data.get('promotionRequirements', [])
          ]
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
      - name: Commit refreshed provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Solution/config/release/nuget-lock-provenance.json
          git commit -m 'build: refresh integrator NuGet provenance'
          git push origin "HEAD:${GITHUB_REF_NAME}"
