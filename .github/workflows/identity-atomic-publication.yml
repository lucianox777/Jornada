name: jornada-identity-atomic-publication
on:
  pull_request:
    paths:
      - 'Solution/src/Jornada.Contracts/IdentityCompositionPublication.cs'
      - 'Solution/src/Jornada.Contracts/IdentityCompositionFactualRevalidation.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionAtomicPublication.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionFactualAuthorityReader.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionRecompositionPlanStore.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IdentityCompositionPublicationTests.cs'
      - 'Solution/database/migrations/20260909_Identidade_Composicao_Publicacao.sql'
      - 'Solution/database/postgresql/20260909_Identidade_Composicao_Publicacao.sql'
      - 'Solution/scripts/identity-composition-atomic-publication-smoke.cs'
      - '.github/workflows/identity-atomic-publication.yml'
  push:
    paths:
      - 'Solution/src/Jornada.Contracts/IdentityCompositionPublication.cs'
      - 'Solution/src/Jornada.Contracts/IdentityCompositionFactualRevalidation.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionAtomicPublication.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionFactualAuthorityReader.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionRecompositionPlanStore.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IdentityCompositionPublicationTests.cs'
      - 'Solution/database/migrations/20260909_Identidade_Composicao_Publicacao.sql'
      - 'Solution/database/postgresql/20260909_Identidade_Composicao_Publicacao.sql'
      - 'Solution/scripts/identity-composition-atomic-publication-smoke.cs'
      - '.github/workflows/identity-atomic-publication.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Solution
        shell: bash
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: J0rnada_${{ github.run_id }}_Aa9!
        ports:
          - 1433:1433
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: jornada
          POSTGRES_DB: JornadaAtomicPublicationTest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jornada -d JornadaAtomicPublicationTest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Wait for SQL Server
        run: |
          set -euo pipefail
          SQL_PASSWORD="J0rnada_${GITHUB_RUN_ID}_Aa9!"
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          for attempt in $(seq 1 30); do
            if docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P "$SQL_PASSWORD" -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs "$CID" >&2 || true
          exit 1
      - name: Build publication contract and real-database harness
        run: |
          set -euo pipefail
          mkdir -p .local/atomic-publication .local/atomic-publication-evidence
          git rev-parse HEAD | tee .local/atomic-publication-evidence/commit.txt
          git diff --check
          dotnet restore tests/Jornada.Tests/Jornada.Tests.csproj --locked-mode -v:normal 2>&1 | tee .local/atomic-publication-evidence/test-restore.log
          dotnet build tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-restore -warnaserror -v:normal 2>&1 | tee .local/atomic-publication-evidence/test-build.log
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~IdentityCompositionPublicationTests' --logger 'trx;LogFileName=atomic-publication.trx' --results-directory .local/atomic-publication-evidence 2>&1 | tee .local/atomic-publication-evidence/unit-tests.log
          python3 scripts/test-evidence-gate.py .local/atomic-publication-evidence/atomic-publication.trx --forbid-skipped --minimum-tests 9 --summary .local/atomic-publication-evidence/tests.json
          cat > .local/atomic-publication/AtomicPublicationSmoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/Jornada.Operational.Sql/Jornada.Operational.Sql.csproj" />
              <ProjectReference Include="../../src/Jornada.Contracts/Jornada.Contracts.csproj" />
              <Compile Include="../../scripts/identity-composition-atomic-publication-smoke.cs" Link="Program.cs" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore .local/atomic-publication/AtomicPublicationSmoke.csproj -v:normal 2>&1 | tee .local/atomic-publication-evidence/harness-restore.log
          dotnet build .local/atomic-publication/AtomicPublicationSmoke.csproj -c Release --no-restore -warnaserror -v:normal 2>&1 | tee .local/atomic-publication-evidence/harness-build.log
      - name: Install SQL Server disposable fixture
        run: |
          set -euo pipefail
          SQL_PASSWORD="J0rnada_${GITHUB_RUN_ID}_Aa9!"
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          sqlcmd() { docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P "$SQL_PASSWORD" -C -b "$@"; }
          sqlcmd -Q "IF DB_ID('JornadaAtomicPublicationTest') IS NULL CREATE DATABASE JornadaAtomicPublicationTest;"
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/Jornada_Fase1.sql > .local/atomic-publication-evidence/sql-base.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/migrations/20260907_Cpf_Ancora.sql > .local/atomic-publication-evidence/sql-anchor.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/Jornada_Identidade_Progressiva.sql > .local/atomic-publication-evidence/sql-progressive.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/migrations/20260908_Identidade_Composicao_Ledger.sql > .local/atomic-publication-evidence/sql-ledger.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Referencia_Lock.sql > .local/atomic-publication-evidence/sql-reference-lock.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Aplicacao.sql > .local/atomic-publication-evidence/sql-application.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Recomposicao_Plano.sql > .local/atomic-publication-evidence/sql-recomposition.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Publicacao.sql > .local/atomic-publication-evidence/sql-publication.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Publicacao.sql > .local/atomic-publication-evidence/sql-publication-second.log 2>&1
          sqlcmd -d JornadaAtomicPublicationTest -i /dev/stdin < database/Jornada_Seed_Dev.sql > .local/atomic-publication-evidence/sql-seed.log 2>&1
          printf 'SQL_INSTALL_OK\n' >> .local/atomic-publication-evidence/sql-publication-second.log
      - name: Install PostgreSQL disposable fixture
        run: |
          set -euo pipefail
          CID=$(docker ps -q --filter publish=5432 | head -1)
          test -n "$CID"
          pgsql() { docker exec -i "$CID" psql -v ON_ERROR_STOP=1 -U jornada -d JornadaAtomicPublicationTest "$@"; }
          pgsql < database/postgresql/Jornada_Resultado_Core.sql > .local/atomic-publication-evidence/pg-result.log 2>&1
          pgsql < database/postgresql/Jornada_Ingestion_Processor_Core.sql > .local/atomic-publication-evidence/pg-ingestion.log 2>&1
          pgsql < database/postgresql/Jornada_Processor_Persistence_Core.sql > .local/atomic-publication-evidence/pg-persistence.log 2>&1
          pgsql < database/postgresql/Jornada_Cpf_Ancora.sql > .local/atomic-publication-evidence/pg-anchor.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Progressiva.sql > .local/atomic-publication-evidence/pg-progressive.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Ledger.sql > .local/atomic-publication-evidence/pg-ledger.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Referencia_Lock.sql > .local/atomic-publication-evidence/pg-reference-lock.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Aplicacao.sql > .local/atomic-publication-evidence/pg-application.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Recomposicao_Plano.sql > .local/atomic-publication-evidence/pg-recomposition.log 2>&1
          pgsql < database/postgresql/20260909_Identidade_Composicao_Publicacao.sql > .local/atomic-publication-evidence/pg-publication.log 2>&1
          pgsql < database/postgresql/20260909_Identidade_Composicao_Publicacao.sql > .local/atomic-publication-evidence/pg-publication-second.log 2>&1
          pgsql < database/postgresql/Jornada_Resultado_Core_Smoke.sql > .local/atomic-publication-evidence/pg-result-smoke.log 2>&1
          pgsql < database/postgresql/Jornada_Processor_Persistence_Smoke.sql > .local/atomic-publication-evidence/pg-persistence-smoke.log 2>&1
          printf 'PG_INSTALL_OK\n' >> .local/atomic-publication-evidence/pg-publication-second.log
      - name: Prove SQL Server atomic publication
        run: |
          set -euo pipefail
          SQL_PASSWORD="J0rnada_${GITHUB_RUN_ID}_Aa9!"
          CONNECTION="Server=localhost,1433;Database=JornadaAtomicPublicationTest;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true;Encrypt=True"
          JORNADA_PUBLICATION_PROVIDER=SqlServer JORNADA_PUBLICATION_CONNECTION="$CONNECTION" \
            dotnet run --project .local/atomic-publication/AtomicPublicationSmoke.csproj -c Release --no-build --no-restore 2>&1 | tee .local/atomic-publication-evidence/sql-runtime.log
          grep -Fx 'IDENTITY ATOMIC PUBLICATION: OK (real DB publish, replay, rollback, factual conservation; structural target never becomes factual implicitly)' .local/atomic-publication-evidence/sql-runtime.log
      - name: Prove PostgreSQL atomic publication
        run: |
          set -euo pipefail
          CONNECTION='Host=localhost;Port=5432;Database=JornadaAtomicPublicationTest;Username=jornada;SSL Mode=Disable'
          JORNADA_PUBLICATION_PROVIDER=PostgreSql JORNADA_PUBLICATION_CONNECTION="$CONNECTION" \
            dotnet run --project .local/atomic-publication/AtomicPublicationSmoke.csproj -c Release --no-build --no-restore 2>&1 | tee .local/atomic-publication-evidence/pg-runtime.log
          grep -Fx 'IDENTITY ATOMIC PUBLICATION: OK (real DB publish, replay, rollback, factual conservation; structural target never becomes factual implicitly)' .local/atomic-publication-evidence/pg-runtime.log
      - name: Record fail-closed publication evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,os
          root=pathlib.Path('.local/atomic-publication-evidence')
          required=['commit.txt','test-build.log','tests.json','harness-build.log','sql-publication-second.log','pg-publication-second.log','sql-runtime.log','pg-runtime.log']
          missing=[n for n in required if not (root/n).is_file() or (root/n).stat().st_size==0]
          marker='IDENTITY ATOMIC PUBLICATION: OK (real DB publish, replay, rollback, factual conservation; structural target never becomes factual implicitly)'
          ok=(not missing and 'SQL_INSTALL_OK' in (root/'sql-publication-second.log').read_text(errors='replace')
              and 'PG_INSTALL_OK' in (root/'pg-publication-second.log').read_text(errors='replace')
              and all(marker in (root/n).read_text(errors='replace') for n in ['sql-runtime.log','pg-runtime.log']))
          summary={'schema':1,'commit':os.environ['GITHUB_SHA'],'status':'PASS' if ok else 'FAIL','missing':missing,
              'scope':'identity_composition_atomic_publication','sqlserver':ok,'postgresql':ok,
              'publication':True,'replay':True,'rollback':True,'factual_authority_conserved':True,
              'structural_target_used_implicitly':False,'receipt_state':'PUBLICADA'}
          (root/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          if not ok: raise SystemExit('atomic publication evidence incomplete')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: identity-atomic-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: Solution/.local/atomic-publication-evidence
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true