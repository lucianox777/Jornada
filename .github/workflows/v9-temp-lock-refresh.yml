name: v9-temp-lock-refresh

on:
  push:
    branches:
      - feat/v9-tf-population-base-train-20261013

permissions:
  contents: read

jobs:
  lock-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.112'
      - name: Compute canonical lock-file refresh (never commit from workflow)
        working-directory: Solution
        run: |
          set -euo pipefail
          dotnet restore Jornada.sln --use-lock-file --force-evaluate
          find . -name packages.lock.json -not -path './.local/*' -not -path '*/obj/*' -print0 | sort -z | tar --null -T - -czf refreshed-nuget-locks.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v9-temporary-refreshed-lock-files
          path: Solution/refreshed-nuget-locks.tar.gz
          if-no-files-found: error
          retention-days: 1
