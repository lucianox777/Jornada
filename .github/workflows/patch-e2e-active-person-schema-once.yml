name: patch-e2e-active-person-schema-once

on:
  push:
    paths:
      - '.github/workflows/patch-e2e-active-person-schema-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/nome-mae-nullable-v3
          fetch-depth: 0
      - name: Patch E2E active person schema lookup
        run: python3 Solution/scripts/patch-e2e-active-person-schema-once.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Solution/scripts/local-e2e.sh
          git diff --cached --quiet && exit 0
          git commit -m "fix: resolve schema cadastral ativo no E2E"
          git push origin HEAD:feat/nome-mae-nullable-v3
