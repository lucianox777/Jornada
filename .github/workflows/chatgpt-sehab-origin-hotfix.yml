name: chatgpt-sehab-origin-hotfix

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/chatgpt-sehab-origin-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Align current SEHAB origin code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          expected = {
              'Solution/database/Jornada_Seed_Dev.sql': 4,
              'Solution/database/Jornada_Dev_BackupDrill.sql': 1,
              'Solution/database/Jornada_Dev_SyntheticScale.sql': 1,
              'Solution/docs/API.md': 2,
              'Solution/tests/Jornada.Integration.Tests/Integration/SeedDatabaseTests.cs': 1,
              'Solution/tests/Jornada.Tests/Unit/IngestionContractTests.cs': 3,
              'Solution/tests/fixtures/ingestao/AA01_SEM_FATOS_v2/manifest.json': 1,
              'Solution/tests/fixtures/ingestao/AA01_v2/manifest.json': 1,
          }

          for name, count in expected.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8-sig')
              actual = text.count('HABITACAO')
              if actual != count:
                  raise SystemExit(f'{name}: esperado {count} ocorrências de HABITACAO, encontrado {actual}')
              path.write_text(text.replace('HABITACAO', 'SEHAB'), encoding='utf-8')

          baseline = Path('Solution/database/baselines/Jornada_Seed_Dev_v3.65.sql').read_text(encoding='utf-8-sig')
          if 'HABITACAO' not in baseline:
              raise SystemExit('baseline histórico v3.65 foi alterado ou não contém o código histórico esperado')

          release = Path('RELEASE_INFO.txt')
          text = release.read_text(encoding='utf-8')
          old = 'runtime_change=DDL_DYNAMIC_FIX;LOCAL_VALIDATION_ORCHESTRATION;TRX_EVIDENCE;NUGET_LOCK_REPRODUCIBILITY;DDL_UPGRADE_QUOTED_IDENTIFIER;STATIC_REGRESSION_GATE;NO_DOMAIN_CONTRACT_CHANGE'
          new = old + ';SEHAB_SYSTEM_ORIGIN_CODE_ALIGNMENT;FABRIC_CONNECTION_PRESERVATION'
          if old in text and new not in text:
              text = text.replace(old, new, 1)
          old_change = 'change=v4.05 corrige o SQL dinâmico da migração de vigência introduzida na v4.04 e, após execução real no GitHub Actions, corrige também a proveniência/reprodutibilidade dos packages.lock.json com SDK 8.0.424 e o harness de upgrade para QUOTED_IDENTIFIER ON; Base Normativa v3.64 e SolutionSchema 3.69 permanecem inalterados.'
          new_change = old_change[:-1] + '; o master pós-tag também preserva a conexão local Fabric e alinha o código corrente do sistema de origem da SEHAB para SEHAB, sem alterar os baselines históricos.'
          if old_change in text:
              text = text.replace(old_change, new_change, 1)
          release.write_text(text, encoding='utf-8')
          PY

      - name: Static closure and diff checks
        shell: bash
        run: |
          python3 Solution/scripts/technical-closure-gate.py
          git diff --check
          if grep -R --line-number --fixed-string 'HABITACAO' \
            Solution/database/Jornada_Seed_Dev.sql \
            Solution/database/Jornada_Dev_BackupDrill.sql \
            Solution/database/Jornada_Dev_SyntheticScale.sql \
            Solution/docs/API.md \
            Solution/tests/Jornada.Integration.Tests/Integration/SeedDatabaseTests.cs \
            Solution/tests/Jornada.Tests/Unit/IngestionContractTests.cs \
            Solution/tests/fixtures/ingestao/AA01_SEM_FATOS_v2/manifest.json \
            Solution/tests/fixtures/ingestao/AA01_v2/manifest.json; then
            echo 'HABITACAO ainda existe em artefato corrente.' >&2
            exit 1
          fi

      - name: Commit hotfix to master
        shell: bash
        run: |
          git config user.name 'lucianox777'
          git config user.email 'lucianovianna.backup@gmail.com'
          git add RELEASE_INFO.txt \
            Solution/database/Jornada_Seed_Dev.sql \
            Solution/database/Jornada_Dev_BackupDrill.sql \
            Solution/database/Jornada_Dev_SyntheticScale.sql \
            Solution/docs/API.md \
            Solution/tests/Jornada.Integration.Tests/Integration/SeedDatabaseTests.cs \
            Solution/tests/Jornada.Tests/Unit/IngestionContractTests.cs \
            Solution/tests/fixtures/ingestao/AA01_SEM_FATOS_v2/manifest.json \
            Solution/tests/fixtures/ingestao/AA01_v2/manifest.json
          git commit -m 'Alinha sistema de origem da SEHAB'
          git push origin HEAD:master
