name: v9-lite-serial-1k-physical-parity
on:
  pull_request:
    paths:
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9NestedCalibrationCli.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/Program.cs'
      - 'Solution/tests/scripts/test_v9_lite_experiment_contract.py'
      - '.github/workflows/v9-lite-serial-1k-physical-parity.yml'
permissions:
  contents: read
concurrency:
  group: v9-lite-1k-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  physical-parity:
    name: SQL physical shared-core V9 vs Lite (1k TRAIN)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      JORNADA_V9_LITE_EXPERIMENT: EXPLICIT_SYNTHETIC_TRAIN_ONLY
      V9_SQL_MEMORY_LIMIT_MB: "2048"
      V9_SQL_CONTAINER_MEMORY_MB: "3072"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify tested PR HEAD
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_lite_experiment_contract.py' -v
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Compile same CSharp scientific core
        working-directory: Solution
        run: |
          set -euo pipefail
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          dotnet build -c Release src/Jornada.Linkage.Parameters.Worker/Jornada.Linkage.Parameters.Worker.csproj
      - name: Start disposable SQL Server with masked ephemeral credential
        run: bash Solution/scripts/v9-tf-start-disposable-sql.sh
      - name: Initialize disposable SQL schema (no IBGE reload, TF0 only)
        working-directory: Solution
        run: |
          set -euo pipefail
          CID="v9-probe-sql-${{ github.run_id }}-${{ github.run_attempt }}"
          docker exec -u 0 "$CID" mkdir -p /var/opt/mssql/data/jornada/database
          docker cp database/. "$CID":/var/opt/mssql/data/jornada/database/
          sqlcmd_docker() {
            SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -w /var/opt/mssql/data/jornada -e SQLCMDPASSWORD "$CID" \
              /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b "$@"
          }
          sqlcmd_docker -Q "IF DB_ID(N'JornadaHarness') IS NOT NULL THROW 51000, 'Preexisting database', 1; CREATE DATABASE JornadaHarness;"
          sqlcmd_docker -d JornadaHarness -i database/Jornada_Fase1_v3.70.sql
          sqlcmd_docker -d JornadaHarness -i database/Jornada_Seed_Dev.sql
          sqlcmd_docker -d JornadaHarness -i database/migrations/20260907_Cpf_Ancora.sql
          sqlcmd_docker -d JornadaHarness -i database/migrations/20260910_Schema_Consolidation_370.sql
          sqlcmd_docker -d JornadaHarness -i database/migrations/20260930_Linkage_Z_Model_Config_Bundle_Fingerprint.sql
      - name: Generate 1k synthetic TRAIN fixture and SAME nested calibration plan
        working-directory: Solution
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v9-lite-parity"
          mkdir -p "$root"
          dotnet run --no-build -c Release --project src/Jornada.Linkage.SyntheticCorpus -- generate \
            --reference-root "$PWD/data/reference/ibge-nomes-2022" \
            --population-profile demographic-primary \
            --birth-daily-source "$PWD/data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json" \
            --error-profile clean --people 1000 --seed 42 \
            --out "$root/people-1k" > "$root/generation.log"
          python3 scripts/v9-nested-calibration-study.py \
            "$root/people-1k/observacoes.csv" "$root/plan.json" --plumbing-fixture
      - name: Execute original GOVERNED CSharp and Lite SERIAL on identical plan and SQL
        working-directory: Solution
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v9-lite-parity"
          corpus="$root/people-1k/observacoes.csv"
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- \
            --v9-calibrate "$root/plan.json" "$corpus" "$root/governed"
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- \
            --v9-lite-benchmark "$root/plan.json" "$corpus" "$root/lite"
      - name: Audit same science, report RAM/time and assert Lite mode is ungovened
        env:
          EXACT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v9-lite-parity'
          def load(p): return json.loads(p.read_bytes())
          a=load(root/'governed/selection-reference.json')
          b=load(root/'lite/selection-reference.json')
          for key in ('envelopeSha256','FinalistSnapshotShas','StopReason'):
              if a.get(key)!=b.get(key):
                  raise SystemExit('SCIENTIFIC_PARITY_FAILED:'+key)
          # Compare content-addressed fitted scientific artifacts independently.
          def fitted(directory):
              return sorted(p.name for p in directory.glob('*.fitted.json'))
          if fitted(root/'governed')!=fitted(root/'lite'):
              raise SystemExit('SCIENTIFIC_FIT_SHA_MISMATCH')
          ar=load(root/'governed/runtime-diagnostics.json')
          br=load(root/'lite/runtime-diagnostics.json')
          budget=load(root/'lite/calibration-resource-budget.json')
          scheduling=load(root/'lite/calibration-runtime-scheduling.json')
          if (budget.get('Schema')!='V9_LITE_SERIAL_BENCHMARK_V1' and
              budget.get('schema')!='V9_LITE_SERIAL_BENCHMARK_V1'):
              raise SystemExit('LITE_BUDGET_NOT_EXPERIMENTAL')
          if (br.get('effectiveParallelism')!=1 or scheduling!=[] or
              br.get('testUsed') or br.get('activated')):
              raise SystemExit('LITE_NOT_SERIAL_OR_NOT_ISOLATED')
          report={'schema':'V9_LITE_1K_PHYSICAL_PARITY_V1','headSha':os.environ['EXACT_SHA'],
                  'scienceIdentical':True,'fittedShaCount':len(fitted(root/'lite')),
                  'governed':{'elapsedMs':ar.get('totalMilliseconds'),'peakRssBytes':ar.get('peakWorkingSetBytes')},
                  'lite':{'elapsedMs':br.get('totalMilliseconds'),'peakRssBytes':br.get('peakWorkingSetBytes')},
                  'testUsed':False,'activated':False,'certified':False}
          (root/'parity-receipt.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print('PASS V9-Lite physical 1k same plan and fitted scientific hashes')
          PY
      - name: Upload only aggregated comparison without corpus or private rows
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9-lite-physical-parity-1k-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/v9-lite-parity/parity-receipt.json
            ${{ runner.temp }}/v9-lite-parity/governed/runtime-diagnostics.json
            ${{ runner.temp }}/v9-lite-parity/lite/runtime-diagnostics.json
            ${{ runner.temp }}/v9-lite-parity/lite/calibration-resource-budget.json
      - name: Destroy disposable SQL regardless of result
        if: always()
        run: docker rm -f "v9-probe-sql-${{ github.run_id }}-${{ github.run_attempt }}" >/dev/null 2>&1 || true
