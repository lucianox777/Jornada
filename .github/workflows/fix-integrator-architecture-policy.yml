name: fix-integrator-architecture-policy

on:
  push:
    branches:
      - work/integrador-identificador-config
    paths:
      - '.github/workflows/fix-integrator-architecture-policy.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Align architecture inventory and technical closure
        shell: python
        run: |
          import json
          from pathlib import Path

          policy_path = Path('Solution/config/release/architecture-dependencies.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          projects = policy['projects']
          projects['Jornada.Resultado.Api'] = ['Jornada.Operational.Sql']
          projects['Jornada.Integrador.CSharp'] = []
          projects['Jornada.Integrador.Tests'] = ['Jornada.Integrador.CSharp']
          policy['note'] = (
              'Matriz exata de ProjectReference permitidos. '
              'Jornada.Integrador.CSharp é cliente de borda sem dependência do núcleo; '
              'Jornada.Resultado.Api depende do adapter Jornada.Operational.Sql; '
              'Jornada.Integrador.Tests depende somente do cliente C#.'
          )
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          gate_path = Path('Solution/scripts/technical-closure-gate.py')
          gate = gate_path.read_text(encoding='utf-8')
          old = 'len(architecture.get("projects") or {}) != 15:\n        fail("architecture-dependencies.json deve cobrir os 15 projetos")'
          new = 'len(architecture.get("projects") or {}) != 18:\n        fail("architecture-dependencies.json deve cobrir os 18 projetos")'
          if old not in gate:
              raise SystemExit('expected architecture-count invariant not found')
          gate_path.write_text(gate.replace(old, new, 1), encoding='utf-8')
      - name: Commit corrected policy
        run: |
          git rm .github/workflows/fix-integrator-architecture-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Solution/config/release/architecture-dependencies.json Solution/scripts/technical-closure-gate.py
          git commit -m 'ci: align architecture policy with 18 projects'
          git push origin "HEAD:${GITHUB_REF_NAME}"
