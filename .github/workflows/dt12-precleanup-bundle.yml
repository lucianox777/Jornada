name: DT-12 Pre-cleanup Git Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'Solution/docs/evidence/DT12_PreCleanup_Request_20261001.yml'

permissions:
  contents: read

jobs:
  bundle:
    name: Create and verify pre-cleanup bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch all remote heads and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune --force origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --force --tags origin

      - name: Create snapshot refs and bundle
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p dt12-backup
          git show-ref | LC_ALL=C sort > dt12-backup/show-ref.txt
          git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin refs/tags | LC_ALL=C sort > dt12-backup/refs.txt

          git bundle create "dt12-backup/Jornada_DT12_pre_cleanup_${stamp}.bundle" --all
          bundle="$(find dt12-backup -name '*.bundle' -type f -print -quit)"
          git bundle verify "$bundle" 2>&1 | tee dt12-backup/bundle-verify.txt
          sha256sum "$bundle" | tee dt12-backup/SHA256SUMS.txt
          git bundle list-heads "$bundle" | LC_ALL=C sort > dt12-backup/bundle-heads.txt

          awk '$1 ~ /^refs\/remotes\/origin\// && $1 != "refs/remotes/origin/HEAD" {print $2 " " $1}' dt12-backup/refs.txt | LC_ALL=C sort > dt12-backup/expected-remote-heads.txt
          grep ' refs/remotes/origin/' dt12-backup/bundle-heads.txt | grep -v ' refs/remotes/origin/HEAD$' | LC_ALL=C sort > dt12-backup/bundled-remote-heads.txt
          diff -u dt12-backup/expected-remote-heads.txt dt12-backup/bundled-remote-heads.txt

          awk '$1 ~ /^refs\/tags\// {print $2 " " $1}' dt12-backup/refs.txt | LC_ALL=C sort > dt12-backup/expected-tags.txt
          grep ' refs/tags/' dt12-backup/bundle-heads.txt | LC_ALL=C sort > dt12-backup/bundled-tags.txt
          diff -u dt12-backup/expected-tags.txt dt12-backup/bundled-tags.txt
          grep -q ' refs/heads/master$' dt12-backup/bundle-heads.txt

      - name: Test restoration from bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(find dt12-backup -name '*.bundle' -type f -print -quit)"
          repo="$PWD/dt12-restore-test/repo.git"
          mkdir -p "$(dirname "$repo")"
          git init --bare "$repo"
          git -C "$repo" fetch "$PWD/$bundle" '+refs/*:refs/*'
          git -C "$repo" fsck --full
          git -C "$repo" show-ref | LC_ALL=C sort > dt12-backup/restored-show-ref.txt
          grep -v ' HEAD          test -n "$(git -C "$repo" rev-parse refs/heads/master)"

      - name: Upload temporary backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Jornada-DT12-pre-cleanup-backup
          path: dt12-backup/
          if-no-files-found: error
          retention-days: 7
 dt12-backup/bundle-heads.txt > dt12-backup/restorable-bundle-heads.txt
          diff -u dt12-backup/restorable-bundle-heads.txt dt12-backup/restored-show-ref.txt
          test -n "$(git -C "$repo" rev-parse refs/heads/master)"

      - name: Upload temporary backup artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Jornada-DT12-pre-cleanup-backup
          path: dt12-backup/
          if-no-files-found: error
          retention-days: 7
