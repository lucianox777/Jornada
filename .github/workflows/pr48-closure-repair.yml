name: pr48-closure-repair

on:
  push:
    branches:
      - work/progressive-identity-origin-api
    paths:
      - .github/workflows/pr48-closure-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: work/progressive-identity-origin-api
          fetch-depth: 1
          persist-credentials: true
      - name: Apply exactly two guarded changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path

          expected_head = 'd63c3c83a3a486d7740c3c2a470ceec8835531d5'
          branch = 'work/progressive-identity-origin-api'
          parent = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          if parent != expected_head:
              raise SystemExit('Unexpected repair parent; refusing to modify the branch')
          if subprocess.check_output(['git', 'branch', '--show-current'], text=True).strip() != branch:
              raise SystemExit('Unexpected branch')
          if subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip():
              raise SystemExit('Checkout is not clean')
          replacements = [
              (
                  'Solution/scripts/technical-closure-gate.py',
                  '81d3210cedac255acbf2672d14737e929e8b957e',
                  b'        "dependency-drift-gate.py",\n        "deterministic-build:",',
                  b'        "dependency-drift-gate.py",\n        "coverage-evidence-gate.py",\n        "deterministic-build:",',
              ),
              (
                  '.github/workflows/ci.yml',
                  'c64434ed2bee0db3fcc278dc26e948760a8f5781',
                  b'      - name: OpenAPI runtime conformance must execute for all 18 operations',
                  b'      - name: OpenAPI runtime conformance must execute for all 19 operations',
              ),
          ]
          for name, expected_sha, old, new in replacements:
              path = Path(name)
              data = path.read_bytes()
              actual_sha = subprocess.check_output(['git', 'hash-object', '--', name], text=True).strip()
              if actual_sha != expected_sha:
                  raise SystemExit(f'Unexpected original blob: {name}: {actual_sha}')
              if data.count(old) != 1 or new in data:
                  raise SystemExit(f'Replacement is not unique or was already applied: {name}')
              updated = data.replace(old, new, 1)
              if updated.replace(new, old, 1) != data:
                  raise SystemExit(f'Unexpected replacement result: {name}')
              if name.endswith('.py'):
                  compile(updated, name, 'exec')
              path.write_bytes(updated)
          subprocess.run(['git', 'diff', '--check'], check=True)
          expected_stats = {
              'Solution/scripts/technical-closure-gate.py': ('1', '0'),
              '.github/workflows/ci.yml': ('1', '1'),
          }
          stats = {}
          for line in subprocess.check_output(['git', 'diff', '--numstat'], text=True).splitlines():
              added, deleted, name = line.split('\t')
              stats[name] = (added, deleted)
          if stats != expected_stats:
              raise SystemExit(f'Unexpected diff: {stats}')
          subprocess.run(['git', 'add', '--', *expected_stats], check=True)
          subprocess.run(['git', 'rm', '--', '.github/workflows/pr48-closure-repair.yml'], check=True)
          statuses = subprocess.check_output(['git', 'diff', '--cached', '--name-status'], text=True).splitlines()
          expected_statuses = sorted([
              'M\t.github/workflows/ci.yml',
              'D\t.github/workflows/pr48-closure-repair.yml',
              'M\tSolution/scripts/technical-closure-gate.py',
          ])
          if sorted(statuses) != expected_statuses:
              raise SystemExit(f'Unexpected staged paths: {statuses}')
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - name: Commit and push the verified repair
        shell: bash
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore closure coverage guard and sync OpenAPI operation count'
          git push origin HEAD:refs/heads/work/progressive-identity-origin-api
