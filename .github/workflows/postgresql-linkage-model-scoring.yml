# Validação solicitada após a atualização do plano GitHub Actions.
# Este commit não altera comandos, modelos, limiares ou regras de publicação.
name: jornada-postgresql-linkage-model-scoring

on:
  push:
    paths:
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Contracts/**'
      - 'Solution/src/Jornada.Operational.Sql/**'
      - 'Solution/database/postgresql/**'
      - 'Solution/tests/Jornada.Tests/Integration/PostgreSqlLinkageScoringTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/ProbabilisticLinkagePolicyTests.cs'
      - 'Solution/scripts/postgresql-linkage-evidence.sh'
      - '.github/workflows/postgresql-linkage-model-scoring.yml'
  pull_request:
    paths:
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Contracts/**'
      - 'Solution/src/Jornada.Operational.Sql/**'
      - 'Solution/database/postgresql/**'
      - 'Solution/tests/Jornada.Tests/Integration/PostgreSqlLinkageScoringTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/ProbabilisticLinkagePolicyTests.cs'
      - 'Solution/scripts/postgresql-linkage-evidence.sh'
      - '.github/workflows/postgresql-linkage-model-scoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-linkage-model-scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
        shell: bash
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: jornada
          POSTGRES_DB: JornadaPgLinkageTest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jornada -d JornadaPgLinkageTest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JORNADA_POSTGRESQL_CONNECTION: 'Host=localhost;Port=5432;Database=JornadaPgLinkageTest;Username=jornada;SSL Mode=Disable'
      JORNADA_POSTGRESQL_LINKAGE_TESTS: '1'
      JORNADA_LINKAGE_EVIDENCE_DIR: ${{ github.workspace }}/Solution/.local/postgresql-linkage-evidence
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.424'
      - name: Record toolchain and runner start
        run: |
          bash scripts/postgresql-linkage-evidence.sh run environment bash -c 'set -euo pipefail; dotnet --info; git rev-parse HEAD; docker --version; psql --version'
      - name: Restore locked dependencies
        run: |
          bash scripts/postgresql-linkage-evidence.sh run restore dotnet restore tests/Jornada.Tests/Jornada.Tests.csproj --locked-mode -v:normal "-bl:$JORNADA_LINKAGE_EVIDENCE_DIR/restore.binlog;ProjectImports=None"
      - name: Build real Runner and tests
        run: |
          bash scripts/postgresql-linkage-evidence.sh run build dotnet build tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-restore -warnaserror -v:normal "-bl:$JORNADA_LINKAGE_EVIDENCE_DIR/build.binlog;ProjectImports=None"
      - name: Install PostgreSQL cores twice
        run: |
          bash scripts/postgresql-linkage-evidence.sh run ddl bash -c '
            set -euo pipefail
            CID=$(docker ps -q --filter publish=5432 | head -1)
            test -n "$CID"
            for pass in 1 2; do
              for core in Jornada_Resultado_Core Jornada_Ingestion_Processor_Core Jornada_Processor_Persistence_Core Jornada_Linkage_Model_Core Jornada_Linkage_RuleSet_Passes; do
                echo "Installing $core (pass $pass)"
                docker exec -i "$CID" psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose --echo-errors --single-transaction -U jornada -d JornadaPgLinkageTest < "database/postgresql/$core.sql"
              done
            done'
      - name: Existing Fellegi-Sunter regressions
        run: |
          bash scripts/postgresql-linkage-evidence.sh run unit dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~FellegiSunterScoringTests' --logger 'trx;LogFileName=linkage-unit.trx' --results-directory "$JORNADA_LINKAGE_EVIDENCE_DIR"
      - name: Shared policy regressions
        run: |
          bash scripts/postgresql-linkage-evidence.sh run policy dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ProbabilisticLinkagePolicyTests' --logger 'trx;LogFileName=linkage-policy.trx' --results-directory "$JORNADA_LINKAGE_EVIDENCE_DIR"
      - name: Real PostgreSQL model and scoring regression
        run: |
          bash scripts/postgresql-linkage-evidence.sh run integration dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'TestCategory=PostgreSqlLinkage' --logger 'trx;LogFileName=postgresql-linkage.trx' --results-directory "$JORNADA_LINKAGE_EVIDENCE_DIR"
      - name: Summarize validation evidence
        if: always()
        run: bash scripts/postgresql-linkage-evidence.sh summary
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-linkage-model-scoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: Solution/.local/postgresql-linkage-evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
