name: jornada-postgresql-linkage-model-scoring

on:
  push:
    paths:
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Contracts/**'
      - 'Solution/src/Jornada.Operational.Sql/**'
      - 'Solution/database/postgresql/**'
      - 'Solution/tests/Jornada.Tests/Integration/PostgreSqlLinkageScoringTests.cs'
      - '.github/workflows/postgresql-linkage-model-scoring.yml'
  pull_request:
    paths:
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Contracts/**'
      - 'Solution/src/Jornada.Operational.Sql/**'
      - 'Solution/database/postgresql/**'
      - 'Solution/tests/Jornada.Tests/Integration/PostgreSqlLinkageScoringTests.cs'
      - '.github/workflows/postgresql-linkage-model-scoring.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-linkage-model-scoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
        shell: bash
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: jornada
          POSTGRES_DB: JornadaPgLinkageTest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jornada -d JornadaPgLinkageTest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      JORNADA_POSTGRESQL_CONNECTION: 'Host=localhost;Port=5432;Database=JornadaPgLinkageTest;Username=jornada;SSL Mode=Disable'
      JORNADA_POSTGRESQL_LINKAGE_TESTS: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Restore and build real Runner and tests
        run: |
          set -euo pipefail
          dotnet restore tests/Jornada.Tests/Jornada.Tests.csproj --locked-mode
          dotnet build tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-restore -warnaserror
      - name: Install PostgreSQL cores twice
        run: |
          set -euo pipefail
          CID=$(docker ps -q --filter publish=5432 | head -1)
          test -n "$CID"
          for pass in 1 2; do
            docker exec -i "$CID" psql -v ON_ERROR_STOP=1 -U jornada -d JornadaPgLinkageTest < database/postgresql/Jornada_Resultado_Core.sql
            docker exec -i "$CID" psql -v ON_ERROR_STOP=1 -U jornada -d JornadaPgLinkageTest < database/postgresql/Jornada_Ingestion_Processor_Core.sql
            docker exec -i "$CID" psql -v ON_ERROR_STOP=1 -U jornada -d JornadaPgLinkageTest < database/postgresql/Jornada_Processor_Persistence_Core.sql
            docker exec -i "$CID" psql -v ON_ERROR_STOP=1 -U jornada -d JornadaPgLinkageTest < database/postgresql/Jornada_Linkage_Model_Core.sql
          done
      - name: Existing Fellegi-Sunter unit regressions
        run: |
          set -euo pipefail
          mkdir -p .local/postgresql-linkage-evidence
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~FellegiSunterScoringTests' --logger 'trx;LogFileName=linkage-unit.trx' --results-directory .local/postgresql-linkage-evidence
      - name: Real PostgreSQL model and scoring regression
        run: |
          set -euo pipefail
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'TestCategory=PostgreSqlLinkage' --logger 'trx;LogFileName=postgresql-linkage.trx' --results-directory .local/postgresql-linkage-evidence
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-linkage-model-scoring-evidence
          path: Solution/.local/postgresql-linkage-evidence/
          retention-days: 30
          if-no-files-found: ignore
