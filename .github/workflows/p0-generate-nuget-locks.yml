name: P0 NuGet lock generation (temporary)
on:
  push:
    branches:
      - fix/p0-generate-nuget-locks-actions
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Generate locks for projects outside Jornada.sln
        working-directory: Solution
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = "10.0.113"
          dotnet restore Jornada.sln --use-lock-file --force-evaluate
          if ! git diff --quiet -- '**/packages.lock.json'; then
            echo "::error::Existing NuGet lock files changed"
            git diff --stat -- '**/packages.lock.json'
            exit 1
          fi
          dotnet restore tests/PartitionIntegritySmoke/PartitionIntegritySmoke.csproj --use-lock-file
          for lock in src/Jornada.Linkage.SyntheticCorpus.Parametrized/packages.lock.json tests/PartitionIntegritySmoke/packages.lock.json; do
            test -s "$lock" || { echo "::error::Missing $lock"; exit 1; }
          done
          dotnet restore tests/PartitionIntegritySmoke/PartitionIntegritySmoke.csproj --locked-mode
          python3 scripts/nuget-lock-gate.py --root .
          sha256sum src/Jornada.Linkage.SyntheticCorpus.Parametrized/packages.lock.json tests/PartitionIntegritySmoke/packages.lock.json
      - name: Publish generated lock files (not a commit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p0-generated-nuget-locks
          path: |
            Solution/src/Jornada.Linkage.SyntheticCorpus.Parametrized/packages.lock.json
            Solution/tests/PartitionIntegritySmoke/packages.lock.json
          if-no-files-found: error
          retention-days: 7
