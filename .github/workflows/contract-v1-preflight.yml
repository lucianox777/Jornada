name: jornada-contract-v1-preflight

on:
  pull_request:
    paths:
      - 'Solution/scripts/contract-v1-preflight.py'
      - 'Solution/scripts/tests/test_contract_v1_preflight.py'
      - 'Solution/config/contracts/gestores/**'
      - 'Solution/config/governance/schema-approvals.json'
      - '.github/workflows/contract-v1-preflight.yml'
  push:
    paths:
      - 'Solution/scripts/contract-v1-preflight.py'
      - 'Solution/scripts/tests/test_contract_v1_preflight.py'
      - 'Solution/config/contracts/gestores/**'
      - 'Solution/config/governance/schema-approvals.json'
      - '.github/workflows/contract-v1-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Behavioral self-tests (no SQL, no Docker)
        run: python3 Solution/scripts/tests/test_contract_v1_preflight.py -v
      - name: Verify repository contract/approval inventory (read-only)
        run: python3 Solution/scripts/contract-v1-preflight.py --root Solution
