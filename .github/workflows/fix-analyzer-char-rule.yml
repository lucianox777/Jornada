name: fix-analyzer-char-rule

on:
  push:
    branches:
      - work/integrador-identificador-config
    paths:
      - '.github/workflows/fix-analyzer-char-rule.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Align static analyzer companion with Roslyn
        shell: python
        run: |
          from pathlib import Path

          api = Path('Solution/src/Jornada.Resultado.Api/Program.cs')
          text = api.read_text(encoding='utf-8')
          replacements = {
              'value.Contains("/", StringComparison.Ordinal)': "value.Contains('/')",
              'value.Contains("\\\\", StringComparison.Ordinal)': "value.Contains('\\\\')",
              'value.Contains(":", StringComparison.Ordinal)': "value.Contains(':')",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected API expression not found: {old}')
              text = text.replace(old, new, 1)
          api.write_text(text, encoding='utf-8')

          gate = Path('Solution/scripts/analyzer-cleanliness-gate.py')
          text = gate.read_text(encoding='utf-8')
          old = '''            if re.search(r"\\.(?:Contains|IndexOf)\\('[^']'\\)", line):\n                fail(f"{p.relative_to(ROOT)}:{lineno}: comparação char sem StringComparison")'''
          new = '''            # Contains(char)/IndexOf(char) are ordinal by definition and CA1847 prefers char overloads.\n            # String overloads still need an explicit comparison mode.\n            if re.search(r'\\.(?:Contains|IndexOf)\\("[^"]*"\\)', line) and "StringComparison." not in line:\n                fail(f"{p.relative_to(ROOT)}:{lineno}: comparação string sem StringComparison")'''
          if old not in text:
              raise SystemExit('expected char-comparison gate rule not found')
          gate.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit analyzer semantics fix
        run: |
          git rm .github/workflows/fix-analyzer-char-rule.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Solution/src/Jornada.Resultado.Api/Program.cs Solution/scripts/analyzer-cleanliness-gate.py
          git commit -m 'fix: align char comparison gate with Roslyn'
          git push origin "HEAD:${GITHUB_REF_NAME}"
