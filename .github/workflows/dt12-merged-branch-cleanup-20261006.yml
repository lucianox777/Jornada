name: DT-12 Merged Branch Cleanup

on:
  push:
    branches:
      - master
    paths:
      - 'Solution/docs/evidence/DT12_Merged_Branch_Delete_Authorization_20261006.json'

permissions:
  contents: write

concurrency:
  group: dt12-merged-branch-cleanup-20261006
  cancel-in-progress: false

jobs:
  cleanup:
    name: Revalidate and delete merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout authorization commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Execute fail-closed merged-branch cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 Solution/scripts/dt12-merged-branch-cleanup.py \
            --repository "${GITHUB_REPOSITORY}" \
            --authorization-file Solution/docs/evidence/DT12_Merged_Branch_Delete_Authorization_20261006.json \
            --execute \
            --report Solution/.local/dt12-merged-cleanup/report.json

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dt12-merged-branch-cleanup-report
          path: Solution/.local/dt12-merged-cleanup/report.json
          if-no-files-found: warn
          retention-days: 90
