name: fix-person-v3-schema-ids-once

on:
  push:
    paths:
      - '.github/workflows/fix-person-v3-schema-ids-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/nome-mae-nullable-v3
          fetch-depth: 0
      - name: Add schema ids and refresh hashes
        run: python3 Solution/scripts/fix-person-v3-schema-ids-once.py
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Solution/config/contracts/gestores/*/pessoa/v3/pessoa.schema.json Solution/config/governance/schema-approvals.json Solution/database/Jornada_Seed_Dev.sql
          git diff --cached --quiet && exit 0
          git commit -m "fix: identifica e sela contratos Pessoa v3 por Gestor"
          git push origin HEAD:feat/nome-mae-nullable-v3
