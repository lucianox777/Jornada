name: V9 full operational SQL schema read-only preflight (no TEST)

# Explicit PR-only physical DDL proof; this is NOT the independent TEST 100k,
# does not run RunAsync, does not select or activate a model and never publishes.
on:
  pull_request:
    paths:
      - '.github/workflows/v9-real-schema-preflight.yml'
      - 'Solution/database/testing/20261114_V9_Operational_Schema_Readonly_Preflight.sql'
      - 'Solution/database/migrations/20261113_V9_Operational_Frozen_Model_Conversion.sql'
      - 'Solution/tests/scripts/test_v9_real_schema_readonly_preflight.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-schema-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          persist-credentials: false
      - name: Verify static guards and immutable source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest Solution/tests/scripts/test_v9_real_schema_readonly_preflight.py
          git diff --check
          echo "V9_FULL_SCHEMA_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Launch pinned and disposable DEV SQL Server
        shell: bash
        run: bash Solution/scripts/v9-tf-start-disposable-sql.sh
      - name: Test negative guards, apply canonical schema and run read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          sql_name="v9-probe-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          workdir="$RUNNER_TEMP/v9-real-schema-proof"
          mkdir -p "$workdir"
          # Only repository SQL DDL copied. Never mount PROD data or sealed TEST.
          docker exec -u 0 "$sql_name" sh -c 'mkdir -p /work/Solution && chmod 755 /work /work/Solution'
          docker cp Solution/database "$sql_name":/work/Solution/
          run_sql() {
            docker exec "$sql_name" sh -c \
              'cd /work/Solution && SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d "$1" -i "$2"' \
              sh "$1" "$2"
          }
          docker exec "$sql_name" sh -c \
            'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d master -Q "CREATE DATABASE JornadaHarness;"'
          # A bare database must fail the full-schema gate, never produce PASS.
          if run_sql JornadaHarness database/testing/20261114_V9_Operational_Schema_Readonly_Preflight.sql >"$workdir/missing-schema.log" 2>&1; then
            echo "::error::Preflight accepted an empty database"
            exit 1
          fi
          if ! grep -q '52621' "$workdir/missing-schema.log"; then
            echo "::error::Preflight failed for unexpected reason on empty schema"
            exit 1
          fi
          echo "PASS: empty schema rejected with 52621"
          # This is the canonical generated v3.70 SQLCMD include graph, not a
          # clone of linkage_run/Gold/Serving. Its :r includes require cwd.
          run_sql JornadaHarness database/Jornada_Fase1_v3.70.sql >"$workdir/schema-apply.log" 2>&1 || {
            echo "::error::Canonical full-schema application failed"
            tail -n 60 "$workdir/schema-apply.log"
            exit 1
          }
          # V9 frozen winner DDL is additive and not part of the sealed manifest.
          # It is loaded separately without model rows, activation or publication.
          run_sql JornadaHarness database/migrations/20261113_V9_Operational_Frozen_Model_Conversion.sql >"$workdir/v9-model-ddl.log" 2>&1 || {
            echo "::error::V9 TEST_ONLY model DDL failed"
            tail -n 60 "$workdir/v9-model-ddl.log"
            exit 1
          }
          run_sql JornadaHarness database/testing/20261114_V9_Operational_Schema_Readonly_Preflight.sql >"$workdir/preflight.log" 2>&1 || {
            echo "::error::Full-schema V9 preflight failed"
            tail -n 60 "$workdir/preflight.log"
            exit 1
          }
          grep -q 'SCHEMA_PREFLIGHT_PASS_NOT_RUNTIME_PARITY' "$workdir/preflight.log"
          grep -q 'LEGACY_FK_TO_MODELO_LINKAGE' "$workdir/preflight.log"
          grep -q 'V9_TEST_ONLY_IMMUTABLE' "$workdir/preflight.log"
          grep -q 'NOT_EXECUTED' "$workdir/preflight.log"
          grep -q 'NOT_MEASURED' "$workdir/preflight.log"
          grep -q 'BLOCKED' "$workdir/preflight.log"
          # Explicitly refuse running the same preflight against a non-harness database.
          if run_sql master database/testing/20261114_V9_Operational_Schema_Readonly_Preflight.sql >"$workdir/wrong-db.log" 2>&1; then
            echo "::error::Preflight accepted master database"
            exit 1
          fi
          if ! grep -q '52620' "$workdir/wrong-db.log"; then
            echo "::error::Wrong-database guard failed for unexpected reason"
            exit 1
          fi
          # Only sanitized evidence is uploaded. Do not upload SQL credentials,
          # schemas, private data, model bytes or raw Docker logs.
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "schema=Jornada_Fase1_v3.70.sql + V9_TEST_ONLY_DDL"
            echo "missing_schema=REJECTED_52621"
            echo "wrong_database=REJECTED_52620"
            echo "preflight=SCHEMA_PREFLIGHT_PASS_NOT_RUNTIME_PARITY"
            echo "runasync=NOT_EXECUTED"
            echo "gold_serving=NOT_MEASURED"
            echo "independent_test_100k=BLOCKED"
            echo "publication_authorized=false"
            echo "no_sealed_test_consumed=true"
          } >"$workdir/receipt.txt"
          echo "PASS: real-schema DDL preflight only; no RunAsync, no Gold/Serving evidence, TEST blocked"
      - name: Store sanitized structural-only receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-real-schema-preflight-readonly
          path: ${{ runner.temp }}/v9-real-schema-proof/receipt.txt
          if-no-files-found: error
          retention-days: 30
      - name: Remove disposable SQL Server
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sql_name="v9-probe-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker rm -f "$sql_name" >/dev/null 2>&1 || true
