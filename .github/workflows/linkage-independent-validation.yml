name: jornada-linkage-independent-validation

on:
  push:
    paths:
      - 'Solution/database/Jornada_Dev_LinkageValidation.sql'
      - 'Solution/database/Jornada_Dev_SyntheticScale*.sql'
      - 'Solution/scripts/local-linkage-validation.*'
      - 'Solution/scripts/local-linkage-evidence-readiness.ps1'
      - 'Solution/scripts/local-linkage-triplet-collision-audit.ps1'
      - 'Solution/scripts/local-cluster.*'
      - 'Solution/scripts/local-db.*'
      - 'Solution/docker-compose.yml'
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/**'
      - 'Solution/src/Jornada.Processor.Worker/**'
      - 'Solution/src/Jornada.Contracts/PersonResolutionContractCatalog.cs'
      - 'Solution/src/Jornada.Contracts/LinkageParameterCatalog.cs'
      - 'Solution/database/migrations/20260913_Pessoa_Identificadores_Multiplos.sql'
      - 'Solution/config/catalog/atributos-transversais.json'
      - '.github/workflows/linkage-independent-validation.yml'
  pull_request:
    paths:
      - 'Solution/database/Jornada_Dev_LinkageValidation.sql'
      - 'Solution/database/Jornada_Dev_SyntheticScale*.sql'
      - 'Solution/scripts/local-linkage-validation.*'
      - 'Solution/scripts/local-linkage-evidence-readiness.ps1'
      - 'Solution/scripts/local-linkage-triplet-collision-audit.ps1'
      - 'Solution/scripts/local-cluster.*'
      - 'Solution/scripts/local-db.*'
      - 'Solution/docker-compose.yml'
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/**'
      - 'Solution/src/Jornada.Processor.Worker/**'
      - 'Solution/src/Jornada.Contracts/PersonResolutionContractCatalog.cs'
      - 'Solution/src/Jornada.Contracts/LinkageParameterCatalog.cs'
      - 'Solution/database/migrations/20260913_Pessoa_Identificadores_Multiplos.sql'
      - 'Solution/config/catalog/atributos-transversais.json'
      - '.github/workflows/linkage-independent-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Parse validation entrypoints
        shell: bash
        run: |
          bash -n scripts/local-linkage-validation.sh
          pwsh -NoLogo -NoProfile -Command '$ErrorActionPreference="Stop"; $bytes=[IO.File]::ReadAllBytes("scripts/local-linkage-validation.ps1"); if($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF){ throw "UTF-8 BOM ausente" }; $null=[scriptblock]::Create((Get-Content -Raw -Encoding UTF8 "scripts/local-linkage-validation.ps1")); Write-Host "LINKAGE VALIDATION POWERSHELL PARSE: OK"'
          pwsh -NoLogo -NoProfile -Command '$ErrorActionPreference="Stop"; $bytes=[IO.File]::ReadAllBytes("scripts/local-linkage-evidence-readiness.ps1"); if($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF){ throw "UTF-8 BOM ausente" }; $null=[scriptblock]::Create((Get-Content -Raw -Encoding UTF8 "scripts/local-linkage-evidence-readiness.ps1")); Write-Host "LINKAGE EVIDENCE READINESS POWERSHELL PARSE: OK"'
          pwsh -NoLogo -NoProfile -Command '$ErrorActionPreference="Stop"; $bytes=[IO.File]::ReadAllBytes("scripts/local-linkage-triplet-collision-audit.ps1"); if($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF){ throw "UTF-8 BOM ausente" }; $null=[scriptblock]::Create((Get-Content -Raw -Encoding UTF8 "scripts/local-linkage-triplet-collision-audit.ps1")); Write-Host "LINKAGE TRIPLET COLLISION POWERSHELL PARSE: OK"'

      - name: Start canonical local cluster
        shell: bash
        run: bash scripts/local-cluster.sh up

      - name: Calibrate before validation corpus exists
        shell: bash
        run: |
          SQL_PASSWORD="$(awk -F= '$1=="JORNADA_SQL_SA_PASSWORD"{sub(/^[^=]*=/,""); print; exit}' .env)"
          test -n "$SQL_PASSWORD"
          validation_count="$(docker compose --env-file .env exec -T -e "SQLCMDPASSWORD=$SQL_PASSWORD" sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -d JornadaLocal -W -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM silver.pessoa_observacao WHERE codigo_pessoa_origem LIKE 'SCALE-VAL-%';" | tr -d '\r' | xargs)"
          test "$validation_count" = '0'
          bash scripts/local-cluster.sh calibrate
          echo 'CALIBRATION PRECEDES VALIDATION CORPUS: OK'

      - name: Run independent adversarial validation
        shell: bash
        run: bash scripts/local-linkage-validation.sh

      - name: Exercise PowerShell validation entrypoint
        shell: pwsh
        run: |
          # pwsh -NoLogo -NoProfile -File ./scripts/local-linkage-validation.ps1
          Write-Host '# pwsh -NoLogo -NoProfile -File ./scripts/local-linkage-validation.ps1'
          & ./scripts/local-linkage-validation.ps1
          if ($LASTEXITCODE -ne 0) { throw "local-linkage-validation.ps1 falhou ($LASTEXITCODE)." }

      - name: Validate safety/report semantics
        shell: bash
        run: |
          set -euo pipefail
          report='.local/linkage-validation/validation-report.json'
          jq -e '
            (.model.runtimeFingerprint | type=="string" and length>0)
            and .model.priorProvenance.estimatorFormula == "clamp(DISTINCT_BIRTH_DATE / POPULATION_SIZE, 0.000001, PRIOR_BLOCK_MAX)"
            and .model.priorProvenance.populationSize > 0
            and .model.priorProvenance.distinctBirthDates > 0
            and (.negative.generatorIntendedEvidenceProfiles | length) == 4
            and (.negative.plannedColliderAlignment | length) == 4
            and (.negative.observedBestScoreStates | length) > 0
            and .capabilityAssessment.isGate == false
            and (
              (.combinedDecisionQuality.resolvedDecisions == 0 and .combinedDecisionQuality.syntheticResolvedPpv == null)
              or
              (.combinedDecisionQuality.resolvedDecisions > 0 and .combinedDecisionQuality.syntheticResolvedPpv != null)
            )
            and (.nominalOrderRestriction.zeroMatchedSupportStates | type=="array")
          ' "$report" >/dev/null
          echo 'LINKAGE SAFETY/REPORT SEMANTICS: OK'

      - name: Validate policy counterfactual evidence
        shell: bash
        run: |
          set -euo pipefail
          report='.local/linkage-validation/validation-report.json'
          jq -e '
            .counterfactualNoDualThresholdGuard.purpose == "READ_ONLY_POLICY_COUNTERFACTUAL"
            and .counterfactualNoDualThresholdGuard.changesPolicy == false
            and .counterfactualNoDualThresholdGuard.removedRuleOnly == "SCORING_DUAL_THRESHOLD_CONFLICT_V1"
            and .counterfactualNoDualThresholdGuard.positive.total == 40
            and .counterfactualNoDualThresholdGuard.negative.total == 40
            and (.counterfactualNoDualThresholdGuard.retainedRules | index("T_LINKAGE") != null)
            and (.counterfactualNoDualThresholdGuard.retainedRules | index("CONFLICT_MARGIN_LOG_ODDS") != null)
          ' "$report" >/dev/null
          echo 'LINKAGE POLICY COUNTERFACTUAL EVIDENCE: OK'

      - name: Validate dual-threshold margin frontier evidence
        shell: bash
        run: |
          set -euo pipefail
          report='.local/linkage-validation/validation-report.json'
          jq -e '
            .dualThresholdMarginFrontier.purpose == "READ_ONLY_MARGIN_POLICY_DIAGNOSTIC"
            and .dualThresholdMarginFrontier.changesPolicy == false
            and .dualThresholdMarginFrontier.eligibleRows > 0
            and .dualThresholdMarginFrontier.positiveRows > 0
            and .dualThresholdMarginFrontier.negativeRows > 0
            and (.dualThresholdMarginFrontier.frontier | length) > 0
            and .dualThresholdMarginFrontier.currentConflictMarginLogOdds == .counterfactualNoDualThresholdGuard.conflictMarginLogOdds
          ' "$report" >/dev/null
          echo 'LINKAGE DUAL-THRESHOLD MARGIN FRONTIER EVIDENCE: OK'

      - name: Validate current-evidence identifiability boundary
        shell: bash
        run: |
          set -euo pipefail
          report='.local/linkage-validation/validation-report.json'
          jq -e '
            .currentEvidenceIdentifiability.purpose == "READ_ONLY_CURRENT_EVIDENCE_IDENTIFIABILITY"
            and .currentEvidenceIdentifiability.changesPolicy == false
            and .currentEvidenceIdentifiability.observationalOverlapDetected == true
            and .currentEvidenceIdentifiability.positiveExact.allCurrentEvidenceExactToBestCandidate > 0
            and .currentEvidenceIdentifiability.negativeHardHomonym.allCurrentEvidenceExactToBestCandidate > 0
            and .currentEvidenceIdentifiability.sharedEvidenceState == "EXACT/EXACT/EXACT"
            and (.currentEvidenceIdentifiability.evidenceFields | sort) == (["NOME","NOME_MAE","DATA_NASCIMENTO"] | sort)
          ' "$report" >/dev/null
          echo 'LINKAGE CURRENT-EVIDENCE IDENTIFIABILITY BOUNDARY: OK'

      - name: Run additional evidence readiness
        shell: pwsh
        run: |
          Write-Host '# pwsh -NoLogo -NoProfile -File ./scripts/local-linkage-evidence-readiness.ps1'
          & ./scripts/local-linkage-evidence-readiness.ps1
          if ($LASTEXITCODE -ne 0) { throw "local-linkage-evidence-readiness.ps1 falhou ($LASTEXITCODE)." }

      - name: Validate additional evidence readiness contract
        shell: bash
        run: |
          set -euo pipefail
          report='.local/linkage-evidence-readiness/evidence-readiness.json'
          jq -e '
            .purpose == "READ_ONLY_ADDITIONAL_IDENTITY_EVIDENCE_READINESS"
            and .changesPolicy == false
            and .changesScoring == false
            and .changesThresholds == false
            and (.currentProbabilisticScore.fields | sort) == (["NOME","NOME_MAE","DATA_NASCIMENTO"] | sort)
            and ([.validationCoverage[] | select(.segment=="ALL")][0].total == 80)
            and ([.validationCoverage[] | select(.segment=="POS_EXACT")][0].total == 8)
            and ([.validationCoverage[] | select(.segment=="NEG_HARD_HOMONYM")][0].total == 10)
            and ([.evidenceCatalog[] | select(.code=="TELEFONE_CONTATO")][0].currentRole == "BLOCKING_ELIGIBLE_VERSIONED_ALIAS")
            and ([.evidenceCatalog[] | select(.code=="EMAIL_CONTATO")][0].currentRole == "BLOCKING_ELIGIBLE_VERSIONED_ALIAS")
            and ([.evidenceCatalog[] | select(.code=="NOME_SOCIAL")][0].currentRole == "BLOCKING_ELIGIBLE_VERSIONED_ALIAS")
            and ([.evidenceCatalog[] | select(.code=="ENDERECO_RESIDENCIAL")][0].currentRole == "INELIGIBLE_FOR_RESOLUTION")
            and ([.evidenceCatalog[] | select(.code=="REFERENCIA_TERRITORIAL")][0].currentRole == "INELIGIBLE_FOR_RESOLUTION")
            and ([.evidenceCatalog[] | select(.code=="ENDERECO_CASA_ABRIGO_SIGILOSA")][0].currentRole == "INELIGIBLE_FOR_RESOLUTION")
          ' "$report" >/dev/null
          echo 'LINKAGE ADDITIONAL EVIDENCE READINESS CONTRACT: OK'

      - name: Run Gold triplet collision audit
        shell: pwsh
        run: |
          Write-Host '# pwsh -NoLogo -NoProfile -File ./scripts/local-linkage-triplet-collision-audit.ps1'
          & ./scripts/local-linkage-triplet-collision-audit.ps1
          if ($LASTEXITCODE -ne 0) { throw "local-linkage-triplet-collision-audit.ps1 falhou ($LASTEXITCODE)." }

      - name: Validate Gold triplet collision audit contract
        shell: bash
        run: |
          set -euo pipefail
          report='.local/linkage-triplet-collision-audit/triplet-collision-audit.json'
          jq -e '
            .purpose == "READ_ONLY_GOLD_ANCHORED_TRIPLET_COLLISION_AUDIT"
            and .changesPolicy == false
            and .changesScoring == false
            and .exposesPii == false
            and .coverage.completeTripletPersons > 0
            and .coverage.projectionCoverageComplete == true
            and .collisions.collidingTriplets >= 0
            and .collisions.collidingCpfPairs >= 0
            and .dataset.municipalPrevalenceClaimAllowed == false
          ' "$report" >/dev/null
          echo 'LINKAGE GOLD TRIPLET COLLISION AUDIT CONTRACT: OK'

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: linkage-independent-validation
          path: |
            Solution/.local/linkage-validation/blocking-pass-audit.json
            Solution/.local/linkage-validation/validation-report.json
            Solution/.local/linkage-evidence-readiness/evidence-readiness.json
            Solution/.local/linkage-validation/run-provenance.json
            Solution/.local/linkage-triplet-collision-audit/triplet-collision-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Dump cluster logs on failure
        if: failure()
        shell: bash
        run: docker compose --env-file .env logs --tail 250 || true

      - name: Cleanup
        if: always()
        shell: bash
        run: docker compose --env-file .env down -v --remove-orphans || true
