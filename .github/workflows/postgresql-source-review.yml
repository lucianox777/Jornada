name: jornada-postgresql-source-review

on:
  push:
    branches:
      - work/postgresql-persistence-review
    paths:
      - .github/workflows/postgresql-source-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive reviewed sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/postgresql-source-review
          git archive --format=zip HEAD Solution .github .gitattributes .gitignore -o .local/postgresql-source-review/source.zip
          git rev-parse HEAD > .local/postgresql-source-review/commit.txt
          sha256sum .local/postgresql-source-review/source.zip > .local/postgresql-source-review/source.sha256
      - name: Upload source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-source-review
          path: .local/postgresql-source-review/
          retention-days: 7
          if-no-files-found: error
