name: v9-synthetic-corruption-evidence
on:
  pull_request:
    paths:
      - 'Solution/scripts/v9-synthetic-corruption-impact.py'
      - 'Solution/scripts/v9-synthetic-clean-correlated-sensitivity.py'
      - 'Solution/scripts/v9-cluster-sample-size-power.py'
      - 'Solution/scripts/v9-frozen-cross-seed-plan-transfer.py'
      - 'Solution/tests/fixtures/test_v9_synthetic_clean_correlated_sensitivity.py'
      - 'Solution/tests/fixtures/test_v9_cluster_sample_size_power.py'
      - 'Solution/tests/fixtures/test_v9_frozen_cross_seed_plan_transfer.py'
      - 'Solution/tests/fixtures/test_v9_synthetic_corruption_impact.py'
      - 'Solution/src/Jornada.Linkage.SyntheticCorpus/SyntheticCorpusMaterializer.cs'
      - 'Solution/docs/V9_Origem_18pct_Erros_Sinteticos_20261014.md'
      - '.github/workflows/v9-synthetic-corruption-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  frozen-corruption-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate isolated V2 error accounting tests
        run: |
          python3 -m py_compile Solution/scripts/v9-synthetic-corruption-impact.py
          python3 -m unittest discover -s Solution/tests/fixtures -p 'test_v9_synthetic_corruption_impact.py' -v
      - name: Fetch original seed42 corpus by published workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Solution/.local/v9-corruption-origin
          gh run download 38593005691 --repo lucianox777/Jornada -n v9-physical-sql-active-candidate-wrong-link-30k -D Solution/.local/v9-corruption-origin
      - name: Audit original correlated scenario with manifest SHA, independent true pairs
        run: |
          python3 Solution/scripts/v9-synthetic-corruption-impact.py \
            --observations Solution/.local/v9-corruption-origin/e2-demographic-primary/observacoes.csv \
            --manifest Solution/.local/v9-corruption-origin/e2-demographic-primary/generation-manifest.json \
            --out Solution/.local/v9-corruption-origin/v9-corruption-impact-seed42-aggregates.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('Solution/.local/v9-corruption-origin/v9-corruption-impact-seed42-aggregates.json').read_text())
          assert r['observations']>30000 and r['true_pairs_across_managers']['ALL']['pairs']>10000
          assert r['legacy_missing_profile_in_manifest'] is True
          assert r['may_promote_v9_or_recalibrate'] is False
          assert r['effective_field_changes_per_observation']['dob_changed']['rate']>0
          PY
      - name: Publish aggregate error profiles ONLY, no citizen names or raw observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v9-observed-corruption-seed42-aggregates
          path: Solution/.local/v9-corruption-origin/v9-corruption-impact-seed42-aggregates.json
          if-no-files-found: ignore

  clean-vs-correlated-sqlite-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Fail-closed profile sensitivity unit tests
        run: |
          python3 -m py_compile Solution/scripts/v9-synthetic-clean-correlated-sensitivity.py Solution/scripts/v9-cluster-sample-size-power.py Solution/scripts/v9-frozen-cross-seed-plan-transfer.py
          python3 -m unittest discover -s Solution/tests/fixtures -p 'test_v9_frozen_cross_seed_plan_transfer.py' -v
          python3 -m unittest discover -s Solution/tests/fixtures -p 'test_v9_cluster_sample_size_power.py' -v
          python3 -m unittest discover -s Solution/tests/fixtures -p 'test_v9_synthetic_clean_correlated_sensitivity.py' -v
      - name: Build C# generator and canonical exporter
        working-directory: Solution
        run: |
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          dotnet build -c Release src/Jornada.Linkage.Evaluation/Jornada.Linkage.Evaluation.csproj
      - name: Generate both 30k profiles on SAME IBGE+birth reference and seed42, then run indexed SQL
        working-directory: Solution
        run: |
          set -euo pipefail
          test -s data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json
          test -s data/reference/ibge-nomes-2022/manifest.json
          root="$PWD/.local/v9-corruption-sensitivity"
          for profile in clean correlated; do
            out="$root/$profile"
            dotnet run -c Release --no-build --project src/Jornada.Linkage.SyntheticCorpus -- generate \
              --reference-root "$PWD/data/reference/ibge-nomes-2022" \
              --population-profile demographic-primary \
              --birth-daily-source "$PWD/data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json" \
              --out "$out" --people 30000 --seed 42 --error-profile "$profile"
            dotnet run -c Release --no-build --project src/Jornada.Linkage.Evaluation -- \
              --v9-export-canonical-csv-with-surnames "$out/observacoes.csv" "$out/canonical.csv"
            python3 scripts/v9-freeze-canonical-name-frequency.py \
              --canonical-csv "$out/canonical.csv" \
              --snapshot-dir "$out/frozen" \
              --projection-version BLOCKING_PROJECTION_KEY_PROJECTOR_V4
            python3 scripts/v9-sqlite-memory-cells.py \
              --snapshot-dir "$out/frozen" \
              --out "$out/sqlite-report.json" --cap 1000000 --max-passes 8
            python3 scripts/v9-cluster-sample-size-power.py \
              --snapshot-dir "$out/frozen" --baseline-report "$out/sqlite-report.json" \
              --out "$out/sample-size-report.json" --seed 42 --bootstrap-replicates 400
          done
          python3 scripts/v9-synthetic-clean-correlated-sensitivity.py \
            --profile-root "$root" --out "$PWD/.local/v9-clean-correlated-aggregate.json"
      - name: Only upload profile-level M/U/uncertainty aggregates, never truth, citizen names or observations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v9-clean-vs-correlated-seed42-mu-aggregates
          path: Solution/.local/v9-clean-correlated-aggregate.json
          if-no-files-found: ignore
      - name: Publish matched-base sample-size power curves, no identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v9-seed42-clean-correlated-cluster-sample-size
          path: Solution/.local/v9-corruption-sensitivity/*/sample-size-report.json
          if-no-files-found: error

  independent-seeds-43-44:
    # The target seeds must replay seed42's frozen TRAIN-selected plan;
    # wait only for its published immutable aggregate. Two target seeds
    # continue independently and in parallel, without target refit.
    needs: clean-vs-correlated-sqlite-sensitivity
    strategy:
      fail-fast: false
      matrix:
        seed: [43, 44]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build versioned generator and C# canonical observation projection
        working-directory: Solution
        run: |
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          dotnet build -c Release src/Jornada.Linkage.Evaluation/Jornada.Linkage.Evaluation.csproj
      - name: Download seed42 frozen TRAIN plan from this SAME workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p Solution/.local/v9-seed42-frozen-reference
          gh run download "${{ github.run_id }}" --repo lucianox777/Jornada \
            -n v9-clean-vs-correlated-seed42-mu-aggregates \
            -D Solution/.local/v9-seed42-frozen-reference
          test -s Solution/.local/v9-seed42-frozen-reference/v9-clean-correlated-aggregate.json
      - name: Same IBGE and 30k persons per profile; independent seed and per-base bootstrap
        working-directory: Solution
        env:
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          test -s data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json
          test -s data/reference/ibge-nomes-2022/manifest.json
          root="$PWD/.local/v9-seed-${SEED}-sensitivity"
          for profile in clean correlated; do
            out="$root/$profile"
            dotnet run -c Release --no-build --project src/Jornada.Linkage.SyntheticCorpus -- generate \
              --reference-root "$PWD/data/reference/ibge-nomes-2022" \
              --population-profile demographic-primary \
              --birth-daily-source "$PWD/data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json" \
              --out "$out" --people 30000 --seed "$SEED" --error-profile "$profile"
            dotnet run -c Release --no-build --project src/Jornada.Linkage.Evaluation -- \
              --v9-export-canonical-csv-with-surnames "$out/observacoes.csv" "$out/canonical.csv"
            python3 scripts/v9-freeze-canonical-name-frequency.py \
              --canonical-csv "$out/canonical.csv" \
              --snapshot-dir "$out/frozen" \
              --projection-version BLOCKING_PROJECTION_KEY_PROJECTOR_V4
            python3 scripts/v9-sqlite-memory-cells.py \
              --snapshot-dir "$out/frozen" \
              --out "$out/sqlite-report.json" --cap 1000000 --max-passes 8
            python3 scripts/v9-cluster-sample-size-power.py \
              --snapshot-dir "$out/frozen" --baseline-report "$out/sqlite-report.json" \
              --out "$out/sample-size-report.json" --seed "$SEED" --bootstrap-replicates 400
          done
          python3 scripts/v9-synthetic-clean-correlated-sensitivity.py \
            --profile-root "$root" --out "$PWD/.local/v9-seed-${SEED}-aggregate.json"
          python3 scripts/v9-frozen-cross-seed-plan-transfer.py \
            --seed42-aggregate "$PWD/.local/v9-seed42-frozen-reference/v9-clean-correlated-aggregate.json" \
            --target-profile-root "$root" --target-seed "$SEED" \
            --out "$PWD/.local/v9-seed-${SEED}-frozen-replay-aggregate.json"
      - name: Publish only split-level M/U and identity-cluster sample-size evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v9-synthetic-size-3seed-${{ matrix.seed }}-aggregates
          path: |
            Solution/.local/v9-seed-${{ matrix.seed }}-aggregate.json
            Solution/.local/v9-seed-${{ matrix.seed }}-frozen-replay-aggregate.json
            Solution/.local/v9-seed-${{ matrix.seed }}-sensitivity/*/sample-size-report.json
          if-no-files-found: error
