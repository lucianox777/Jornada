name: jornada-postgresql-linkage-weighted-diagnostic
on:
  pull_request:
    paths:
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/**'
      - 'Solution/src/Jornada.Contracts/**'
      - 'Solution/tests/Jornada.Tests/Unit/CandidateWeightedEstimatorTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/CandidateSamplingTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/BirthBlockingPlanTests.cs'
      - 'Solution/scripts/postgresql-linkage-evidence.sh'
      - 'Solution/scripts/test-postgresql-linkage-evidence.py'
      - '.github/workflows/postgresql-linkage-weighted-diagnostic.yml'
  push:
    paths:
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/**'
      - 'Solution/src/Jornada.Contracts/**'
      - 'Solution/tests/Jornada.Tests/Unit/CandidateWeightedEstimatorTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/CandidateSamplingTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/BirthBlockingPlanTests.cs'
      - 'Solution/scripts/postgresql-linkage-evidence.sh'
      - 'Solution/scripts/test-postgresql-linkage-evidence.py'
      - '.github/workflows/postgresql-linkage-weighted-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weighted-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Solution
        shell: bash
    env:
      JORNADA_LINKAGE_EVIDENCE_DIR: ${{ github.workspace }}/Solution/.local/postgresql-weighted-evidence
      JORNADA_LINKAGE_EVIDENCE_REQUIRED_STAGES: 'environment restore build unit policy'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Record toolchain and commit
        run: bash scripts/postgresql-linkage-evidence.sh run environment bash -c 'set -euo pipefail; dotnet --info; git rev-parse HEAD'
      - name: Evidence summary contract regressions
        run: python3 scripts/test-postgresql-linkage-evidence.py -v
      - name: Restore locked dependencies
        run: bash scripts/postgresql-linkage-evidence.sh run restore dotnet restore tests/Jornada.Tests/Jornada.Tests.csproj --locked-mode -v:normal "-bl:$JORNADA_LINKAGE_EVIDENCE_DIR/restore.binlog;ProjectImports=None"
      - name: Build real workers and tests
        run: bash scripts/postgresql-linkage-evidence.sh run build dotnet build tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-restore -warnaserror -v:normal "-bl:$JORNADA_LINKAGE_EVIDENCE_DIR/build.binlog;ProjectImports=None"
      - name: Independent labeling and weighted diagnostic regressions
        run: |
          bash scripts/postgresql-linkage-evidence.sh run unit dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'TestCategory=Unit&(FullyQualifiedName~CandidateWeightedEstimatorTests|FullyQualifiedName~CandidateSamplingTests|FullyQualifiedName~BirthBlockingPlanTests)' --logger 'trx;LogFileName=weighted-unit.trx' --results-directory "$JORNADA_LINKAGE_EVIDENCE_DIR"
      - name: Existing scoring policy regressions
        run: |
          bash scripts/postgresql-linkage-evidence.sh run policy dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~ProbabilisticLinkagePolicyTests' --logger 'trx;LogFileName=linkage-policy.trx' --results-directory "$JORNADA_LINKAGE_EVIDENCE_DIR"
      - name: Summarize validation evidence
        if: always()
        run: bash scripts/postgresql-linkage-evidence.sh summary
      - name: Require scoped evidence completeness
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib
          path = pathlib.Path(os.environ['JORNADA_LINKAGE_EVIDENCE_DIR']) / 'summary.json'
          summary = json.loads(path.read_text(encoding='utf-8'))
          if summary['outcome'] != 'passed':
              raise SystemExit('Required evidence is incomplete or failed')
          PYCODE
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-linkage-weighted-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: Solution/.local/postgresql-weighted-evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: warn
