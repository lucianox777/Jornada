name: V9 corpus PREPARE (isolated, opt-in)
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact branch commit SHA (40 lowercase hex)
        required: true
        type: string
      mother_corruption_rate:
        description: "Optional synthetic mother-name corruption attempt in [0,1]. Omit to preserve clean 10%. 13.4% is exploratory, NOT an IBGE fact."
        required: false
        default: ""
        type: string
permissions:
  contents: read

jobs:
  prepare-corpus:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MOTHER_CORRUPTION_RATE: ${{ inputs.mother_corruption_rate }}
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Admit exact SHA, branch and owner only
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git -C .. rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$GITHUB_REF" = "refs/heads/feature/v9-persistent-synthetic-corpus-20261115"
          test "$GITHUB_RUN_ATTEMPT" = "1"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # pinned
        with:
          dotnet-version: "10.0.113"
          cache: true
          cache-dependency-path: "Solution/**/packages.lock.json"
      - name: Derive generation-only fingerprint from pinned source and REF
        run: |
          set -euo pipefail
          mkdir -p .local/v9-persistent
          maternal_args=()
          if [[ -n "$MOTHER_CORRUPTION_RATE" ]]; then
            maternal_args=(--mother-corruption-rate "$MOTHER_CORRUPTION_RATE")
          fi
          python3 scripts/v9-corpus-input-receipt.py \
            --generator-source src/Jornada.Linkage.SyntheticCorpus \
            --ibge-names data/reference/ibge-nomes-2022 \
            --birth-daily data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json \
            "${maternal_args[@]}" \
            --output .local/v9-persistent/config.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import importlib.util,json
          from pathlib import Path
          p=Path("scripts/v9-corpus-snapshot.py")
          s=importlib.util.spec_from_file_location("snapshot",p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          print("V9_CORPUS_KEY="+m.identity(json.loads(Path(".local/v9-persistent/config.json").read_text())))
          PY
      # Immutable cache, shared across workflow runs; not guaranteed retention.
      # Missing cache triggers deterministic regeneration; corrupted cache fails.
      - id: corpus-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2686 # v4.2.3 pinned
        with:
          path: Solution/.local/v9-persistent/store
          key: v9-corpus-v1-${{ env.V9_CORPUS_KEY }}
          lookup-only: false
      - name: Verify corpus preparation contract before expensive generation
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/scripts -p 'test_v9_*.py' -v
      - name: Build generator and prepare corpus
        run: |
          set -euo pipefail
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          maternal_args=()
          if [[ -n "$MOTHER_CORRUPTION_RATE" ]]; then
            maternal_args=(--mother-corruption-rate "$MOTHER_CORRUPTION_RATE")
          fi
          python3 scripts/v9-corpus-prepare.py \
            --store .local/v9-persistent/store \
            --config .local/v9-persistent/config.json \
            --generation-output .local/v9-persistent/generated \
            --handoff-to .local/v9-persistent/train-handoff \
            --receipt .local/v9-persistent/prepare-receipt.json -- \
            dotnet run --no-build -c Release --project src/Jornada.Linkage.SyntheticCorpus -- generate \
              --reference-root data/reference/ibge-nomes-2022 \
              --population-profile demographic-primary \
              --birth-daily-source data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json \
              --error-profile clean --people 100000 --seed 42 \
              "${maternal_args[@]}" \
              --out .local/v9-persistent/generated
      - if: ${{ steps.corpus-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2686 # v4.2.3 pinned
        with:
          path: Solution/.local/v9-persistent/store
          key: v9-corpus-v1-${{ env.V9_CORPUS_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-prepared-corpus-${{ github.run_id }}
          path: |
            Solution/.local/v9-persistent/train-handoff/
            Solution/.local/v9-persistent/config.json
            Solution/.local/v9-persistent/prepare-receipt.json
          if-no-files-found: error
          retention-days: 7
