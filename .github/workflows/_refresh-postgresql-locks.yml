name: refresh-postgresql-locks

on:
  push:
    paths:
      - '.github/workflows/_refresh-postgresql-locks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - name: Regenerate exact graph
        run: |
          dotnet restore Jornada.sln --use-lock-file --force-evaluate
          mkdir -p .local/lock-refresh
          python3 scripts/nuget-lock-gate.py --root . --summary .local/lock-refresh/summary.json
      - name: Refresh provenance and prove locked restore
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.').resolve()
          manifest=root/'config/release/nuget-lock-provenance.json'
          data=json.loads(manifest.read_text(encoding='utf-8'))
          locks=sorted(
              p for p in root.rglob('packages.lock.json')
              if '.local' not in p.parts and 'obj' not in p.parts and 'bin' not in p.parts
          )
          old={row.get('path'):row for row in data.get('locks',[]) if row.get('path')}
          rows=[]
          for path in locks:
              rel=path.relative_to(root).as_posix()
              digest=hashlib.sha256(path.read_bytes()).hexdigest()
              prior=old.get(rel,{})
              rows.append({
                  'path': rel,
                  'origin': 'REGENERATED_OR_VERIFIED_V405_SDK_8_0_424',
                  'sourceSha256': digest,
                  'sha256': digest,
                  'note': prior.get('note') or 'Lock regenerado pelo SDK 8.0.424; promoção exige --force-evaluate sem diff e --locked-mode.',
                  'verificationStatus': 'CI_FORCE_EVALUATE_AND_LOCK_GATE_PASS_V405'
              })
          summary=json.loads((root/'.local/lock-refresh/summary.json').read_text(encoding='utf-8'))
          data['locks']=rows
          data['pendingLockCount']=0
          generation=data.setdefault('lockGraphGeneration',{})
          generation['sdk']='8.0.424'
          generation['command']='dotnet restore Jornada.sln --use-lock-file --force-evaluate'
          generation['diagnosticRunId']='CI_REGENERATED_POSTGRESQL_INGESTION_PROCESSOR'
          generation['lockCount']=len(rows)
          generation['nugetLockGate']='PASS'
          generation['combinedSha256']=summary['combinedSha256']
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python3 scripts/nuget-lock-provenance-gate.py --root . --summary .local/lock-refresh/provenance.json
          dotnet restore Jornada.sln --locked-mode
      - name: Commit regenerated locks
        shell: bash
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find Solution -name packages.lock.json -not -path '*/obj/*' -not -path '*/bin/*' -print0 | xargs -0 git add
          git add Solution/config/release/nuget-lock-provenance.json
          if git diff --cached --quiet; then
            echo 'Lock graph already current.'
            exit 0
          fi
          git commit -m 'build: refresh NuGet locks for PostgreSQL ingestion slice'
          git push origin HEAD:work/postgresql-adapter
