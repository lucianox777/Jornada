name: V9 exploratory append contract

on:
  pull_request:
    branches:
      - 'research/v9-exploratoria-parametros-ampliados'
    paths:
      - 'Solution/scripts/v9-exploratory-append.py'
      - 'Solution/scripts/test_v9_exploratory_append.py'
      - 'Solution/scripts/v9-exploratory-statistical-report.py'
      - 'Solution/scripts/test_v9_exploratory_statistical_report.py'
      - 'Solution/scripts/v9-exploratory-research-grid.py'
      - 'Solution/scripts/test_v9_exploratory_research_grid.py'
      - '.github/workflows/v9-exploratory-append.yml'
  push:
    branches:
      - 'research/v9-exploratoria-parametros-ampliados'
    paths:
      - 'Solution/scripts/v9-exploratory-append.py'
      - 'Solution/scripts/test_v9_exploratory_append.py'
      - 'Solution/scripts/v9-exploratory-statistical-report.py'
      - 'Solution/scripts/test_v9_exploratory_statistical_report.py'
      - 'Solution/scripts/v9-exploratory-research-grid.py'
      - 'Solution/scripts/test_v9_exploratory_research_grid.py'
      - '.github/workflows/v9-exploratory-append.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  append-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run append-only regression tests
        run: python3 -m unittest -v scripts/test_v9_exploratory_append.py scripts/test_v9_exploratory_statistical_report.py scripts/test_v9_exploratory_research_grid.py
        working-directory: Solution
