name: v9-frozen-train-joint-v3-trial

# Reuses *only* the SHA-pinned TF-001 TRAIN pair-support report.
# This is a new, explicitly experimental JOINT m/u fit, never the original
# frozen V2 or an approved V9 model. NO 30k, SQL, VALIDATION/TEST, DT-15.
on:
  push:
    branches:
      - feat/v9-gold-frozen-tf-diagnostic-20261105
    paths:
      - '.github/workflows/v9-frozen-train-joint-v3-trial.yml'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9FrozenJointTrainingDerivationCli.cs'
      - 'Solution/data/reference/v9-tf-frozen-joint-trial-20261105/historical-v3-support-policy.json'
      - 'Solution/tests/Jornada.Tests/Unit/V9FittedSnapshotTests.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/Program.cs'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  train-joint-candidate:
    name: V3 joint TRAIN trial only (TF frozen, no SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Build worker and verify exact source artifact identity
        working-directory: Solution
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet build -c Release src/Jornada.Linkage.Parameters.Worker/Jornada.Linkage.Parameters.Worker.csproj
          python3 -m unittest tests/scripts/test_v9_tf_frozen_source_schema_audit.py -v
      - name: Read ONLY archived 42-source artifact from pinned GitHub run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v9-source"
          read -r RUN NAME SHA < <(python3 -c 'import json; x=json.load(open("Solution/data/reference/v9-tf-seed43-frozen-transfer/executor.json"));print(x["SourceRunId"],x["SourceArtifactName"],x["SourceCommitSha"])')
          test "$RUN" = "41900357031"
          test "$SHA" = "935f704edd2bceb6a125ecfe532ad5b71f9c89b9"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$SHA"
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "$NAME" -D "$RUNNER_TEMP/v9-source"
          python3 - "$RUNNER_TEMP/v9-source" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          meta=json.load(open("Solution/data/reference/v9-tf-seed43-frozen-transfer/executor.json"))
          def sha(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(root/'plan-tf.json') == meta['SourcePlanTfSha256']
          assert sha(root/'study-tf'/'study.json') == meta['SourceStudySha256']
          for arm in meta['Arms']:
              name=arm['SnapshotSha256']+'.fitted.json'
              assert sha(root/'study-tf'/name)==arm['SnapshotSha256'], name
          print('PASS: original plan, study and six frozen fits authenticated')
          PY
      - name: Derive separate V3 *trial* from original TRAIN M/U (no TF/SQL refit)
        working-directory: Solution
        run: |
          set -euo pipefail
          export SOURCE="$RUNNER_TEMP/v9-source"
          POLICY="data/reference/v9-tf-frozen-joint-trial-20261105/historical-v3-support-policy.json"
          FIT_SHA="8bdf08affbbcd88550cb055e42a063c1bfff1ffb968b55a3707be6179475d29f"
          STUDY_SHA="$(python3 -c 'import json; p=json.load(open("data/reference/v9-tf-seed43-frozen-transfer/executor.json")); print(p["SourceStudySha256"])')"
          POLICY_SHA="$(sha256sum "$POLICY" | cut -d' ' -f1)"
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- \
            --v9-derive-joint-v3-from-frozen-train \
            "$SOURCE/study-tf/$FIT_SHA.fitted.json" "$FIT_SHA" \
            "$SOURCE/study-tf/study.json" "$STUDY_SHA" \
            "$PWD/$POLICY" "$POLICY_SHA" "$RUNNER_TEMP/v9-v3-provisional" \
            | tee "$RUNNER_TEMP/v9-v3-derivation-summary.json"
          test "$(find "$RUNNER_TEMP/v9-v3-provisional" -maxdepth 1 -name '*.fitted.json' | wc -l)" -eq 1
          python3 - "$RUNNER_TEMP/v9-v3-provisional/derivation-receipt.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print('### V9 TF-positive V3 TRAIN-only derived trial — NOT an approved model')
          for k in ('sourceSnapshotSha256','originalTrainStudySha256',
                    'pinnedJointPolicySha256','derivedTrialSnapshotSha256',
                    'originalBlockingPassCount','derivedBlockingPassCount',
                    'activeUnitTfCount','physicalTrainMPairs','physicalTrainUPairs',
                    'jointProbabilityParametersReestimated','tfRefitted','certified','status'):
              print('- '+k+': '+str(x[k]))
          print('**Independent validation and Gold four-wave/three-order physical run are still required.**')
          PY
      - name: Upload only the sanitized audit receipt, NOT new model bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9-frozen-joint-v3-TRIAL-METADATA-${{ github.sha }}
          path: ${{ runner.temp }}/v9-v3-provisional/derivation-receipt.json
          if-no-files-found: error
          retention-days: 90
