name: tmp-linkage-evaluation-lock

on:
  pull_request:
    paths:
      - 'Solution/src/Jornada.Linkage.Evaluation/**'
      - '.github/workflows/tmp-linkage-evaluation-lock.yml'

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Generate exact Evaluation lock
        working-directory: Solution
        run: |
          dotnet restore src/Jornada.Linkage.Evaluation/Jornada.Linkage.Evaluation.csproj --force-evaluate
          echo '---BEGIN-EVALUATION-LOCK---'
          cat src/Jornada.Linkage.Evaluation/packages.lock.json
          echo '---END-EVALUATION-LOCK---'
