name: tmp-linkage-evaluation-lock

on:
  push:
    branches:
      - 'feat/linkage-truth-candidate-audit'

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Generate and commit exact Evaluation lock
        working-directory: Solution
        run: |
          dotnet restore src/Jornada.Linkage.Evaluation/Jornada.Linkage.Evaluation.csproj --force-evaluate
          if git diff --quiet -- src/Jornada.Linkage.Evaluation/packages.lock.json; then
            echo 'Lock já está atualizado.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Jornada.Linkage.Evaluation/packages.lock.json
          git commit -m 'build(linkage): atualiza lock do Evaluation'
          git push origin HEAD:feat/linkage-truth-candidate-audit
