name: fix-resultado-analyzer

on:
  push:
    branches:
      - work/integrador-identificador-config
    paths:
      - '.github/workflows/fix-resultado-analyzer.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use ordinal comparisons in result filename validation
        shell: python
        run: |
          from pathlib import Path
          path = Path('Solution/src/Jornada.Resultado.Api/Program.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "value.Contains('/')": 'value.Contains("/", StringComparison.Ordinal)',
              "value.Contains('\\\\')": 'value.Contains("\\\\", StringComparison.Ordinal)',
              "value.Contains(':')": 'value.Contains(":", StringComparison.Ordinal)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected expression not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit analyzer fix
        run: |
          git rm .github/workflows/fix-resultado-analyzer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Solution/src/Jornada.Resultado.Api/Program.cs
          git commit -m 'fix: use ordinal filename separator checks'
          git push origin "HEAD:${GITHUB_REF_NAME}"
