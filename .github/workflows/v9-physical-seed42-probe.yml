name: v9-physical-seed42-probe

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    name: V9 30k - classify impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_physical_30k: ${{ steps.classify.outputs.run_physical_30k }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Regression tests for fail-closed path classification
        run: python3 -m unittest discover -s Solution/tests/scripts -p test_v9_physical_impact_classifier.py
      - name: Classify complete PR merge diff (manual dispatch always runs)
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 Solution/scripts/v9-physical-impact-classifier.py --manual \
              --summary v9-physical-30k-impact.json --github-output "$GITHUB_OUTPUT"
          else
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Cannot verify exact GitHub SHA; fail closed" >&2
              exit 1
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
            git diff --name-status -z --find-renames "$BASE_SHA" "$CHECKOUT_SHA" > changed-name-status.z
            python3 Solution/scripts/v9-physical-impact-classifier.py \
              --name-status-z changed-name-status.z \
              --summary v9-physical-30k-impact.json --github-output "$GITHUB_OUTPUT"
          fi
      - name: Archive impact decision for audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9-physical-30k-impact-${{ github.run_id }}
          path: v9-physical-30k-impact.json
          retention-days: 30
          if-no-files-found: warn

  physical-30k:
    name: V9 full physical 30k SQL TRAIN (when impacted)
    needs: impact
    if: needs.impact.outputs.run_physical_30k == 'true'
    runs-on: ubuntu-latest
    # Full adaptive batches now survive the old all-cell veto and execute 20
    # complete latency replays per feasible candidate; preserve every gate.
    timeout-minutes: 360
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!V9Probe'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 25
    env:
      JORNADA_SQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!V9Probe'
      ConnectionStrings__Jornada: 'Server=localhost,1433;Database=JornadaHarness;User Id=sa;Password=Jornada_${{ github.run_id }}!V9Probe;TrustServerCertificate=true;Encrypt=false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Build the single CSharp calibrator and synthetic producer
        working-directory: Solution
        run: |
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          dotnet build -c Release src/Jornada.Linkage.Parameters.Worker/Jornada.Linkage.Parameters.Worker.csproj
      - name: Initialize disposable JornadaHarness
        run: |
          set -euo pipefail
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -e SQLCMDPASSWORD "$CID" \
            /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b \
            -Q "IF DB_ID(N'JornadaHarness') IS NULL CREATE DATABASE JornadaHarness;"
      - name: Generate clean fixtures and historical 30k development corpus
        working-directory: Solution
        run: |
          set -euo pipefail
          root="$PWD/.local/v9-nested-ci"
          mkdir -p "$root"
          generate() {
            dotnet run --no-build -c Release --project src/Jornada.Linkage.SyntheticCorpus -- generate \
              --reference-root "$PWD/data/reference/ibge-nomes-2022" \
              --population-profile demographic-primary \
              --birth-daily-source "$PWD/data/reference/synthetic-birth-sp/birth_daily_sp_projection2024_2026.json" \
              --error-profile clean --people "$1" --seed "$2" --out "$root/$3" > "$root/$3-generation.log"
          }
          generate 1000 42 fixture-train &
          a=$!
          generate 1000 20261019001 fixture-validation &
          b=$!
          wait "$a"
          wait "$b"
          generate 30000 42 development-30k
      - name: Real SQL nested search and one-time frozen finalist validation - fixture only
        working-directory: Solution
        env:
          JORNADA_V9_HOLDOUT_REGISTRY: '${{ github.workspace }}/Solution/.local/v9-nested-ci/fixture-registry'
        run: |
          python3 scripts/v9-nested-calibration-verify.py fixture \
            src/Jornada.Linkage.Parameters.Worker/bin/Release/net10.0/Jornada.Linkage.Parameters.Worker.dll \
            .local/v9-nested-ci/fixture-train/observacoes.csv \
            .local/v9-nested-ci/fixture-validation/observacoes.csv \
            .local/v9-nested-ci/regression
      - name: Calibrate 30k using ONLY TRAIN-adjust and TRAIN-selection
        working-directory: Solution
        run: |
          set -euo pipefail
          root="$PWD/.local/v9-nested-ci"
          python3 scripts/v9-nested-calibration-study.py "$root/development-30k/observacoes.csv" "$root/bootstrap-plan.json"
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- \
            --v9-calibrate "$root/bootstrap-plan.json" "$root/development-30k/observacoes.csv" "$root/bootstrap-search"
          python3 scripts/v9-nested-calibration-verify.py search "$root/bootstrap-search"
          # No external 30k VALIDATION/TEST scoring in this workflow.
      - name: Export batch gain and resolution curves
        working-directory: Solution
        run: |
          root="$PWD/.local/v9-nested-ci"
          python3 -m venv "$root/plot-env"
          "$root/plot-env/bin/python" -m pip install --disable-pip-version-check --quiet matplotlib==3.10.8
          "$root/plot-env/bin/python" scripts/v9-nested-gain-plot.py "$root/regression/search/gain-by-batch.json" "$root/regression/gain-by-batch.svg"
          "$root/plot-env/bin/python" scripts/v9-nested-gain-plot.py "$root/bootstrap-search/gain-by-batch.json" "$root/bootstrap-search/gain-by-batch.svg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: v9-nested-train-selection-frozen-finalists-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            Solution/.local/v9-nested-ci/bootstrap-plan.json
            Solution/.local/v9-nested-ci/bootstrap-search/*.json
            Solution/.local/v9-nested-ci/bootstrap-search/*.jsonl
            Solution/.local/v9-nested-ci/bootstrap-search/*.svg
            Solution/.local/v9-nested-ci/regression/**/*.json
            Solution/.local/v9-nested-ci/regression/*.svg
            Solution/.local/v9-nested-ci/fixture-train/generation-manifest.json
            Solution/.local/v9-nested-ci/fixture-validation/generation-manifest.json
            Solution/.local/v9-nested-ci/development-30k/generation-manifest.json

  # Stable required check preserves the old status context without faking execution.
  physical-seed42:
    name: SQL físico 30k clean — FS blind Rank-Resolve TF0
    needs: [impact, physical-30k]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce all impacted full-probe runs and record legitimate no-op
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          REQUIRES_PHYSICAL: ${{ needs.impact.outputs.run_physical_30k }}
          PHYSICAL_RESULT: ${{ needs.physical-30k.result }}
        run: |
          set -euo pipefail
          if [[ "$IMPACT_RESULT" != "success" ]]; then
            echo "Impact classification did not succeed; no skipping permitted." >&2
            exit 1
          fi
          if [[ "$REQUIRES_PHYSICAL" == "true" ]]; then
            test "$PHYSICAL_RESULT" = "success" || {
              echo "Required V9 30k physical probe failed or was not run: $PHYSICAL_RESULT" >&2
              exit 1
            }
            echo "PASS: the real SQL physical V9 TRAIN 30k probe completed."
          elif [[ "$REQUIRES_PHYSICAL" == "false" ]]; then
            test "$PHYSICAL_RESULT" = "skipped" || {
              echo "Unexpected physical job result for a Gold-only/docs change: $PHYSICAL_RESULT" >&2
              exit 1
            }
            echo "NOT_REQUIRED_FOR_THIS_DIFF: the physical calibration was not run."
          else
            echo "No valid impact decision; fail closed." >&2
            exit 1
          fi
