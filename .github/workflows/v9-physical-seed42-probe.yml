name: v9-physical-seed42-probe

on:
  pull_request:
  # Reusable only for separately authorized one-shot chat approval workflow.
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      expected_sha:
        type: string
        required: true
      pinned_ibge_json:
        type: string
        required: false
        default: ''
      replay_frozen_v2:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight sem 30k ou execução física autorizada'
        type: choice
        required: true
        default: preflight
        options: [preflight, execute_30k]
      expected_sha:
        description: 'SHA exato da branch, 40 caracteres'
        type: string
        required: true
      pinned_ibge_json:
        description: 'IBGE publicado fixado: versão, digests e bootstrap JSON'
        type: string
        required: false
      replay_frozen_v2:
        description: 'Somente execute_30k: usar o plano de configuração V2 exato do Git, não gerar os parâmetros no fonte'
        type: boolean
        required: false
        default: false

# Supersede obsolete automatic PR probes to prevent runner saturation.
# Explicit manual dispatch and experiment/evidence branches are isolated by run_id
# so governed scientific runs are never canceled by unrelated PR updates.
# A canceled automatic probe is NOT evidence for certification of any SHA.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}-${{ (startsWith(github.head_ref, 'experiment/') || startsWith(github.head_ref, 'evidence/') || startsWith(github.head_ref, 'exp/')) && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'experiment/') || startsWith(github.head_ref, 'evidence/') || startsWith(github.head_ref, 'exp/')) }}

permissions:
  contents: read
  actions: read

jobs:
  impact:
    name: V9 30k - classify impact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_physical_30k: ${{ steps.classify.outputs.run_physical_30k }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Regression tests for fail-closed path classification
        run: |
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_physical_impact_classifier.py
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_manual_probe_evidence.py
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_tf_30k_dispatch_gate.py
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_tf_pin_source.py
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_masked_sql_probe.py
      - name: Dry-run exact SHA gate when manual preflight is selected (no 30k)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight'
        env:
          TF_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          python3 Solution/scripts/v9-tf-30k-dispatch-gate.py \
            --mode preflight --expected-sha "$TF_SHA" --ref "$GITHUB_REF" \
            --output "$RUNNER_TEMP/v9-tf-sha-preflight.json"
      - name: Classify complete PR merge diff (manual dispatch always runs)
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ]]; then
            # A push is accepted only by the dedicated one-shot reusable
            # invocation after the authorization receipt was checked.
            if [[ "$EVENT_NAME" == "push" ]]; then
              test "$GITHUB_WORKFLOW" = "v9-v2-calibration-chat-approved-once" || {
                echo "Unapproved push context cannot request physical calibration" >&2
                exit 1
              }
            fi
            python3 Solution/scripts/v9-physical-impact-classifier.py --manual \
              --summary v9-physical-30k-impact.json --github-output "$GITHUB_OUTPUT"
          else
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Cannot verify exact GitHub SHA; fail closed" >&2
              exit 1
            fi
            git cat-file -e "${BASE_SHA}^{commit}"
            test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
            git diff --name-status -z --find-renames "$BASE_SHA" "$CHECKOUT_SHA" > changed-name-status.z
            python3 Solution/scripts/v9-physical-impact-classifier.py \
              --name-status-z changed-name-status.z \
              --summary v9-physical-30k-impact.json --github-output "$GITHUB_OUTPUT"
          fi
      - name: Archive impact decision for audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9-physical-30k-impact-${{ github.run_id }}
          path: v9-physical-30k-impact.json
          retention-days: 30
          if-no-files-found: warn

  pin-preflight:
    name: V9 30k - authenticate SQL IBGE and corpus (NO calibration)
    needs: impact
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight' && needs.impact.outputs.run_physical_30k == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Bind preflight to exact SHA before generating anything
        env:
          TF_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          mkdir -p Solution/.local/v9-tf-physical
          python3 Solution/scripts/v9-tf-30k-dispatch-gate.py \
            --mode preflight --expected-sha "$TF_SHA" --ref "$GITHUB_REF" \
            --output Solution/.local/v9-tf-physical/git-approved.json
      - name: Recover authenticated historic V2 plan and study from original run (read-only)
        if: inputs.replay_frozen_v2 == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          ref=json.loads(Path('Solution/data/reference/v9-frozen-artifacts/references.json').read_text())
          source=ref['artifacts']['seed42-source']
          assert source['run_id']==41900357031
          assert source['head_sha']=='935f704edd2bceb6a125ecfe532ad5b71f9c89b9'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41900357031" --jq '.head_sha')" = "935f704edd2bceb6a125ecfe532ad5b71f9c89b9"
          mkdir -p "$RUNNER_TEMP/v9-source-study"
          gh run download 41900357031 -R "$GITHUB_REPOSITORY" \
            -n v9-tf-45-physical-41900357031-935f704edd2bceb6a125ecfe532ad5b71f9c89b9 \
            -D "$RUNNER_TEMP/v9-source-study"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'v9-source-study'
          ref=json.loads(Path('Solution/data/reference/v9-frozen-artifacts/references.json').read_text())
          pinned={f['path']:f['sha256'] for f in ref['artifacts']['seed42-source']['files']}
          for path in ('plan-tf.json','study-tf/study.json'):
              file=root/path
              assert file.is_file() and hashlib.sha256(file.read_bytes()).hexdigest()==pinned[path], 'Original V2 artifact hash mismatch: '+path
          print('V2 original plan and study authenticated against frozen SHA. No recalibration.')
          PY
      - name: Start masked disposable SQL Server
        shell: bash
        run: bash Solution/scripts/v9-tf-start-disposable-sql.sh
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
          # Cache only NuGet packages; never bypass restore, build or SQL gates.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Build the single CSharp calibrator and synthetic producer
        working-directory: Solution
        run: |
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          dotnet build -c Release src/Jornada.Linkage.Parameters.Worker/Jornada.Linkage.Parameters.Worker.csproj
      - name: Export real SQL-backed pinned IBGE JSON without fitting
        working-directory: Solution
        run: bash scripts/v9-tf-prepare-pin.sh "$PWD/.local/v9-tf-physical" pinned-ibge.json
      - name: Print validated pinned IBGE JSON in log and job summary (metadata only)
        working-directory: Solution
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          pin = json.loads(Path('.local/v9-tf-physical/pinned-ibge.json').read_text(encoding='utf-8'))
          fields = {'PinnedIbgeReferenceVersionId', 'PinnedIbgePublishedSha256',
                    'PinnedIbgeMaterializedFrequencySha256', 'PinnedIbgeBootstrap'}
          bootstrap_fields = {'Provenance', 'People', 'CorpusFingerprint',
                              'GeneratorVersion', 'GeneratorSeed', 'GenerationHypothesesFingerprint'}
          if not isinstance(pin, dict) or set(pin) != fields:
              raise SystemExit('unexpected pinned IBGE fields; do not print')
          b = pin['PinnedIbgeBootstrap']
          if not isinstance(b, dict) or set(b) != bootstrap_fields:
              raise SystemExit('unexpected bootstrap fields; do not print')
          if (type(pin['PinnedIbgeReferenceVersionId']) is not int or pin['PinnedIbgeReferenceVersionId'] <= 0
                  or b['Provenance'] != 'SINTETICO_IBGE' or b['People'] != 30000
                  or b['GeneratorVersion'] != 'JORNADA_SYNTH_CORPUS_CSHARP_V1' or b['GeneratorSeed'] != 42):
              raise SystemExit('unexpected IBGE/bootstrap metadata; do not print')
          for h in (pin['PinnedIbgePublishedSha256'], pin['PinnedIbgeMaterializedFrequencySha256'],
                    b['CorpusFingerprint'], b['GenerationHypothesesFingerprint']):
              if not isinstance(h, str) or not re.fullmatch(r'[0-9a-fA-F]{64}', h):
                  raise SystemExit('invalid digest; do not print')
          content = json.dumps(pin, ensure_ascii=False, indent=2) + '\n'
          print('PINNED_IBGE_JSON_BEGIN\n' + content + 'PINNED_IBGE_JSON_END')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('### Pinned IBGE — metadata only (no PII)\n\n```json\n' + content + '```\n')
          PY
      - name: Preserve operator-reviewed pin and exact SHA (no corpus CSV, TEST, or PII)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9-tf-30k-pin-preflight-${{ github.run_id }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            Solution/.local/v9-tf-physical/git-approved.json
            Solution/.local/v9-tf-physical/bootstrap.json
            Solution/.local/v9-tf-physical/pinned-ibge.json
            Solution/.local/v9-tf-physical/people-30k/generation-manifest.json
      - name: Remove disposable SQL Server
        if: always()
        shell: bash
        run: docker rm -f "v9-probe-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true

  physical-30k:
    name: V9 full physical 30k SQL TRAIN (when impacted)
    needs: impact
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && inputs.replay_frozen_v2 == true)) && inputs.mode == 'execute_30k' && needs.impact.outputs.run_physical_30k == 'true'
    runs-on: ubuntu-latest
    # PO: full 30k only on explicit final dispatch; PR preflight remains fail-closed.
    # Full adaptive batches now survive the old all-cell veto and execute 20
    # complete latency replays per feasible candidate; preserve every gate.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prove exact manual branch SHA and pinned IBGE before 30k
        env:
          TF_SHA: ${{ inputs.expected_sha }}
          TF_IBGE: ${{ inputs.pinned_ibge_json }}
          REPLAY_FROZEN_V2: ${{ inputs.replay_frozen_v2 }}
        run: |
          set -euo pipefail
          mkdir -p Solution/.local/v9-tf-physical
          if [[ "$REPLAY_FROZEN_V2" == "true" ]]; then
            test -z "$TF_IBGE" || { echo "V2 replay derives exact frozen IBGE pin; do not submit an override" >&2; exit 1; }
            TF_IBGE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('Solution/data/calibration/v9/v2-one-mf-frozen/plan.json').read_text())
          keys=('PinnedIbgeReferenceVersionId','PinnedIbgePublishedSha256','PinnedIbgeMaterializedFrequencySha256','PinnedIbgeBootstrap')
          print(json.dumps({k:p[k] for k in keys},separators=(',',':')))
          PY
            )"
          fi
          python3 Solution/scripts/v9-tf-30k-dispatch-gate.py \
            --mode execute_30k --expected-sha "$TF_SHA" --ref "$GITHUB_REF" \
            --pinned-json "$TF_IBGE" \
            --output Solution/.local/v9-tf-physical/git-approved.json \
            --pinned-output Solution/.local/v9-tf-physical/pinned-ibge.json
      - name: Recover authenticated historic V2 plan and study from original run (read-only)
        if: inputs.replay_frozen_v2 == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          ref=json.loads(Path('Solution/data/reference/v9-frozen-artifacts/references.json').read_text())
          source=ref['artifacts']['seed42-source']
          assert source['run_id']==41900357031
          assert source['head_sha']=='935f704edd2bceb6a125ecfe532ad5b71f9c89b9'
          PY
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41900357031" --jq '.head_sha')" = "935f704edd2bceb6a125ecfe532ad5b71f9c89b9"
          mkdir -p "$RUNNER_TEMP/v9-source-study"
          gh run download 41900357031 -R "$GITHUB_REPOSITORY" \
            -n v9-tf-45-physical-41900357031-935f704edd2bceb6a125ecfe532ad5b71f9c89b9 \
            -D "$RUNNER_TEMP/v9-source-study"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'v9-source-study'
          ref=json.loads(Path('Solution/data/reference/v9-frozen-artifacts/references.json').read_text())
          pinned={f['path']:f['sha256'] for f in ref['artifacts']['seed42-source']['files']}
          for path in ('plan-tf.json','study-tf/study.json'):
              file=root/path
              assert file.is_file() and hashlib.sha256(file.read_bytes()).hexdigest()==pinned[path], 'Original V2 artifact hash mismatch: '+path
          print('V2 original plan and study authenticated against frozen SHA. No recalibration.')
          PY
      - name: Start masked disposable SQL Server
        shell: bash
        run: bash Solution/scripts/v9-tf-start-disposable-sql.sh
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
          # Cache only NuGet packages; never bypass restore, build or SQL gates.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Build the single CSharp calibrator and synthetic producer
        working-directory: Solution
        run: |
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          dotnet build -c Release src/Jornada.Linkage.Parameters.Worker/Jornada.Linkage.Parameters.Worker.csproj
      - name: Prove single V2 configuration matches archived original in CSharp (no SQL)
        if: inputs.replay_frozen_v2 == true
        working-directory: Solution
        run: |
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- \
            --v9-compare-calibration-plans \
            "$RUNNER_TEMP/v9-source-study/plan-tf.json" \
            "$PWD/data/calibration/v9/v2-one-mf-frozen/plan.json" \
            b6f5f5197074f7ecedf004745f763df3b66a0496f9355589242062f9f1d33ee8
      - name: Rebuild SQL IBGE and 30k corpus using the identical preflight preparation
        working-directory: Solution
        run: bash scripts/v9-tf-prepare-pin.sh "$PWD/.local/v9-tf-physical" reconstructed-ibge.json
      - name: Compare all four pinned reference fields BEFORE executing any calibration
        working-directory: Solution
        run: |
          set -euo pipefail
          python3 scripts/v9-tf-pin-source.py verify \
            --expected .local/v9-tf-physical/pinned-ibge.json \
            --actual .local/v9-tf-physical/reconstructed-ibge.json

      - name: Recheck SHA and calibrate with JSON-file parameters (CSharp only)
        working-directory: Solution
        env:
          TF_SHA: ${{ inputs.expected_sha }}
          REPLAY_FROZEN_V2: ${{ inputs.replay_frozen_v2 }}
        run: |
          set -euo pipefail
          root="$PWD/.local/v9-tf-physical"
          python3 scripts/v9-tf-30k-dispatch-gate.py \
            --mode execute_30k --expected-sha "$TF_SHA" --ref "$GITHUB_REF" \
            --pinned-json "$(cat "$root/pinned-ibge.json")" \
            --output "$root/git-rechecked.json" --pinned-output "$root/pinned-rechecked.json"
          cmp "$root/pinned-ibge.json" "$root/pinned-rechecked.json"
          if [[ "$REPLAY_FROZEN_V2" == "true" ]]; then
            python3 scripts/v9-v2-frozen-bootstrap.py prepare \
              --plan data/calibration/v9/v2-one-mf-frozen/plan.json \
              --original-plan "$RUNNER_TEMP/v9-source-study/plan-tf.json" \
              --references data/reference/v9-frozen-artifacts/references.json \
              --observations "$root/people-30k/observacoes.csv" \
              --generation-manifest "$root/people-30k/generation-manifest.json" \
              --pinned-ibge "$root/pinned-ibge.json" \
              --output-plan "$root/plan-tf.json" \
              --output-receipt "$root/v2-source-receipt.json"
          else
            python3 scripts/v9-adaptive-30k-study.py prepare-tf \
              "$root/people-30k/observacoes.csv" "$root/plan-tf.json" \
              --pinned-ibge "$root/pinned-ibge.json"
          fi
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- \
            --v9-adaptive-study "$root/plan-tf.json" \
            "$root/people-30k/observacoes.csv" "$root/study-tf"
          python3 - "$root/study-tf" <<'PY'
          import json, sys
          from pathlib import Path
          d = Path(sys.argv[1])
          p = json.loads((d / "plan.json").read_bytes())
          rows = json.loads((d / "tf-shared-paired-diagnostics.json").read_bytes())
          measured = json.loads((d / "study.json").read_bytes())
          assert len(p["ModelOptions"]) == 45
          assert sum(x["EligibleForSelection"] for x in p["ModelOptions"]) == 41
          assert p["MaximumComparedConfigurations"] == 3861
          assert len(measured["SourceMeasurements"]) == 135
          assert len(rows) == 12
          assert len({(r["DiagnosticOptionId"], r["ConflictMargin"], r["CandidateGrouping"]) for r in rows}) == 12
          assert all(r["SharedSurnameCountMeasured"] and not r["EligibleForSelection"]
                     and not r["FalseCreationsMeasured"] and r["SharedFalseCreations"] is None
                     and r["BilateralFalseCreations"] is None and len(r["CandidatePairsSha256"]) == 64 for r in rows)
          # Verify the physical frozen TF plan really opted in and that the
          # new exploratory result was produced, without forcing the winner.
          assert p["ExploratoryRiskPreference"] == {"FdrUpperTolerancePp": 0.05}
          preference = measured.get("ExploratoryRiskPreference")
          assert preference and preference["Version"] == "V9_EXPLORATORY_CP_RISK_BAND_V1"
          assert preference["FdrUpperTolerancePp"] == p["ExploratoryRiskPreference"]["FdrUpperTolerancePp"]
          assert preference["Status"] == "EXPLORATORY_RISK_PREFERENCE_NOT_CERTIFIED"
          assert preference["SuggestedOptionId"] in preference["RiskBandOptionIds"]
          assert preference["SuggestedOptionId"] in {
              item["Option"]["OptionId"] for item in measured["Pareto"]["Table"]
          }
          assert measured["Pareto"]["InitialSuggestedOptionId"] is None
          print("PASS: CSharp measured 135 TF arms, 12 diagnostics and risk-band preference; not certified.")
          PY
      - name: Regress new configured V2 calibration against authenticated original physical study
        if: inputs.replay_frozen_v2 == true
        working-directory: Solution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$PWD/.local/v9-tf-physical"
          python3 - <<'PY'
          import json
          from pathlib import Path
          ref=json.loads(Path('data/reference/v9-frozen-artifacts/references.json').read_text())
          source=ref['artifacts']['seed42-source']
          assert source['run_id']==41900357031
          assert source['head_sha']=='935f704edd2bceb6a125ecfe532ad5b71f9c89b9'
          PY
          test -s "$RUNNER_TEMP/v9-source-study/study-tf/study.json"
          python3 scripts/v9-v2-frozen-bootstrap.py compare \
            --references data/reference/v9-frozen-artifacts/references.json \
            --original-study "$RUNNER_TEMP/v9-source-study/study-tf/study.json" \
            --replay-study "$root/study-tf/study.json" \
            --receipt "$root/v2-source-receipt.json" \
            --output "$root/v2-calibration-regression.json"
          python3 - "$root/v2-calibration-regression.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          print('### Frozen V2 calibrated again from EXACT Git-versioned exploration plan')
          for k in ('Status','SameCorpusAndPartitions','SameConfigurationGrid','ComparedSourceConfigurations',
                    'DifferentMetricRows','DifferentFitSnapshots','SelectedSnapshotExactMatch'):
              print('- '+k+': '+str(x[k]))
          print('- No TEST, no DT-15, no model activation.')
          PY
          python3 - "$root/v2-calibration-regression.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['Status']=='REPRODUCED_EXACTLY', 'Configured V2 calibration diverges: regression dossier preserved'
          PY

      - name: Preserve SHA-bound TF evidence (no CSV/PII or TEST)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9-tf-45-physical-${{ github.run_id }}-${{ github.sha }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            Solution/.local/v9-tf-physical/git-approved.json
            Solution/.local/v9-tf-physical/git-rechecked.json
            Solution/.local/v9-tf-physical/pinned-ibge.json
            Solution/.local/v9-tf-physical/reconstructed-ibge.json
            Solution/.local/v9-tf-physical/bootstrap.json
            Solution/.local/v9-tf-physical/plan-tf.json
            Solution/.local/v9-tf-physical/plan-tf.tf-budget.json
            Solution/.local/v9-tf-physical/v2-source-receipt.json
            Solution/.local/v9-tf-physical/v2-calibration-regression.json
            Solution/.local/v9-tf-physical/study-tf/*.json
            Solution/.local/v9-tf-physical/study-tf/*.fitted.json
            Solution/.local/v9-tf-physical/people-30k/generation-manifest.json
      - name: Remove disposable SQL Server
        if: always()
        shell: bash
        run: docker rm -f "v9-probe-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >/dev/null 2>&1 || true

  # Stable required check preserves the old status context without faking execution.
  physical-seed42:
    name: SQL físico 30k clean — FS blind Rank-Resolve TF0
    needs: [impact, physical-30k]
    # Manual preflight is deliberately NOT physical evidence. The physical check
    # is skipped (not green) in this mode; PR and execute_30k remain fail-closed.
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Enforce all impacted full-probe runs and record legitimate no-op
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          REQUIRES_PHYSICAL: ${{ needs.impact.outputs.run_physical_30k }}
          PHYSICAL_RESULT: ${{ needs.physical-30k.result }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$IMPACT_RESULT" != "success" ]]; then
            echo "Impact classification did not succeed; no skipping permitted." >&2
            exit 1
          fi
          if [[ "$REQUIRES_PHYSICAL" == "true" ]]; then
            if [[ "$PHYSICAL_RESULT" == "success" && ( "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "push" ) ]]; then
              echo "PASS: CSharp 45-arm --v9-adaptive-study TF physical 30k on $HEAD_SHA."
            elif [[ "$EVENT_NAME" == "pull_request" && "$PHYSICAL_RESULT" == "skipped" ]]; then
              # A manual dispatch on the exact PR head SHA is independently verifiable.
              # A prior success on another SHA, an in-progress run, or a skipped
              # physical job must never count as acceptance.
              export HEAD_SHA GH_TOKEN REPOSITORY
              python3 Solution/scripts/v9_manual_probe_evidence.py
            else
              echo "::error title=DEFERRED_NOT_CERTIFIED::Required V9 30k has no successful evidence for this run (event=$EVENT_NAME, result=$PHYSICAL_RESULT)." >&2
              exit 1
            fi
          elif [[ "$REQUIRES_PHYSICAL" == "false" ]]; then
            test "$PHYSICAL_RESULT" = "skipped" || {
              echo "Unexpected physical job result for a Gold-only/docs change: $PHYSICAL_RESULT" >&2
              exit 1
            }
            echo "NOT_REQUIRED_FOR_THIS_DIFF: the physical calibration was not run."
          else
            echo "No valid impact decision; fail closed." >&2
            exit 1
          fi
