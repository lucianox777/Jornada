name: jornada-powershell-local-gates

on:
  push:
    paths:
      - 'Solution/scripts/local-ddl-upgrade.ps1'
      - 'Solution/scripts/local-test.ps1'
      - 'Solution/scripts/local-test-all.ps1'
      - 'Solution/scripts/local-test-from-zero.ps1'
      - 'Solution/scripts/local-e2e.ps1'
      - 'Solution/scripts/local-diagnose-ibge-reference.ps1'
      - 'Solution/scripts/local-test-ibge-diagnostic.ps1'
      - 'Solution/scripts/local-check-ibge-reference.ps1'
      - 'Solution/scripts/local-load-ibge-reference.ps1'
      - 'Solution/scripts/local-test-ibge-reference-load-safety.ps1'
      - 'Solution/scripts/local-test-test-all-safety.ps1'
      - 'Solution/scripts/local-test-round.ps1'
      - 'Solution/scripts/local-cluster.ps1'
      - 'Solution/scripts/local-linkage-evaluation-smoke.ps1'
      - 'Solution/scripts/local-linkage-validation.ps1'
      - 'Solution/scripts/local-linkage-validation-flow.ps1'
      - 'Solution/scripts/local-linkage-validation-from-zero.ps1'
      - 'Solution/scripts/local-linkage-monte-carlo-validation.ps1'
      - 'Solution/scripts/local-ibge-u-bootstrap.ps1'
      - 'Solution/scripts/blocking-pass-fanout-gate.py'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/local-sql-runtime-smoke.ps1'
      - 'Solution/scripts/local-db.ps1'
      - '.github/workflows/powershell-local-gates.yml'
  pull_request:
    paths:
      - 'Solution/scripts/local-ddl-upgrade.ps1'
      - 'Solution/scripts/local-test.ps1'
      - 'Solution/scripts/local-test-all.ps1'
      - 'Solution/scripts/local-test-from-zero.ps1'
      - 'Solution/scripts/local-e2e.ps1'
      - 'Solution/scripts/local-diagnose-ibge-reference.ps1'
      - 'Solution/scripts/local-test-ibge-diagnostic.ps1'
      - 'Solution/scripts/local-check-ibge-reference.ps1'
      - 'Solution/scripts/local-load-ibge-reference.ps1'
      - 'Solution/scripts/local-test-ibge-reference-load-safety.ps1'
      - 'Solution/scripts/local-test-test-all-safety.ps1'
      - 'Solution/scripts/local-test-round.ps1'
      - 'Solution/scripts/local-cluster.ps1'
      - 'Solution/scripts/local-linkage-evaluation-smoke.ps1'
      - 'Solution/scripts/local-linkage-validation.ps1'
      - 'Solution/scripts/local-linkage-validation-flow.ps1'
      - 'Solution/scripts/local-linkage-validation-from-zero.ps1'
      - 'Solution/scripts/local-linkage-monte-carlo-validation.ps1'
      - 'Solution/scripts/local-ibge-u-bootstrap.ps1'
      - 'Solution/scripts/blocking-pass-fanout-gate.py'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/local-sql-runtime-smoke.ps1'
      - 'Solution/scripts/local-db.ps1'
      - '.github/workflows/powershell-local-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'

      - name: Validate UTF-8 BOM and PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/local-ddl-upgrade.ps1',
            'scripts/local-test.ps1',
            'scripts/local-test-all.ps1',
            'scripts/local-test-from-zero.ps1',
            'scripts/local-e2e.ps1',
            'scripts/local-diagnose-ibge-reference.ps1',
            'scripts/local-test-ibge-diagnostic.ps1',
            'scripts/local-check-ibge-reference.ps1',
            'scripts/local-load-ibge-reference.ps1',
            'scripts/local-test-ibge-reference-load-safety.ps1',
            'scripts/local-test-test-all-safety.ps1',
            'scripts/local-test-round.ps1',
            'scripts/local-cluster.ps1',
            'scripts/local-linkage-evaluation-smoke.ps1',
            'scripts/local-linkage-validation.ps1',
            'scripts/local-linkage-validation-flow.ps1',
            'scripts/local-linkage-validation-from-zero.ps1',
            'scripts/local-linkage-monte-carlo-validation.ps1',
            'scripts/local-ibge-u-bootstrap.ps1',
            'scripts/local-scale.ps1',
            'scripts/local-sql-runtime-smoke.ps1',
            'scripts/local-db.ps1'
          )
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "UTF-8 BOM ausente em $file; Windows PowerShell 5.1 pode corromper acentos."
            }
            $null = [scriptblock]::Create((Get-Content -Raw -Encoding UTF8 $file))
            Write-Host "POWERSHELL UTF-8 BOM/PARSE OK: $file"
          }

      - name: Validate local-test-all preservation and from-zero guard
        shell: pwsh
        run: ./scripts/local-test-test-all-safety.ps1

      - name: Validate IBGE reference load safety
        shell: pwsh
        run: ./scripts/local-test-ibge-reference-load-safety.ps1

      - name: Validate blocking pass fan-out gate self-test
        shell: bash
        run: python3 scripts/blocking-pass-fanout-gate.py --self-test

      - name: Validate local scale environment parity
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-scale.ps1
          if (-not $content.Contains('$env:DOTNET_ENVIRONMENT=''Development''')) {
            throw 'local-scale.ps1 deve executar o harness inteiro em DOTNET_ENVIRONMENT=Development.'
          }
          if (-not $content.Contains('$env:DOTNET_ENVIRONMENT=$previousDotnetEnvironment')) {
            throw 'local-scale.ps1 deve restaurar DOTNET_ENVIRONMENT ao terminar.'
          }
          Write-Host 'LOCAL SCALE ENVIRONMENT CONTRACT: OK'

      - name: Validate local suite preservation and from-zero separation
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-test-all.ps1
          $fromZero = Get-Content -Raw -Encoding UTF8 scripts/local-test-from-zero.ps1
          $e2e = Get-Content -Raw -Encoding UTF8 scripts/local-e2e.ps1
          $db = Get-Content -Raw -Encoding UTF8 scripts/local-db.ps1

          if ($content -notmatch "Invoke-Git @\('worktree','add','--detach'") {
            throw 'local-test-all.ps1 deve executar origin/master em worktree destacado.'
          }
          foreach ($required in @(
            "Invoke-PowerShellScript 'local-check-ibge-reference.ps1'",
            "Invoke-PowerShellScript 'local-e2e.ps1'",
            "Invoke-ClusterAction 'up'",
            'ibgeReferencePreserved = $true',
            'destructiveReset = $false'
          )) {
            if (-not $content.Contains($required)) {
              throw "local-test-all.ps1 perdeu contrato preservador: $required"
            }
          }
          foreach ($forbidden in @(
            '[switch]$AllowDestructiveReset',
            "Invoke-PowerShellScript 'local-db.ps1' @('-Action', 'reset')",
            "Invoke-ClusterAction 'clean'",
            "Invoke-PowerShellScript 'local-scale.ps1'"
          )) {
            if ($content.Contains($forbidden)) {
              throw "local-test-all.ps1 nao pode ser destrutivo: $forbidden"
            }
          }

          foreach ($required in @(
            '[switch]$AllowDestructiveReset',
            'if (-not $AllowDestructiveReset)',
            "Invoke-Script 'local-cluster.ps1' @('-Action','clean')",
            "Invoke-Script 'local-db.ps1' @('-Action','reset')",
            "Invoke-Script 'local-scale.ps1' @('-Profile','smoke')",
            "Invoke-Script 'local-load-ibge-reference.ps1' @('-AllowLoad')"
          )) {
            if (-not $fromZero.Contains($required)) {
              throw "local-test-from-zero.ps1 perdeu contrato explicito: $required"
            }
          }

          foreach ($required in @(
            '[switch]$AllowSharedDatabaseReset',
            '$usesTemporaryDatabase = -not $AllowSharedDatabaseReset',
            '-NoSyntheticCorpus -DatabaseName $db',
            'DROP DATABASE [$db]'
          )) {
            if (-not $e2e.Contains($required)) {
              throw "local-e2e.ps1 perdeu isolamento do banco compartilhado: $required"
            }
          }
          if (-not $db.Contains('[string]$DatabaseName')) {
            throw 'local-db.ps1 deve permitir banco isolado por nome explicito.'
          }

          if (-not $content.Contains('function Write-CommandLine') -or
              -not $content.Contains('Write-CommandLine $CurrentPowerShell')) {
            throw 'local-test-all.ps1 deve imprimir os comandos reais antes de executá-los.'
          }
          if ($content -match "Invoke-Step\s+'DDL upgrade" -or $content -match "Invoke-Step\s+'[^']*3\.65") {
            throw 'local-test-all.ps1 pré-HML não deve executar upgrade histórico por padrão.'
          }
          if (-not $content.Contains('historicalUpgradeDefault = $false')) {
            throw 'O relatório da suíte deve registrar explicitamente que upgrade histórico não é default pré-HML.'
          }
          foreach ($forbidden in @('Sync-CleanMaster', 'CleanMasterExecution', "reset','--hard", "clean','-fd")) {
            if ($content.Contains($forbidden)) {
              throw "local-test-all.ps1 não pode voltar a alterar destrutivamente o working tree: $forbidden"
            }
          }
          Write-Host 'LOCAL SUITE PRESERVATION/FROM-ZERO CONTRACT: OK'

      - name: Validate local cluster command echo without secret disclosure
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-cluster.ps1
          foreach ($required in @(
            'function Write-CommandLine',
            "Write-CommandLine 'docker'",
            "'-P','<redacted>'",
            "Write-CommandLine `$LocalDb"
          )) {
            if (-not $content.Contains($required)) {
              throw "local-cluster.ps1 perdeu contrato de command echo: $required"
            }
          }
          if ($content -match 'Write-CommandLine[^\r\n]*\$password') {
            throw 'local-cluster.ps1 não pode imprimir a senha SQL em command echo.'
          }
          Write-Host 'LOCAL CLUSTER COMMAND ECHO/SECRET REDACTION CONTRACT: OK'

      - name: Validate linkage validation and IBGE bootstrap command output
        shell: pwsh
        run: |
          $targets = @(
            'scripts/local-linkage-validation.ps1',
            'scripts/local-linkage-validation-flow.ps1',
            'scripts/local-linkage-validation-from-zero.ps1',
            'scripts/local-linkage-monte-carlo-validation.ps1',
            'scripts/local-ibge-u-bootstrap.ps1'
          )

          foreach ($target in $targets) {
            $content = Get-Content -Raw -Encoding UTF8 $target
            if ($content -match '(?m)^\s*#\s*(?:\.\\scripts\\|docker\b|Set-Location\b)') {
              throw "$target não deve duplicar comandos executáveis como comentário de código; o comando deve aparecer somente no output."
            }
          }

          $validation = Get-Content -Raw -Encoding UTF8 scripts/local-linkage-validation.ps1
          foreach ($required in @(
            'Write-CommandLine $LocalCluster',
            "Write-CommandLine 'docker'",
            'SQLCMDPASSWORD=<redacted>'
          )) {
            if (-not $validation.Contains($required)) {
              throw "local-linkage-validation.ps1 perdeu contrato de command output: $required"
            }
          }
          if ($validation -match 'Write-CommandLine[^\r\n]*\$password') {
            throw 'local-linkage-validation.ps1 não pode imprimir senha SQL.'
          }

          $flow = Get-Content -Raw -Encoding UTF8 scripts/local-linkage-validation-flow.ps1
          foreach ($required in @(
            "Write-Host '# .\scripts\local-cluster.ps1 -Action up'",
            "Write-Host '# .\scripts\local-cluster.ps1 -Action calibrate'",
            "Write-Host '# .\scripts\local-linkage-validation.ps1'",
            'SQLCMDPASSWORD=<redacted>'
          )) {
            if (-not $flow.Contains($required)) {
              throw "local-linkage-validation-flow.ps1 perdeu contrato de command output: $required"
            }
          }

          $fromZero = Get-Content -Raw -Encoding UTF8 scripts/local-linkage-validation-from-zero.ps1
          foreach ($required in @(
            'function Invoke-Step',
            'Write-Host "# $CommandText"',
            "local-cluster.ps1",
            "local-ibge-u-bootstrap.ps1",
            "local-linkage-validation.ps1"
          )) {
            if (-not $fromZero.Contains($required)) {
              throw "local-linkage-validation-from-zero.ps1 perdeu contrato de command output: $required"
            }
          }

          $monteCarlo = Get-Content -Raw -Encoding UTF8 scripts/local-linkage-monte-carlo-validation.ps1
          foreach ($required in @(
            'dotnet restore Jornada.sln',
            'dotnet build Jornada.sln --configuration Release --no-restore -warnaserror',
            'dotnet test .\tests\Jornada.Tests\Jornada.Tests.csproj',
            '.\scripts\local-cluster.ps1 -Action clean',
            '.\scripts\local-cluster.ps1 -Action calibrate',
            '.\scripts\local-ibge-u-bootstrap.ps1',
            '.\scripts\local-linkage-validation.ps1',
            'Start-Transcript',
            'Stop-Transcript'
          )) {
            if (-not $monteCarlo.Contains($required)) {
              throw "local-linkage-monte-carlo-validation.ps1 perdeu contrato obrigatório: $required"
            }
          }

          $bootstrap = Get-Content -Raw -Encoding UTF8 scripts/local-ibge-u-bootstrap.ps1
          foreach ($required in @(
            "Write-Host '# .\scripts\local-cluster.ps1 -Action up'",
            'function Write-CommandLine',
            "Write-CommandLine 'docker' `$workerArgs",
            "Write-CommandLine 'docker' `$copyArgs",
            'REPORT_IBGE_U_BOOTSTRAP'
          )) {
            if (-not $bootstrap.Contains($required)) {
              throw "local-ibge-u-bootstrap.ps1 perdeu contrato de command output: $required"
            }
          }
          Write-Host 'LINKAGE VALIDATION/IBGE BOOTSTRAP COMMAND OUTPUT CONTRACT: OK'
      - name: Validate canonical audit preservation and destructive scale ownership
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-test-all.ps1
          $fromZero = Get-Content -Raw -Encoding UTF8 scripts/local-test-from-zero.ps1

          $audit = $content.IndexOf("Invoke-Step 'Auditoria read-only de candidate recall/rank'")
          $finalCheck = $content.IndexOf("Invoke-Step 'Referencia IBGE final: continua integra e ATIVA'")
          if ($audit -lt 0 -or $finalCheck -lt 0 -or $audit -ge $finalCheck) {
            throw 'A suite full preservadora deve auditar e depois confirmar novamente a referencia IBGE.'
          }
          if ($content -notmatch "JORNADA_EVALUATION_SCALE_PEOPLE = '5000'") {
            throw 'A auditoria canonica deve usar a populacao SCALE Gold canonica de 5000 Pessoas.'
          }
          if ($content.Contains('local-scale.ps1') -or $content.Contains("Invoke-ClusterAction 'clean'")) {
            throw 'Scale/clean pertencem exclusivamente ao fluxo from-zero.'
          }
          foreach ($required in @(
            "Invoke-Script 'local-scale.ps1' @('-Profile','smoke')",
            "Invoke-Script 'local-db.ps1' @('-Action','reset')",
            "Invoke-Script 'local-load-ibge-reference.ps1' @('-AllowLoad','-NoBuild')",
            "Invoke-Script 'local-check-ibge-reference.ps1'"
          )) {
            if (-not $fromZero.Contains($required)) {
              throw "Fluxo from-zero perdeu fechamento destrutivo/restauracao: $required"
            }
          }
          Write-Host 'LOCAL SUITE PRESERVATION/DESTRUCTIVE SCALE OWNERSHIP: OK'

      - name: Validate continuous round runner and Evaluation fan-out gate
        shell: pwsh
        run: |
          $runnerPath = 'scripts/local-test-round.ps1'
          $content = Get-Content -Raw -Encoding UTF8 $runnerPath
          $lines = @($content -split "`r?`n")
          $firstInstruction = $lines | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1
          if ($firstInstruction.Trim() -ne 'cls') {
            throw "$runnerPath deve começar por cls."
          }
          $audit = $content.IndexOf("local-linkage-evaluation-smoke.ps1")
          $finalCheck = $content.IndexOf("14/14 - Quick check IBGE final")
          if ($audit -lt 0 -or $finalCheck -lt 0 -or $audit -ge $finalCheck) {
            throw "$runnerPath deve executar Evaluation antes do quick check IBGE final."
          }
          foreach ($forbidden in @('local-cluster.ps1 -Action clean','local-db.ps1 -Action reset','local-scale.ps1 -Profile smoke')) {
            if ($content.Contains($forbidden)) {
              throw "$runnerPath padrao deve preservar banco/IBGE; encontrado: $forbidden"
            }
          }
          if (-not $content.Contains('local-test-from-zero.ps1 -Suite full -AllowDestructiveReset')) {
            throw "$runnerPath deve apontar explicitamente o fluxo destrutivo from-zero."
          }
          if (-not $content.Contains('Write-Host "# $CommandText"')) {
            throw "$runnerPath deve imprimir cada comando no output antes de executá-lo."
          }
          if ($content -match "Invoke-Step\s+'[^']*Upgrade DDL" -or $content -match "Invoke-Step\s+'[^']*3\.65") {
            throw 'A rodada contínua pré-HML não deve executar upgrade de baseline histórico por padrão.'
          }
          if (-not $content.Contains('Gate histórico pré-HML opcional: .\scripts\local-ddl-upgrade.ps1')) {
            throw 'A rodada contínua deve manter o gate histórico disponível como comando manual explícito.'
          }
          if ($content.Contains('Read-Host')) {
            throw 'Runner contínuo não pode aguardar ENTER.'
          }

          $wrapper = Get-Content -Raw -Encoding UTF8 scripts/local-linkage-evaluation-smoke.ps1
          foreach ($required in @(
            'linkage-evaluation-smoke.sh',
            "JORNADA_EVALUATION_SCALE_PEOPLE = '5000'",
            'JORNADA_EVALUATION_SQL_CONTAINER_ID',
            'blocking-pass-fanout-gate.py',
            'blocking-pass-audit.json'
          )) {
            if (-not $wrapper.Contains($required)) {
              throw "Wrapper local do Evaluation perdeu contrato obrigatório: $required"
            }
          }
          Write-Host 'CONTINUOUS ROUND/EVALUATION FAN-OUT CONTRACT: OK'

      - name: Execute DDL upgrade gate through PowerShell
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          ./scripts/local-ddl-upgrade.ps1

      - name: Upload DDL PowerShell evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-ddl-upgrade-evidence
          path: Solution/.local/ddl-upgrade
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Recreate canonical local database through PowerShell
        shell: pwsh
        run: ./scripts/local-db.ps1 -Action reset

      - name: Execute read-only IBGE diagnostic contract
        shell: pwsh
        run: ./scripts/local-test-ibge-diagnostic.ps1 -NoStart

      - name: Execute SQL runtime smoke through PowerShell on schema 3.70
        shell: pwsh
        run: ./scripts/local-sql-runtime-smoke.ps1

      - name: Cleanup
        if: always()
        shell: bash
        run: docker compose --env-file .env down -v --remove-orphans || true