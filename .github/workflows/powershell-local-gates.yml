name: jornada-powershell-local-gates

on:
  push:
    paths:
      - 'Solution/scripts/local-ddl-upgrade.ps1'
      - 'Solution/scripts/local-test.ps1'
      - 'Solution/scripts/local-test-all.ps1'
      - 'Solution/scripts/local-test-round-paused.ps1'
      - 'Solution/scripts/local-linkage-evaluation-smoke.ps1'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/local-sql-runtime-smoke.ps1'
      - 'Solution/scripts/local-db.ps1'
      - '.github/workflows/powershell-local-gates.yml'
  pull_request:
    paths:
      - 'Solution/scripts/local-ddl-upgrade.ps1'
      - 'Solution/scripts/local-test.ps1'
      - 'Solution/scripts/local-test-all.ps1'
      - 'Solution/scripts/local-test-round-paused.ps1'
      - 'Solution/scripts/local-linkage-evaluation-smoke.ps1'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/local-sql-runtime-smoke.ps1'
      - 'Solution/scripts/local-db.ps1'
      - '.github/workflows/powershell-local-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'

      - name: Validate UTF-8 BOM and PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            'scripts/local-ddl-upgrade.ps1',
            'scripts/local-test.ps1',
            'scripts/local-test-all.ps1',
            'scripts/local-test-round-paused.ps1',
            'scripts/local-linkage-evaluation-smoke.ps1',
            'scripts/local-scale.ps1',
            'scripts/local-sql-runtime-smoke.ps1',
            'scripts/local-db.ps1'
          )
          foreach ($file in $files) {
            $bytes = [System.IO.File]::ReadAllBytes($file)
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              throw "UTF-8 BOM ausente em $file; Windows PowerShell 5.1 pode corromper acentos."
            }
            $null = [scriptblock]::Create((Get-Content -Raw -Encoding UTF8 $file))
            Write-Host "POWERSHELL UTF-8 BOM/PARSE OK: $file"
          }

      - name: Validate local scale environment parity
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-scale.ps1
          if (-not $content.Contains('$env:DOTNET_ENVIRONMENT=''Development''')) {
            throw 'local-scale.ps1 deve executar o harness inteiro em DOTNET_ENVIRONMENT=Development.'
          }
          if (-not $content.Contains('$env:DOTNET_ENVIRONMENT=$previousDotnetEnvironment')) {
            throw 'local-scale.ps1 deve restaurar DOTNET_ENVIRONMENT ao terminar.'
          }
          Write-Host 'LOCAL SCALE ENVIRONMENT CONTRACT: OK'

      - name: Validate local suite isolation and deterministic database reset
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-test-all.ps1
          if ($content -notmatch "Invoke-Git @\('worktree','add','--detach'") {
            throw 'local-test-all.ps1 deve executar origin/master em worktree destacado.'
          }
          if ($content -notmatch "Invoke-PowerShellScript 'local-db\.ps1' @\('-Action', 'reset'\)") {
            throw 'local-test-all.ps1 deve recriar o banco canônico antes do Core.'
          }
          foreach ($forbidden in @('Sync-CleanMaster', 'CleanMasterExecution', "reset','--hard", "clean','-fd")) {
            if ($content.Contains($forbidden)) {
              throw "local-test-all.ps1 não pode voltar a alterar destrutivamente o working tree: $forbidden"
            }
          }
          Write-Host 'LOCAL SUITE ISOLATION/RESET CONTRACT: OK'

      - name: Validate canonical audit before scale and canonical restoration
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-test-all.ps1
          $audit = $content.IndexOf("Invoke-Step 'Auditoria read-only de candidate recall/rank'")
          $clean = $content.IndexOf("Invoke-Step 'Encerrar cluster antes do harness de escala'")
          $scale = $content.IndexOf("Invoke-Step 'Scale harness smoke + restauração do banco canônico'")
          if ($audit -lt 0 -or $clean -lt 0 -or $scale -lt 0 -or -not ($audit -lt $clean -and $clean -lt $scale)) {
            throw 'A suíte full deve auditar o corpus canônico antes de limpar o cluster e executar o scale smoke.'
          }
          if ($content -notmatch "JORNADA_EVALUATION_SCALE_PEOPLE = '5000'") {
            throw 'A auditoria canônica deve usar a população SCALE Gold canônica de 5000 Pessoas.'
          }
          $scaleBlock = $content.Substring($scale)
          if ($scaleBlock -notmatch "Invoke-PowerShellScript 'local-scale\.ps1' @\('-Profile', 'smoke'\)" -or
              $scaleBlock -notmatch "Invoke-PowerShellScript 'local-db\.ps1' @\('-Action', 'reset'\)") {
            throw 'O scale smoke da suíte full deve restaurar deterministicamente o banco canônico ao terminar.'
          }
          Write-Host 'LOCAL SUITE CANONICAL AUDIT/SCALE RESTORE CONTRACT: OK'

      - name: Validate paused round covers Evaluation and isolates SCALE
        shell: pwsh
        run: |
          $content = Get-Content -Raw -Encoding UTF8 scripts/local-test-round-paused.ps1
          $audit = $content.IndexOf("local-linkage-evaluation-smoke.ps1")
          $clean = $content.IndexOf("16/19 - Encerrar cluster antes do SCALE")
          $scale = $content.IndexOf("17/19 - Smoke de escala + probe sincronizado de coordenação")
          if ($audit -lt 0 -or $clean -lt 0 -or $scale -lt 0 -or -not ($audit -lt $clean -and $clean -lt $scale)) {
            throw 'A rodada pausada deve executar Evaluation antes de encerrar o cluster e iniciar o SCALE.'
          }
          if ($content -notmatch "local-cluster\.ps1 -Action clean" -or
              $content -notmatch "local-db\.ps1 -Action reset") {
            throw 'A rodada pausada deve isolar o SCALE e restaurar o banco canônico.'
          }
          $wrapper = Get-Content -Raw -Encoding UTF8 scripts/local-linkage-evaluation-smoke.ps1
          foreach ($required in @(
            'linkage-evaluation-smoke.sh',
            "JORNADA_EVALUATION_SCALE_PEOPLE = '5000'",
            'JORNADA_EVALUATION_SQL_CONTAINER_ID'
          )) {
            if (-not $wrapper.Contains($required)) {
              throw "Wrapper local do Evaluation perdeu contrato obrigatório: $required"
            }
          }
          Write-Host 'PAUSED ROUND EVALUATION/SCALE ISOLATION CONTRACT: OK'

      - name: Execute DDL upgrade gate through PowerShell
        shell: pwsh
        run: |
          Copy-Item .env.example .env
          ./scripts/local-ddl-upgrade.ps1

      - name: Upload DDL PowerShell evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powershell-ddl-upgrade-evidence
          path: Solution/.local/ddl-upgrade
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Recreate canonical local database through PowerShell
        shell: pwsh
        run: ./scripts/local-db.ps1 -Action reset

      - name: Execute SQL runtime smoke through PowerShell on schema 3.70
        shell: pwsh
        run: ./scripts/local-sql-runtime-smoke.ps1

      - name: Cleanup
        if: always()
        shell: bash
        run: docker compose --env-file .env down -v --remove-orphans || true
