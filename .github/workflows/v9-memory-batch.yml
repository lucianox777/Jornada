name: v9-memory-batch
on:
  workflow_dispatch:
    inputs:
      rows_path:
        description: 'Committed synthetic JSONL relative to Solution'
        required: true
        type: string
      configs_path:
        description: 'Committed configuration JSON relative to Solution'
        required: true
        type: string
  pull_request:
    paths:
      - 'Solution/scripts/v9-batch-memory-configs.py'
      - 'Solution/scripts/v9-birth-tf-train.py'
      - 'Solution/tests/fixtures/test_v9*.py'
      - 'Solution/tests/fixtures/v9-*.jsonl'
      - 'Solution/tests/fixtures/v9-*.json'
      - '.github/workflows/v9-memory-batch.yml'
permissions:
  contents: read
  actions: read
jobs:
  validate-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and CLI
        run: |
          python -m py_compile Solution/scripts/v9-batch-memory-configs.py
          python Solution/scripts/v9-batch-memory-configs.py --help
      - name: Regression tests for V9 blocking and TF
        run: |
          python -m unittest discover -s Solution/tests/fixtures -p 'test_v9*.py' -v
      - name: Fixture six-configuration experiment
        run: |
          python Solution/scripts/v9-batch-memory-configs.py --rows Solution/tests/fixtures/v9-memory-small.jsonl --configs Solution/tests/fixtures/v9-blocking-baselines.json --out v9-memory-fixture-report.json
          python -c "import json; r=json.load(open('v9-memory-fixture-report.json')); assert len(r['results']) == 6"
      - name: Batch experiment
        if: github.event_name == 'workflow_dispatch'
        env:
          ROWS: ${{ inputs.rows_path }}
          CONFIGS: ${{ inputs.configs_path }}
        run: |
          python - <<'PY'
          import os,pathlib
          root=pathlib.Path('Solution').resolve()
          for name in ('ROWS','CONFIGS'):
              candidate=(root / os.environ[name]).resolve()
              if not candidate.is_relative_to(root) or not candidate.is_file():
                  raise SystemExit(f"invalid committed input: {name}")
          PY
          python Solution/scripts/v9-batch-memory-configs.py --rows "Solution/$ROWS" --configs "Solution/$CONFIGS" --out v9-memory-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          name: v9-memory-report
          path: v9-memory-report.json

  frozen-original-sqlite:
    # This additional evidence runs on the same PR as, but never replaces, jornada-ci.
    # It executes on the ORIGINAL seed-42 corpus, not just synthetic tiny fixtures.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.113'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned IBGE-derived original seed42 artifact
        run: |
          mkdir -p Solution/.local/v9-sqlite-original/input
          gh run download 38593005691 --repo lucianox777/Jornada -n v9-physical-sql-active-candidate-wrong-link-30k -D Solution/.local/v9-sqlite-original/input
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Canonical C# export, TRAIN-only frozen snapshot and real in-memory SQL
        working-directory: Solution
        run: |
          dotnet run -c Release --project src/Jornada.Linkage.Evaluation -- --v9-export-canonical-csv-with-surnames .local/v9-sqlite-original/input/e2-demographic-primary/observacoes.csv .local/v9-sqlite-original/canonical.csv
          python3 scripts/v9-freeze-canonical-name-frequency.py --canonical-csv .local/v9-sqlite-original/canonical.csv --snapshot-dir .local/v9-sqlite-original/frozen --projection-version BLOCKING_PROJECTION_KEY_PROJECTOR_V4
          python3 scripts/v9-sqlite-memory-cells.py --snapshot-dir .local/v9-sqlite-original/frozen --out .local/v9-sqlite-original/report.json --cap 1000000 --max-passes 8
      - name: C#-normalized P-prefix 1..4 and maternal initial 1..4 indexed-SQL sweep
        working-directory: Solution
        run: |
          python3 scripts/v9-prefix-mother-initial-sweep.py --snapshot-dir .local/v9-sqlite-original/frozen --baseline-report .local/v9-sqlite-original/report.json --out .local/v9-sqlite-original/prefix-mother-initial-sweep.json --cap 1000000
      - name: Compare same-source ABCD sixteen proxy arms, E0, 19 compositions and live frequency-indexed adaptation
        working-directory: Solution
        run: |
          python3 scripts/v9-abcd-adaptive-physical-comparison.py \
            --snapshot-dir .local/v9-sqlite-original/frozen \
            --baseline-report .local/v9-sqlite-original/report.json \
            --out .local/v9-sqlite-original/abcd-adaptive-physical-comparison.json \
            --cap 1000000
      - name: Publish ABCD, optimized composition and real adaptive QUERY aggregates, never identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v9-abcd-adaptive-compositions-seed42-sql-aggregates
          path: Solution/.local/v9-sqlite-original/abcd-adaptive-physical-comparison.json
          if-no-files-found: error
      - name: Upload prefix and maternal-initial aggregate comparison, never identities
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v9-prefix-mother-initial-seed42-aggregates
          path: Solution/.local/v9-sqlite-original/prefix-mother-initial-sweep.json
          if-no-files-found: ignore
      - name: Export ONLY aggregate M/U/recall, never raw observations or frequency tables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: v9-sqlite-memory-cells-seed42-aggregates
          path: Solution/.local/v9-sqlite-original/report.json
          if-no-files-found: ignore
