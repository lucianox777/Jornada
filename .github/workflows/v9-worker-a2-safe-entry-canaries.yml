name: v9-worker-a2-safe-entry-canaries
on:
  pull_request:
    paths:
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/Program.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9WorkerEntryBoundary.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9WorkerSafeHostLoggerProvider.cs'
      - 'Solution/tests/Jornada.Tests/Unit/V9WorkerEntryBoundaryTests.cs'
      - '.github/workflows/v9-worker-a2-safe-entry-canaries.yml'
  push:
    branches: [master]
    paths:
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/Program.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9WorkerEntryBoundary.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9WorkerSafeHostLoggerProvider.cs'
      - 'Solution/tests/Jornada.Tests/Unit/V9WorkerEntryBoundaryTests.cs'
      - '.github/workflows/v9-worker-a2-safe-entry-canaries.yml'
permissions:
  contents: read
jobs:
  entrypoint-canaries:
    name: All CLI flags and host exception redaction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Compile and run every A2 command canary on this SHA
        working-directory: Solution
        run: |
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj \
            -c Release \
            --filter "FullyQualifiedName~V9WorkerEntryBoundaryTests" \
            --logger "console;verbosity=normal"
