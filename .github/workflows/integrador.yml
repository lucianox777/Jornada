name: jornada-integrador

on:
  push:
    paths:
      - 'Solution/clients/Jornada.Integrador.CSharp/**'
      - 'Solution/clients/integrador.config.example.json'
      - 'Solution/src/Jornada.Resultado.Api/**'
      - 'Solution/src/Jornada.Operational.Sql/**'
      - 'Solution/tests/Jornada.Integrador.Tests/**'
      - '.github/workflows/integrador.yml'
  pull_request:
    paths:
      - 'Solution/clients/Jornada.Integrador.CSharp/**'
      - 'Solution/clients/integrador.config.example.json'
      - 'Solution/src/Jornada.Resultado.Api/**'
      - 'Solution/src/Jornada.Operational.Sql/**'
      - 'Solution/tests/Jornada.Integrador.Tests/**'
      - '.github/workflows/integrador.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-integrator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - name: Generate and commit exact resultado service lock
        run: |
          dotnet restore src/Jornada.Resultado.Api/Jornada.Resultado.Api.csproj --use-lock-file --force-evaluate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Jornada.Resultado.Api/packages.lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh result service dependency lock'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Build resultado service
        run: dotnet build src/Jornada.Resultado.Api/Jornada.Resultado.Api.csproj -c Release --no-restore
      - name: Restore C# integrator tests locked
        run: dotnet restore tests/Jornada.Integrador.Tests/Jornada.Integrador.Tests.csproj --locked-mode
      - name: Build C# integrator
        run: dotnet build clients/Jornada.Integrador.CSharp/Jornada.Integrador.CSharp.csproj -c Release --no-restore
      - name: Build C# integrator tests
        run: dotnet build tests/Jornada.Integrador.Tests/Jornada.Integrador.Tests.csproj -c Release --no-restore
      - name: Run C# integrator tests
        run: dotnet run --project tests/Jornada.Integrador.Tests/Jornada.Integrador.Tests.csproj -c Release --no-build --no-restore
