name: jornada-integrador

on:
  push:
    paths:
      - 'Solution/clients/**'
      - 'Solution/src/Jornada.Resultado.Api/**'
      - '.github/workflows/integrador.yml'
  pull_request:
    paths:
      - 'Solution/clients/**'
      - 'Solution/src/Jornada.Resultado.Api/**'
      - '.github/workflows/integrador.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-integrator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - name: Build resultado service
        run: dotnet build src/Jornada.Resultado.Api/Jornada.Resultado.Api.csproj -c Release --locked-mode
      - name: Build C# integrator
        run: dotnet build clients/Jornada.Integrador.CSharp/Jornada.Integrador.CSharp.csproj -c Release --locked-mode
      - name: Validate Python integrator
        run: |
          python3 -m py_compile clients/python/jornada_integrador.py
          python3 clients/python/jornada_integrador.py --help >/dev/null
