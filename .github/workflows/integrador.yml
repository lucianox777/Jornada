name: apoio-secretarias

on:
  push:
    paths:
      - 'ApoioSecretarias/**'
      - 'Solution/config/governance/schema-approvals.json'
      - 'Solution/config/contracts/**'
      - 'Solution/config/gestores/**'
      - 'Solution/Jornada.sln'
      - 'Solution/src/**/*.csproj'
      - 'Solution/tests/Jornada.Integrador.Tests/**'
      - 'Solution/database/migrations/20260921_Pessoa_V5_Contrato_371.sql'
      - 'Solution/install/windows-production/**'
      - '.github/workflows/integrador.yml'
  pull_request:
    paths:
      - 'ApoioSecretarias/**'
      - 'Solution/config/governance/schema-approvals.json'
      - 'Solution/config/contracts/**'
      - 'Solution/config/gestores/**'
      - 'Solution/Jornada.sln'
      - 'Solution/src/**/*.csproj'
      - 'Solution/tests/Jornada.Integrador.Tests/**'
      - 'Solution/database/migrations/20260921_Pessoa_V5_Contrato_371.sql'
      - 'Solution/install/windows-production/**'
      - '.github/workflows/integrador.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ApoioSecretarias
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.112'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Preparador dependencies
        run: python -m pip install -r preparador/requirements.txt
      - name: Reject SEHAB dependencies reintroduced in principal product
        run: python scripts/check-segregation.py
      - name: Negative tests for segregation boundary
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify migrated schema hashes
        run: python scripts/verify-contracts.py
      - name: Regression of retained SMADS, SMDET and SMS contracts
        run: python scripts/regression-other-gestores.py
      - name: Prepare synthetic SEHAB package regression
        run: python -m unittest discover -s preparador/tests -v
      - name: Restore support solution locked
        run: dotnet restore SolucaoApoioSecretarias.sln --locked-mode
      - name: Build support solution
        run: dotnet build SolucaoApoioSecretarias.sln -c Release --no-restore
      - name: Run CSharp transmitter regression
        run: dotnet run --project tests/Jornada.Integrador.Tests/Jornada.Integrador.Tests.csproj -c Release --no-build --no-restore
