name: jornada-identity-projection-scope
on:
  pull_request:
    paths:
      - 'Solution/src/Jornada.Contracts/IdentityCompositionCanonical.cs'
      - 'Solution/src/Jornada.Contracts/IdentityCompositionRecomposition*.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionProjectionScopeReader.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionRecompositionPlanStore.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IdentityCompositionRecomposition*.cs'
      - 'Solution/database/migrations/20260909_Identidade_Composicao_Recomposicao_Plano.sql'
      - 'Solution/database/postgresql/Jornada_Identidade_Composicao_Recomposicao_Plano.sql'
      - 'Solution/scripts/identity-composition-projection-scope-smoke.cs'
      - '.github/workflows/identity-projection-scope.yml'
  push:
    paths:
      - 'Solution/src/Jornada.Contracts/IdentityCompositionCanonical.cs'
      - 'Solution/src/Jornada.Contracts/IdentityCompositionRecomposition*.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionProjectionScopeReader.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityCompositionRecompositionPlanStore.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IdentityCompositionRecomposition*.cs'
      - 'Solution/database/migrations/20260909_Identidade_Composicao_Recomposicao_Plano.sql'
      - 'Solution/database/postgresql/Jornada_Identidade_Composicao_Recomposicao_Plano.sql'
      - 'Solution/scripts/identity-composition-projection-scope-smoke.cs'
      - '.github/workflows/identity-projection-scope.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  projection-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Solution
        shell: bash
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: J0rnada_${{ github.run_id }}_Aa9!
        ports:
          - 1433:1433
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: jornada
          POSTGRES_DB: JornadaProjectionScopeTest
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jornada -d JornadaProjectionScopeTest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Wait for SQL Server
        run: |
          set -euo pipefail
          SQL_PASSWORD="J0rnada_${GITHUB_RUN_ID}_Aa9!"
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          for attempt in $(seq 1 30); do
            if docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P "$SQL_PASSWORD" -C -Q 'SELECT 1' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs "$CID" >&2 || true
          exit 1
      - name: Build and test projection scope contracts
        run: |
          set -euo pipefail
          mkdir -p .local/projection-scope .local/projection-scope-evidence
          git rev-parse HEAD | tee .local/projection-scope-evidence/commit.txt
          git diff --check
          dotnet restore tests/Jornada.Tests/Jornada.Tests.csproj --locked-mode -v:normal 2>&1 | tee .local/projection-scope-evidence/test-restore.log
          dotnet build tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-restore -warnaserror -v:normal 2>&1 | tee .local/projection-scope-evidence/test-build.log
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~IdentityCompositionRecomposition' --logger 'trx;LogFileName=recomposition.trx' --results-directory .local/projection-scope-evidence 2>&1 | tee .local/projection-scope-evidence/unit-tests.log
          cat > .local/projection-scope/ProjectionScopeSmoke.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="../../src/Jornada.Operational.Sql/Jornada.Operational.Sql.csproj" />
              <ProjectReference Include="../../src/Jornada.Contracts/Jornada.Contracts.csproj" />
              <Compile Include="../../scripts/identity-composition-projection-scope-smoke.cs" Link="Program.cs" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore .local/projection-scope/ProjectionScopeSmoke.csproj -v:normal 2>&1 | tee .local/projection-scope-evidence/restore.log
          dotnet build .local/projection-scope/ProjectionScopeSmoke.csproj -c Release --no-restore -warnaserror -v:normal 2>&1 | tee .local/projection-scope-evidence/build.log
      - name: Install SQL Server disposable database
        run: |
          set -euo pipefail
          SQL_PASSWORD="J0rnada_${GITHUB_RUN_ID}_Aa9!"
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          sqlcmd() { docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P "$SQL_PASSWORD" -C -b "$@"; }
          sqlcmd -Q "IF DB_ID('JornadaProjectionScopeTest') IS NULL CREATE DATABASE JornadaProjectionScopeTest;"
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/Jornada_Fase1.sql > .local/projection-scope-evidence/sql-base.log 2>&1
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/migrations/20260907_Cpf_Ancora.sql > .local/projection-scope-evidence/sql-anchor.log 2>&1
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/Jornada_Identidade_Progressiva.sql > .local/projection-scope-evidence/sql-progressive.log 2>&1
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/migrations/20260908_Identidade_Composicao_Ledger.sql > .local/projection-scope-evidence/sql-ledger.log 2>&1
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Referencia_Lock.sql > .local/projection-scope-evidence/sql-reference-lock.log 2>&1
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Aplicacao.sql > .local/projection-scope-evidence/sql-application.log 2>&1
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Recomposicao_Plano.sql > .local/projection-scope-evidence/sql-recomposition.log 2>&1
          sqlcmd -d JornadaProjectionScopeTest -i /dev/stdin < database/migrations/20260909_Identidade_Composicao_Recomposicao_Plano.sql > .local/projection-scope-evidence/sql-recomposition-second.log 2>&1
          printf 'SQL_INSTALL_OK\n' >> .local/projection-scope-evidence/sql-recomposition-second.log
      - name: Install PostgreSQL disposable database
        run: |
          set -euo pipefail
          CID=$(docker ps -q --filter publish=5432 | head -1)
          test -n "$CID"
          pgsql() { docker exec -i "$CID" psql -v ON_ERROR_STOP=1 -U jornada -d JornadaProjectionScopeTest "$@"; }
          pgsql < database/postgresql/Jornada_Resultado_Core.sql > .local/projection-scope-evidence/pg-result.log 2>&1
          pgsql < database/postgresql/Jornada_Ingestion_Processor_Core.sql > .local/projection-scope-evidence/pg-ingestion.log 2>&1
          pgsql < database/postgresql/Jornada_Processor_Persistence_Core.sql > .local/projection-scope-evidence/pg-persistence.log 2>&1
          pgsql < database/postgresql/Jornada_Cpf_Ancora.sql > .local/projection-scope-evidence/pg-anchor.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Progressiva.sql > .local/projection-scope-evidence/pg-progressive.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Ledger.sql > .local/projection-scope-evidence/pg-ledger.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Referencia_Lock.sql > .local/projection-scope-evidence/pg-reference-lock.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Aplicacao.sql > .local/projection-scope-evidence/pg-application.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Recomposicao_Plano.sql > .local/projection-scope-evidence/pg-recomposition.log 2>&1
          pgsql < database/postgresql/Jornada_Identidade_Composicao_Recomposicao_Plano.sql > .local/projection-scope-evidence/pg-recomposition-second.log 2>&1
          printf 'PG_INSTALL_OK\n' >> .local/projection-scope-evidence/pg-recomposition-second.log
      - name: Prove SQL Server authoritative scope and planned recomposition
        run: |
          set -euo pipefail
          SQL_PASSWORD="J0rnada_${GITHUB_RUN_ID}_Aa9!"
          CONNECTION="Server=localhost,1433;Database=JornadaProjectionScopeTest;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=true;Encrypt=True"
          JORNADA_PROJECTION_PROVIDER=SqlServer JORNADA_PROJECTION_CONNECTION="$CONNECTION" \
            dotnet run --project .local/projection-scope/ProjectionScopeSmoke.csproj -c Release --no-build --no-restore 2>&1 | tee .local/projection-scope-evidence/sql-runtime.log
          grep -Fx 'IDENTITY PROJECTION SCOPE: OK (authoritative closure + immutable recomposition plan; no factual or Gold/Serving writes)' .local/projection-scope-evidence/sql-runtime.log
      - name: Prove PostgreSQL authoritative scope and planned recomposition
        run: |
          set -euo pipefail
          CONNECTION='Host=localhost;Port=5432;Database=JornadaProjectionScopeTest;Username=jornada;SSL Mode=Disable'
          JORNADA_PROJECTION_PROVIDER=PostgreSql JORNADA_PROJECTION_CONNECTION="$CONNECTION" \
            dotnet run --project .local/projection-scope/ProjectionScopeSmoke.csproj -c Release --no-build --no-restore 2>&1 | tee .local/projection-scope-evidence/pg-runtime.log
          grep -Fx 'IDENTITY PROJECTION SCOPE: OK (authoritative closure + immutable recomposition plan; no factual or Gold/Serving writes)' .local/projection-scope-evidence/pg-runtime.log
      - name: Record fail-closed evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.local/projection-scope-evidence')
          required=['commit.txt','test-build.log','unit-tests.log','build.log','sql-recomposition-second.log','pg-recomposition-second.log','sql-runtime.log','pg-runtime.log']
          missing=[name for name in required if not (root/name).exists() or (root/name).stat().st_size == 0]
          marker='IDENTITY PROJECTION SCOPE: OK (authoritative closure + immutable recomposition plan; no factual or Gold/Serving writes)'
          ok=(not missing and 'SQL_INSTALL_OK' in (root/'sql-recomposition-second.log').read_text(errors='replace')
              and 'PG_INSTALL_OK' in (root/'pg-recomposition-second.log').read_text(errors='replace')
              and all(marker in (root/name).read_text(errors='replace') for name in ['sql-runtime.log','pg-runtime.log']))
          (root/'summary.json').write_text(json.dumps({
              'schema':1,'status':'PASS' if ok else 'FAIL','missing':missing,
              'scope':'authoritative_factual_scope_and_immutable_recomposition_plan','sqlserver':ok,'postgresql':ok,
              'applied_required':True,'recomposition_state':'PLANEJADA','factual_writes':False,
              'gold_serving_publication':False,'probabilistic_activation':False
          },indent=2)+"\n")
          if not ok: raise SystemExit('projection scope/recomposition evidence incomplete')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: identity-projection-scope-${{ github.run_id }}
          path: Solution/.local/projection-scope-evidence
          if-no-files-found: error
          retention-days: 14
