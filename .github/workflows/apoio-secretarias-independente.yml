name: Apoio Secretarias Independente
on:
  workflow_dispatch:
  push:
    paths:
      - 'Produtos/ApoioSecretarias/**'
      - '.github/workflows/apoio-secretarias-independente.yml'
  pull_request:
    paths:
      - 'Produtos/ApoioSecretarias/**'
      - '.github/workflows/apoio-secretarias-independente.yml'
jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Produtos/ApoioSecretarias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s testes -v
  windows-executaveis:
    runs-on: windows-latest
    needs: testes
    defaults:
      run:
        working-directory: Produtos/ApoioSecretarias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s testes -v
      - run: pyinstaller --clean --onefile --windowed --name ApoioSecretarias executar_interface.py
      - run: pyinstaller --clean --onefile --console --name ApoioSecretariasCLI executar_cli.py
      - name: Instalar, executar CLI e remover em Windows limpo
        shell: pwsh
        run: |
          $destino = Join-Path $env:RUNNER_TEMP "ApoioSecretariasInstall"
          try {
            & .\install\Instalar-Apoio.ps1 -Dist .\dist -Destino $destino
            $cli = Join-Path $destino "ApoioSecretariasCLI.exe"
            $gui = Join-Path $destino "ApoioSecretarias.exe"
            if (-not (Test-Path -LiteralPath $cli) -or -not (Test-Path -LiteralPath $gui)) {
              throw "Instalador nao copiou os dois executaveis."
            }
            & $cli --help
            if ($LASTEXITCODE -ne 0) { throw "CLI instalada falhou." }
          } finally {
            & .\install\Remover-Apoio.ps1 -Destino $destino
          }
          if (Test-Path -LiteralPath (Join-Path $destino "ApoioSecretariasCLI.exe")) {
            throw "Desinstalacao deixou o binario CLI."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: apoio-secretarias-windows-x64
          path: |
            Produtos/ApoioSecretarias/dist/ApoioSecretarias.exe
            Produtos/ApoioSecretarias/dist/ApoioSecretariasCLI.exe
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apoio-secretarias:test ./Produtos/ApoioSecretarias
      - run: docker run --rm apoio-secretarias:test --help
      - name: E2E Docker com volumes e envio desligado
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/apoio-saida-docker"
          mkdir -p "$out"
          chmod 777 "$out"
          docker run --rm \
            -v "$PWD/Produtos/ApoioSecretarias/exemplos/entrada:/origem:ro" \
            -v "$PWD/Produtos/ApoioSecretarias/exemplos:/perfil:ro" \
            -v "$out:/saida" \
            apoio-secretarias:test \
            --entrada /origem --perfil /perfil/perfil.sintetico.json --saida /saida --nao-enviar
          test "$(find "$out" -maxdepth 1 -name 'ENTREGA_*.zip' | wc -l)" -eq 1
          test "$(find "$out/relatorios" -maxdepth 1 -name '*.json' | wc -l)" -ge 1
