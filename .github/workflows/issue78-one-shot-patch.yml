name: issue78-one-shot-patch

on:
  push:
    branches:
      - fix/status-deadlock-1205

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/status-deadlock-1205
          fetch-depth: 0
          persist-credentials: true

      - name: Apply issue 78 patch
        run: python3 Solution/scripts/issue78-patch.py

      - name: Commit patch and remove temporary helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue78-one-shot-patch.yml Solution/scripts/issue78-patch.py
          git add Solution/src/Jornada.Api/SqlApiServices.cs Solution/scripts/local-e2e.sh Solution/scripts/local-e2e.ps1 Solution/tests/Jornada.Integration.Tests/Integration/IngestionStatusConcurrencyTests.cs
          git diff --cached --check
          git commit -m 'fix(api): avoid status polling deadlock'
          git push origin HEAD:fix/status-deadlock-1205
