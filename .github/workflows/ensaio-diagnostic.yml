name: ensaio-diagnostic
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.424
      - name: Build diagnostic
        working-directory: Solution
        shell: bash
        run: |
          set +e
          dotnet restore Jornada.sln --locked-mode > ensaio-build.log 2>&1
          dotnet build src/Jornada.Ensaio/Jornada.Ensaio.csproj --configuration Release --no-restore >> ensaio-build.log 2>&1
          code=$?
          cat ensaio-build.log
          echo $code > ensaio-build.exit
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ensaio-build-diagnostic
          path: |
            Solution/ensaio-build.log
            Solution/ensaio-build.exit
