name: jornada-pr-required-fast
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read

# Serialize this validation per ref without blocking the separate manual 100k campaign.
concurrency:
  group: jornada-pr-required-fast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Essential V9 contract tests
        run: |
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_u_rare_mixture_plan.py'
          # Offline 100k adaptive-runner checks only: never run SQL or a calibration on PR.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_100k_execution_resource_budget.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_masked_sql_probe.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_sql_startup_modes.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_scale_100k_technical_plan.py'
          # Four nominal TF units, V3-only 324 options, fail-closed audit; offline only.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_v3_four_name_100k.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_v3_four_name_100k_handoff.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_100k_frozen_ibge_admission.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_three_job_timeouts.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_prepared_sealed_test.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_standalone_test.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_test_global_one_use.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_production_model_format.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_operational_converter.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_operational_cohort_parity.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_operational_candidate_parity.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_operational_batch_rehearsal.py'
          # Offline-only: E2E APT DNS fallback must not bypass private runtime gates.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_e2e_private_sql_api_dns_recovery.py'
          python3 Solution/scripts/test-e2e-private-sql-runtime-contract.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_offline_100k_presql_contract.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_100k_physical_memory_evidence.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_calibrator_safe_failure_stage.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_standard_100k_capacity.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_masked_sql_probe.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_physical_coverage_baseline.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_physical_impact_classifier.py'
          # Paired TF abstention audit is offline, TRAIN-only and fail-closed.
          python3 Solution/scripts/test-v9-tf-abstention-paired-audit.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_u_rare_mixture_physical_audit.py'
          python3 -m unittest discover -s Solution/tests/fixtures -p 'test_v9*.py'
  deterministic-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Compile production solution and verify internal calibration budget
        working-directory: Solution
        run: |
          dotnet build Jornada.sln -c Release
          # CPU/RAM/disk unit fixtures only; this does not start SQL or a 100k fit.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter '(FullyQualifiedName~V9CalibrationExecutionResourceBudgetTests|FullyQualifiedName~V9CalibrationRuntimeSchedulerTests|FullyQualifiedName~V9PhysicalFrameExecutionOrderTests|FullyQualifiedName~V9MarginFrameWorkPartitionTests|FullyQualifiedName~V9CalibradorSafeFailureCategoryTests|FullyQualifiedName~V9OfflineCalibratorCapacityTests)'
          # Deterministic ETA/timeout-risk boundaries; no SQL or 100k run.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9NestedCalibrationTests.Physical_progress_forecast_distinguishes_preliminary_safe_risk_and_timeout'
          # Small in-memory TF coverage regressions: catches typed exception drift
          # before squash, without SQL, physical 30k/100k or Windows builds.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9FsAdaptiveFirstNameTfTrainValidationTests'
          # Protect the exact jornada-ci regression from TEST cohort API changes.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9FellegiSunterAdaptiveCalibrationAdapterTests.Source_recall_uses_eligible_observations_and_oracle_gold_collapses_duplicate_identity'
          # C# execution proof that TEST/VALIDATION FS grouping stay isolated.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9BlindIncrementalIdentityGroupingTests'
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9FittedSnapshotTests'
      - name: Verify C# startup console and closed JSONL (no calibration)
        working-directory: Solution
        run: |
          set -euo pipefail
          mkdir -p .local/v9-startup-probe
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- --v9-startup-log-probe "$PWD/.local/v9-startup-probe" | tee .local/v9-startup-probe/console.log
          grep -F '[V9 START] C# calibrator started;' .local/v9-startup-probe/console.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.local/v9-startup-probe/startup-progress.jsonl')
          rows = p.read_text().splitlines()
          assert len(rows) == 1, rows
          row = json.loads(rows[0])
          assert row['schema'] == 'V9_CALIBRATION_STARTUP_V1'
          assert row['status'] == 'STARTED'
          with p.open('a') as f:
              f.write('')  # File is closed and can be reopened.
          print('V9_STARTUP_PROBE_VERIFIED: console and JSONL')
          PY
      - name: Upload startup probe logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-startup-probe
          path: |
            Solution/.local/v9-startup-probe/console.log
            Solution/.local/v9-startup-probe/startup-progress.jsonl
          if-no-files-found: warn
  security-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Repository safety and CI contract gates
        run: |
          python3 Solution/scripts/source-sanity-gate.py --self-test
          python3 Solution/scripts/v9-csharp-comment-escaped-newline-gate.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_ci_required_gates.py'
