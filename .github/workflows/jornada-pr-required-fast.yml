name: jornada-pr-required-fast
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Essential V9 contract tests
        run: |
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_u_rare_mixture_plan.py'
          # Offline 100k adaptive-runner checks only: never run SQL or a calibration on PR.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_100k_execution_resource_budget.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_scale_100k_technical_plan.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_standard_100k_capacity.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_masked_sql_probe.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_physical_coverage_baseline.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_physical_impact_classifier.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_u_rare_mixture_physical_audit.py'
          python3 -m unittest discover -s Solution/tests/fixtures -p 'test_v9*.py'
  deterministic-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Compile production solution and verify internal calibration budget
        working-directory: Solution
        run: |
          dotnet build Jornada.sln -c Release
          # CPU/RAM/disk unit fixtures only; this does not start SQL or a 100k fit.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9CalibrationExecutionResourceBudgetTests'
  security-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Repository safety and CI contract gates
        run: |
          python3 Solution/scripts/v9-csharp-comment-escaped-newline-gate.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_ci_required_gates.py'
