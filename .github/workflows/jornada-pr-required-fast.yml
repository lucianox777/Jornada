name: jornada-pr-required-fast
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
permissions:
  contents: read

# Serialize this validation per ref without blocking the separate manual 100k campaign.
concurrency:
  group: jornada-pr-required-fast-${{ github.ref }}
  cancel-in-progress: false
jobs:
  classify-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_unit_full: ${{ steps.classify.outputs.run_unit_full }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Enforce both historical TF LOCKED generator identities before classification
        run: python3 Solution/scripts/audit-v9-tf-locked-generator.py --repo . --require-pinned
      # Closed allowlist: README.md and Solution/docs/[A-Za-z0-9_-]+\.(md|txt)
      # (direct children only). Exclude lock, manifest, fixture, openapi, solutionschema.
      # Require regular 100644 Git mode at each existing endpoint.
      - id: classify
        run: python3 Solution/scripts/ci-impact-classifier.py --github-event --summary impact.json
      - name: Check classification contract
        run: python3 -m unittest Solution/tests/scripts/test_ci_impact_classifier.py Solution/tests/scripts/test_ci_docs_only_fast_gate.py Solution/tests/scripts/test_audit_master_required_checks.py
      - name: Observe master required-check protection (read-only, nonblocking)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          python3 Solution/scripts/audit-master-required-checks.py --repo "${{ github.repository }}" 2>&1 | tee master-protection-observation.txt
          result=${PIPESTATUS[0]}
          {
            echo '### Master required-check protection observation'
            echo 'Read-only diagnostic; API access failure or ruleset scope uncertainty is **not** proof of protection.'
            echo 'Exit code:' "$result"
            echo '```text'
            cat master-protection-observation.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
  premerge-integrity:
    needs: classify-impact
    if: needs.classify-impact.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Fail closed when directly invoked shell scripts lack Git executable mode
        run: |
          python3 scripts/ci-pr-direct-executable-gate.py --self-test
          python3 scripts/ci-pr-direct-executable-gate.py --repo ..
      - name: Validate NuGet lock graph and candidate SHA provenance before merge
        run: ./scripts/nuget-lock-bootstrap.sh
      - name: Enforce exact architecture dependency allowlist before merge
        run: |
          python3 scripts/architecture-dependency-gate.py --summary .local/pr-architecture-dependencies.json
          python3 scripts/architecture-dependency-gate.py --self-test

  unit-runtime:
    needs: classify-impact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - if: needs.classify-impact.outputs.docs_only != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: needs.classify-impact.outputs.docs_only != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: needs.classify-impact.outputs.docs_only != 'true'
        name: Full current offline impact suite before merge (no SQL or physical calibration)
        run: |
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_csharp_comment_escaped_newline_gate.py
          # Keep TEST fail-closed until full production RunAsync parity is certified.
          python3 -m unittest Solution/tests/scripts/test_v9_testonly_failclosed_contract.py
          python3 -m unittest Solution/tests/scripts/test_v9_runv9_dispatch_failclosed.py
          python3 -m unittest Solution/tests/scripts/test_v9_productive_dispatch_boundary_20261122.py
          python3 Solution/scripts/v9-csharp-comment-escaped-newline-gate.py
          python3 -m unittest Solution/tests/scripts/test_v9_synthetic_multiseed_gate.py
          python3 -m unittest Solution/tests/scripts/test_v9_tf_seed43_frozen_transfer_preflight.py Solution/tests/scripts/test_v9_tf_seed43_frozen_transfer_contract.py
          # Audit regression tests use a temporary Git repository; do not gate on the known master LOCKED drift here.
          python3 -m unittest Solution/tests/scripts/test_audit_v9_tf_locked_generator.py
          python3 -m unittest Solution/tests/scripts/test_v9_tf_ref_provenance_gate.py
          # Exact historical manifest shape is a narrow offline guard, not a physical SHA proof.
          python3 -m unittest Solution/tests/scripts/test_v9_seed42_historical_manifest_shape.py
          # Parse the read-only master protection auditor before running its unit suite.
          python3 -m py_compile Solution/scripts/audit-master-required-checks.py
          # Offline GitHub Actions status reporting must remain fail-closed.
          python3 -m unittest Solution/tests/scripts/test_github_actions_status_summary.py
          python3 -m unittest Solution/tests/scripts/test_v9_tf_seed43_frozen_transfer_physical.py Solution/tests/scripts/test_v9_tf_workflow_protocol.py Solution/tests/scripts/test_v9_orchestrator.py
          python3 -m unittest Solution/tests/scripts/test_ci_impact_classifier.py Solution/tests/scripts/test_dt12_branch_cleanup.py Solution/tests/scripts/test_dt12_merged_branch_cleanup.py Solution/tests/scripts/test_ci_required_gates.py Solution/tests/scripts/test_ci_watchdog.py Solution/tests/scripts/test_ci_run_profile.py Solution/tests/scripts/test_ci_built_binary_gate.py Solution/tests/scripts/test_ci_failure_checkpoint.py Solution/tests/scripts/test_nuget_product_inventory.py
          python3 Solution/scripts/test-ci-locked-nuget-cache-contract.py
      - if: needs.classify-impact.outputs.docs_only != 'true'
        name: Essential V9 contract tests
        run: |
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_independent_cohort_artifacts.py'
          # Campaign #38 preservation is read-only/offline in CI: secure redirects, ZIP provenance and destination guards.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_preserve_campaign38_artifacts.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_verify_campaign38_saved_artifacts.py'
          # Current beta corpus partition, TEST isolation and provenance contracts (offline).
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_standalone_test.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_prepared_sealed_test.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_u_rare_mixture_plan.py'
          # Offline 100k adaptive-runner checks only: never run SQL or a calibration on PR.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_100k_execution_resource_budget.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_masked_sql_probe.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_sql_startup_modes.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_scale_100k_technical_plan.py'
          # Four nominal TF units, V3-only 324 options, fail-closed audit; offline only.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_v3_four_name_100k.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_v3_four_name_100k_handoff.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_chain_integration.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_e2e_closeout.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_v3_four_name_100k_preaudit.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_100k_frozen_ibge_admission.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_three_job_timeouts.py'
          # Compare prior/current TRAIN console logs offline; no GitHub run, SQL or TEST.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_compare_train_job_logs.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_prepared_sealed_test.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_standalone_test.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_test_global_one_use.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_production_model_format.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_executor_boundary_contract.py'
          python3 -m unittest Solution/tests/scripts/test_v9_standard_test_preflight_contract.py Solution/tests/scripts/test_v9_standard_test_seed_binding.py Solution/tests/scripts/test_v9_unique_test_seed.py
          python3 -m unittest Solution/tests/scripts/test_v9_independent_test_report_only.py Solution/tests/scripts/test_v9_tf4_dispatch_test_modes.py
          # Resultado.Api OpenAPI: bidirectional route parity and negative fixtures (offline).
          python3 Solution/scripts/resultado-openapi-contract-gate.py
          python3 -m unittest Solution/tests/scripts/test_resultado_openapi_bidirectional.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_operational_converter.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_validated_operational_handoff.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_tf4_existing_database_option.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_operational_cohort_parity.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_operational_candidate_parity.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_test_operational_batch_rehearsal.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_production_runner_test_only_bridge.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_operational_edges_source_contract.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_synthetic_sql_batch_ledger.py'
          # Offline-only: E2E APT DNS fallback must not bypass private runtime gates.
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_e2e_private_sql_api_dns_recovery.py'
          python3 Solution/scripts/test-e2e-private-sql-runtime-contract.py
          python3 -m unittest Solution/tests/scripts/test_v9_http_volume_fixture_preflight.py
          python3 -m unittest Solution/tests/scripts/test_v9_http_volume_partition_boundaries.py
          python3 -m unittest Solution/tests/scripts/test_e2e_external_truth_boundary.py
          # Stage 8 E2E: verify CRC of every ZIP member, even when truth sizes differ.
          python3 -m unittest Solution/tests/scripts/test_e2e_external_truth_zip_crc.py
          python3 -m unittest Solution/tests/scripts/test_v9_productive_adapter_guard.py
          python3 -m unittest Solution/tests/scripts/test_e2e_independent_identity_oracle.py
          python3 -m unittest Solution/tests/scripts/test_e2e_independent_identity_oracle_alias.py
          python3 -m unittest Solution/tests/scripts/test_e2e_v9_grouping_oracle.py
          python3 -m unittest Solution/tests/scripts/test_e2e_v9_bridge_staging_reconcile.py
          python3 -m unittest Solution/tests/scripts/test_v9_e2e_ibge_http_lineage.py
          python3 -m unittest Solution/tests/scripts/test_v9_e2e_1k_winner_pin.py Solution/tests/scripts/test_v9_e2e_1k_identity_census.py Solution/tests/scripts/test_v9_e2e_1k_wave_preflight.py Solution/tests/scripts/test_v9_e2e_1k_catalog_seed.py
          python3 -m unittest Solution/tests/scripts/test_v9_e2e_run_http_receipt_compare.py
          python3 -m unittest Solution/tests/scripts/test_v9_e2e_dev_composite_reconcile.py
          python3 -m unittest Solution/tests/scripts/test_e2e_processor_runner_explicit_boundary.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_offline_100k_presql_contract.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_100k_physical_memory_evidence.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_calibrator_safe_failure_stage.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_standard_100k_capacity.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_masked_sql_probe.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_physical_coverage_baseline.py'
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_physical_impact_classifier.py'
          # Paired TF abstention audit is offline, TRAIN-only and fail-closed.
          python3 Solution/scripts/test-v9-tf-abstention-paired-audit.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_v9_u_rare_mixture_physical_audit.py'
          python3 -m unittest discover -s Solution/tests/fixtures -p 'test_v9*.py'
  deterministic-build:
    needs: classify-impact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - if: needs.classify-impact.outputs.docs_only != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - if: needs.classify-impact.outputs.docs_only != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - if: needs.classify-impact.outputs.docs_only != 'true'
        name: Compile production solution and verify internal calibration budget
        working-directory: Solution
        run: |
          dotnet build Jornada.sln -c Release
          # CPU/RAM/disk unit fixtures only; this does not start SQL or a 100k fit.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter '(FullyQualifiedName~V9CalibrationExecutionResourceBudgetTests|FullyQualifiedName~V9CalibrationRuntimeSchedulerTests|FullyQualifiedName~V9PhysicalFrameExecutionOrderTests|FullyQualifiedName~V9MarginFrameWorkPartitionTests|FullyQualifiedName~V9CalibradorSafeFailureCategoryTests|FullyQualifiedName~V9OfflineCalibratorCapacityTests)'
          # Deterministic informational ETA without local 340-minute deadline; no SQL/100k.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9NestedCalibrationTests.Physical_progress_forecast_is_informational_without_local_deadline'
          # Small in-memory TF coverage regressions: catches typed exception drift
          # before squash, without SQL, physical 30k/100k or Windows builds.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9FsAdaptiveFirstNameTfTrainValidationTests'
          # Protect the exact jornada-ci regression from TEST cohort API changes.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9FellegiSunterAdaptiveCalibrationAdapterTests.Source_recall_uses_eligible_observations_and_oracle_gold_collapses_duplicate_identity'
          # C# execution proof that TEST/VALIDATION FS grouping stay isolated.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9BlindIncrementalIdentityGroupingTests'
          # Independent scalar / decision / grouping TEST_ONLY oracle; no SQL (#1584 / P0-B step 2).
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9IndependentScalarReplayTests'
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9FittedSnapshotTests'
          # Reproduce the two post-#1924 master unit regressions before squash.
          # Pure in-memory/static C# tests; no SQL, TEST or calibration.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9ControlledDevGoldScorePreviewTests|FullyQualifiedName~V9ExistingIdentityPublicationBoundaryTests'
          # PO r1 indication classification: run its complete focused unit fixture.
          mkdir -p .local/test-evidence/v9-r1-indication
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
            --filter 'FullyQualifiedName~V9ControlledDevGroupGoldR1Tests' \
            --logger "trx;LogFileName=$PWD/.local/test-evidence/v9-r1-indication/unit.trx"
          python3 scripts/test-evidence-gate.py .local/test-evidence/v9-r1-indication/unit.trx \
            --forbid-skipped --minimum-tests 18 --summary .local/test-evidence/v9-r1-indication/summary.json
      - if: needs.classify-impact.outputs.docs_only != 'true'
        name: Verify DEV 1k CPF multiversion synthetic fixture (no SQL or model fit)
        working-directory: Solution
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          fixture_root="$(mktemp -d)"
          trap 'rm -rf -- "$fixture_root"' EXIT
          bash scripts/v9-e2e-1k-prepare-waves.sh "$fixture_root/fixture"
          python3 - "$fixture_root/fixture/wave-preflight-receipt.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              r = json.load(stream)
          for k in ("baseIdentities", "sourceVersions", "persistentOrigins",
                    "cpfMultiversionOrigins", "nonCpfOriginsWithOtherCpfOrigin",
                    "cpfVersions", "nonCpfVersions", "waveCount"):
              print(f"{k}={r[k]}")
          PY
      - if: needs.classify-impact.outputs.docs_only != 'true' && needs.classify-impact.outputs.run_unit_full != 'false'
        name: Full C# unit suite before merge (canonical master filter, no SQL)
        working-directory: Solution
        shell: bash
        run: |
          set -euo pipefail
          evidence="$PWD/.local/test-evidence/pr-full-unit"
          mkdir -p "$evidence"
          started=$(date +%s)
          # Reuse the Release build above. Identical selection to jornada-ci unit-runtime.
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-build \
            --filter "TestCategory!=Integration&TestCategory!=SQLSmoke" \
            --results-directory "$evidence" --logger "trx;LogFileName=$evidence/unit.trx"
          python3 scripts/test-evidence-gate.py "$evidence/unit.trx" \
            --forbid-skipped --minimum-tests 1 --summary "$evidence/summary.json"
          elapsed=$(( $(date +%s) - started ))
          printf 'PR_FULL_UNIT_ELAPSED_SECONDS=%s\n' "$elapsed" | tee "$evidence/elapsed.txt"
          printf '### Full PR unit suite\nElapsed test + TRX gate: %s s (Release build reused).\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full PR unit evidence
        if: always() && needs.classify-impact.outputs.docs_only != 'true' && needs.classify-impact.outputs.run_unit_full != 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-full-unit-evidence
          path: Solution/.local/test-evidence/pr-full-unit
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - if: needs.classify-impact.outputs.docs_only != 'true'
        name: Verify C# startup console and closed JSONL (no calibration)
        working-directory: Solution
        run: |
          set -euo pipefail
          mkdir -p .local/v9-startup-probe
          dotnet run --no-build -c Release --project src/Jornada.Linkage.Parameters.Worker -- --v9-startup-log-probe "$PWD/.local/v9-startup-probe" | tee .local/v9-startup-probe/console.log
          grep -F '[V9 START] C# calibrator started;' .local/v9-startup-probe/console.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.local/v9-startup-probe/startup-progress.jsonl')
          rows = p.read_text().splitlines()
          assert len(rows) == 1, rows
          row = json.loads(rows[0])
          assert row['schema'] == 'V9_CALIBRATION_STARTUP_V1'
          assert row['status'] == 'STARTED'
          with p.open('a') as f:
              f.write('')  # File is closed and can be reopened.
          print('V9_STARTUP_PROBE_VERIFIED: console and JSONL')
          PY
      - name: Upload startup probe logs
        if: always() && needs.classify-impact.outputs.docs_only != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-startup-probe
          path: |
            Solution/.local/v9-startup-probe/console.log
            Solution/.local/v9-startup-probe/startup-progress.jsonl
          if-no-files-found: warn
  security-guards:
    needs: classify-impact
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fail closed when impact classification fails
        if: needs.classify-impact.result != 'success'
        run: exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Repository safety and CI contract gates
        run: |
          python3 Solution/scripts/source-sanity-gate.py --self-test
          python3 Solution/scripts/v9-csharp-comment-escaped-newline-gate.py
          python3 -m unittest discover -s Solution/tests/scripts -p 'test_ci_required_gates.py'
