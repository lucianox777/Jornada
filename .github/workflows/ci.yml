            Solution/.local/v9-sql-physical-three-seed-summary.json
            Solution/.local/e2-demographic-primary/observacoes.csv
            Solution/.local/e2-demographic-primary/generation-manifest.json
            Solution/.local/v9-sql-two-prefix3-summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Run linkage model-validation smoke
        run: |
          dotnet run --project src/Jornada.Linkage.Runner --configuration Release --no-build -- \
            --mode MODEL_VALIDATION --model-version "$MODEL_VERSION" --since 2026-08-31T01:00:00Z --max-records 1000 \
            --batch-size 500 --max-parallelism 2 --publish false \
            --requested-by CI_HARNESS --reason ci-harness-evidence
      - name: Reconcile no-candidate counter on generic synthetic smoke
        run: |
          CID=$(docker ps -q --filter publish=1433 | head -1)
          RUN_ID=$(SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -i -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP(1) CONVERT(varchar(36),linkage_run_id) FROM identidade.linkage_run WHERE solicitado_por=N'CI_HARNESS' ORDER BY iniciado_em DESC;" | tr -d '\r' | xargs)
          test -n "$RUN_ID"
          AUDIT=$(SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -i -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; WITH rr AS (SELECT r.motivo FROM identidade.linkage_resultado r JOIN silver.pessoa_observacao po ON po.pessoa_observacao_id=r.pessoa_observacao_id WHERE r.linkage_run_id='$RUN_ID' AND po.codigo_pessoa_origem LIKE N'SCALE-PEND-%'), nc AS (SELECT * FROM rr WHERE motivo LIKE N'SEM_CANDIDATO_%') SELECT CONCAT((SELECT sem_candidato_no_bloco FROM identidade.linkage_run WHERE linkage_run_id='$RUN_ID'),'|',(SELECT COUNT_BIG(*) FROM nc),'|',(SELECT COUNT_BIG(*) FROM rr));" | tr -d '\r' | xargs)
          IFS='|' read -r REPORTED_NO_CANDIDATE ACTUAL_NO_CANDIDATE TOTAL_SYNTHETIC_RESULTS <<< "$AUDIT"
          echo "NO-CANDIDATE AUDIT: reported=$REPORTED_NO_CANDIDATE actual=$ACTUAL_NO_CANDIDATE total=$TOTAL_SYNTHETIC_RESULTS"
          test "$REPORTED_NO_CANDIDATE" = "$ACTUAL_NO_CANDIDATE"
          test "$TOTAL_SYNTHETIC_RESULTS" = '1000'
          # O piso de recall do blocking é responsabilidade do ruleset calibrado e da
          # validação independente adversarial. SCALE-PEND é apenas smoke operacional
          # genérico; não é conjunto rotulado independente e não deve duplicar esse gate.
      - name: Run read-only linkage evaluation smoke
        env:
          JORNADA_EVALUATION_SQL_PASSWORD: 'Jornada_${{ github.run_id }}!HarnessSql'
          JORNADA_EVALUATION_DATABASE: 'JornadaHarness'
          JORNADA_EVALUATION_SCALE_PEOPLE: '5000'
          JORNADA_EVALUATION_SCALE_SEED: '355'
          JORNADA_EVALUATION_LABEL_COUNT: '100'
        run: ./scripts/linkage-evaluation-smoke.sh
      - name: Upload linkage evaluation smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linkage-evaluation-smoke
          path: Solution/.local/linkage-evaluation-smoke
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

  ddl-upgrade:
    needs: impact
    if: needs.impact.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Validate DDL upgrade and idempotency
        run: ./scripts/local-ddl-upgrade.sh
      - name: Execute DT-06 historical upgrade and rollback acceptance
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          mkdir -p .local/dt06-bin
          cat > .local/dt06-bin/sqlcmd <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)"
          translated=()
          for arg in "$@"; do
            case "$arg" in
              "$ROOT"/*) translated+=("/workspace/${arg#"$ROOT"/}") ;;
              *) translated+=("$arg") ;;
            esac
          done
          docker compose --env-file "$ROOT/.env" exec -T -w /workspace -e SQLCMDPASSWORD \
            sqlserver /opt/mssql-tools18/bin/sqlcmd "${translated[@]}"
          SH
          chmod +x .local/dt06-bin/sqlcmd
          JORNADA_DT06_EVIDENCE=1 \
          JORNADA_DT06_CONFIRM_CREATE=YES \
          JORNADA_DT06_TEST_DATABASE="JornadaDT06_CI_${GITHUB_RUN_ID}" \
          JORNADA_SQL_SERVER=localhost \
          JORNADA_SQL_USER=sa \
          JORNADA_SQL_PASSWORD="$JORNADA_SQL_SA_PASSWORD" \
          SQLCMD_BIN="$PWD/.local/dt06-bin/sqlcmd" \
            bash scripts/dt06-upgrade-acceptance.sh
      - name: Upload DDL upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ddl-upgrade-evidence
          path: |
            Solution/.local/ddl-upgrade
            Solution/.local/dt06-acceptance
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
      - name: Stop local SQL Server
        if: always()
        run: docker compose --env-file .env down -v || true

