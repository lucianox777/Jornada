name: jornada-ci

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      scale_profile:
        description: 'Perfil do harness de escala para execução manual'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - medium
          - million
      rc_evidence_preflight:
        description: 'Exercitar ponta a ponta a evidência de RC sem criar tag/release remota'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jornada-ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve in-flight SQL/E2E evidence; superseded runs must finish normally.
  cancel-in-progress: false

env:
  DOTNET_SDK_VERSION: '10.0.113'

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      run_dt10: ${{ steps.classify.outputs.run_dt10 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi
          python3 Solution/scripts/ci-impact-classifier.py --files-from changed-files.txt --summary impact.json | tee impact.env
          grep -E '^(run_full|run_dt10)=' impact.env >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest Solution/tests/scripts/test_v9_synthetic_multiseed_gate.py
      - run: python3 -m unittest Solution/tests/scripts/test_ci_impact_classifier.py Solution/tests/scripts/test_dt12_branch_cleanup.py Solution/tests/scripts/test_dt12_merged_branch_cleanup.py Solution/tests/scripts/test_ci_required_gates.py Solution/tests/scripts/test_ci_watchdog.py Solution/tests/scripts/test_ci_run_profile.py Solution/tests/scripts/test_ci_built_binary_gate.py Solution/tests/scripts/test_ci_failure_checkpoint.py Solution/tests/scripts/test_nuget_product_inventory.py
      - name: Verify lock-hashed NuGet cache cannot bypass required gates
        run: python3 Solution/scripts/test-ci-locked-nuget-cache-contract.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-impact
          path: impact.json
          retention-days: 30

  dependency-lock:
    needs: impact
    if: needs.impact.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Generate and validate NuGet lock files on branches and PRs
        if: github.ref_type != 'tag'
        run: ./scripts/nuget-lock-bootstrap.sh
      - name: Require committed NuGet lock files on release tags
        if: github.ref_type == 'tag'
        run: |
          mkdir -p .local/nuget-lock
          python3 scripts/nuget-lock-gate.py --root . --summary .local/nuget-lock/summary.json
          python3 scripts/nuget-lock-provenance-gate.py --root . --summary .local/nuget-lock/provenance-summary.json
          dotnet restore Jornada.sln --locked-mode
          find . -name packages.lock.json -not -path './.local/*' -print0 | sort -z | tar --null -T - -czf .local/nuget-lock/packages-locks.tar.gz
      - name: Upload NuGet lock evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-lockfiles
          path: |
            Solution/.local/nuget-lock/packages-locks.tar.gz
            Solution/.local/nuget-lock/summary.json
            Solution/.local/nuget-lock/provenance-summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  unit-contracts:
    needs: [impact, dependency-lock]
    if: needs.impact.outputs.run_full == 'true' && needs.dependency-lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore checked dependency graph from CI lock evidence
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          python3 scripts/nuget-lock-gate.py --root . --summary .local/nuget-lock-input/revalidated-summary.json
          dotnet restore Jornada.sln --locked-mode
      - name: Validate local Docker Compose contract
        env:
          JORNADA_SQL_SA_PASSWORD: 'Jornada_Compose_Validation_2026!Sql'
        run: docker compose -f docker-compose.yml config >/dev/null
      - name: Reject missing SQL password before creating local containers
        run: |
          set -euo pipefail
          empty_env="$(mktemp)"
          trap 'rm -f "$empty_env"' EXIT
          if env -u JORNADA_SQL_SA_PASSWORD docker compose --env-file "$empty_env" -f docker-compose.yml config > /dev/null 2>&1; then
            echo "Compose accepted an empty environment without SQL password." >&2
            exit 1
          fi
      - run: git -C .. diff --check
      - name: Gate OpenAPI x Minimal API
        run: python3 scripts/openapi-contract-gate.py
      - name: Gate technical closure invariants
        run: python3 scripts/technical-closure-gate.py
      - name: Gate analyzer warning baseline
        run: python3 scripts/analyzer-cleanliness-gate.py
      - name: Gate Power BI source structure
        run: python3 scripts/powerbi-static-gate.py
      - name: Gate HML contracts without fabricating approvals
        run: python3 scripts/hml-config-gate.py --root . --summary .local/hml-config-summary.json
      - name: Preflight CI toolchain and environment contract
        run: |
          python3 scripts/environment-preflight-gate.py --root . --profile ci-linux --strict --summary .local/environment-preflight.json
          python3 scripts/environment-preflight-gate.py --root . --profile ci-linux --self-test
      - name: Gate governance readiness contracts without fabricating approvals
        run: |
          python3 scripts/governance-readiness-gate.py --root . --summary .local/governance-summary.json
          python3 scripts/governance-readiness-gate.py --root . --self-test
      - name: Gate scheduler contract without inventing corporate cadence
        run: |
          python3 scripts/scheduler-contract-gate.py --root . --summary .local/scheduler-summary.json
          python3 scripts/scheduler-contract-gate.py --root . --self-test
      - name: C3.1 independent worker entrypoint contract (DEV disposable, no processes)
        run: python3 scripts/test-worker-independent-entrypoint.py
      - name: C3.2a isolated worker Compose topology (config-only, no containers)
        run: python3 scripts/test-worker-disposable-compose.py
      - name: C3.2c create-only E2E SQL bootstrap contract (no DB/containers)
        run: python3 scripts/test-e2e-sql-bootstrap-contract.py
      - name: C3.2d private SQL runtime guard self-test (no Docker or DB)
        run: python3 scripts/test-e2e-private-sql-runtime-contract.py
      - name: C3.2f1 independent worker SIGKILL safety contract (no Docker or SQL)
        run: python3 scripts/test-e2e-private-worker-restart-contract.py
      - name: C3.2f2 offline lot recovery evidence contract (no Docker or SQL)
        run: python3 scripts/test-e2e-lot-recovery-evidence-gate.py
      - name: C3.2f2b private API/SQL ZIP baseline safety contract (no Docker or SQL)
        run: python3 scripts/test-e2e-private-api-ingestion-baseline-contract.py
      - name: C3.2f2c private crash/transaction recovery safety contract (no Docker or SQL)
        run: |
          python3 scripts/test-e2e-private-recovery-transaction-hold-contract.py
          python3 scripts/test-e2e-private-recovery-runtime-contract.py
      - name: C3.3a Console isolated worker effective status (read-only static safety gate)
        run: python3 scripts/test-console-worker-supervisor-status-contract.py
      - name: C3.3b1 Console global worker lifecycle guards (no Docker or SQL)
        run: python3 scripts/test-console-supervisor-global-mode-contract.py
      - name: C3.3b2 isolated Processor/Operations/Bronze finite RunOnce contracts (no Docker/SQL)
        run: |
          python3 scripts/test-private-worker-runonce-entrypoint-contract.py
          python3 scripts/test-console-three-runonce-contract.py
      - name: C3.3b3a oneoff survives browser disconnect (offline contract)
        run: python3 scripts/test-console-runonce-disconnect-contract.py
      - name: C3.3d private worker audit journal (offline contract)
        run: python3 scripts/test-console-private-worker-audit-contract.py
      - name: C3.3b3b0 bounded exact oneoff cancellation primitive (offline/negative)
        run: python3 scripts/test-console-private-worker-cancel-oneoff-contract.py
      - name: C3.2b isolated Api and ResultadoApi entrypoints (check-only)
        run: python3 scripts/test-api-independent-entrypoint.py
      - name: Self-test HML SQL/API evidence gates
        run: |
          python3 scripts/sql-performance-evidence-gate.py --self-test
          python3 scripts/api-projection-evidence-gate.py --self-test
      - name: Gate authorization matrix and negative mutations
        run: |
          python3 scripts/authorization-matrix-gate.py
          python3 scripts/authorization-matrix-gate.py --self-test
      - name: Gate security/data-minimization surface
        run: python3 scripts/security-surface-gate.py
      - name: Gate explicit version compatibility matrix
        run: python3 scripts/compatibility-matrix-gate.py
      - name: Gate backward compatibility against predecessor contracts
        run: |
          python3 scripts/contract-backward-compatibility-gate.py --repo .. --summary .local/contract-backward-compatibility.json
          python3 scripts/contract-backward-compatibility-gate.py --self-test
      - name: Meta-validate every JSON Schema contract
        run: |
          python3 scripts/json-schema-meta-gate.py --summary .local/json-schema-meta.json
          python3 scripts/json-schema-meta-gate.py --self-test
      - name: Gate project dependency architecture
        run: |
          python3 scripts/architecture-dependency-gate.py --summary .local/architecture-dependencies.json
          python3 scripts/architecture-dependency-gate.py --self-test
      - name: Gate destructive DDL changes
        run: |
          python3 scripts/ddl-destructive-change-gate.py --repo .. --summary .local/ddl-destructive-change.json
          python3 scripts/ddl-destructive-change-gate.py --self-test
      - name: Gate dependency drift
        run: python3 scripts/dependency-drift-gate.py --repo .. --summary .local/dependency-drift.json
      - name: Gate source sanity and pinned workflow actions
        run: |
          python3 scripts/source-sanity-gate.py
          python3 scripts/sql-argv-safety-gate.py
          python3 scripts/workflow-action-pin-gate.py
      - name: Gate observability/SLO contract
        run: python3 scripts/observability-contract-gate.py
      - name: Gate calibration freshness contract without fabricating approvals
        run: python3 scripts/hml-staleness-gate.py
      - name: Gate versioned Possibility rules without inventing institutional criteria
        run: |
          python3 scripts/possibility-rules-gate.py config/possibilities/rule-catalog.json --root . --summary .local/possibility-rules-summary.json
          python3 scripts/possibility-rules-gate.py --self-test
      - name: Self-test aggregate release and technical RC evidence gates
        run: |
          python3 scripts/release-evidence-gate.py --self-test
          python3 -m py_compile scripts/technical-rc-gate.py scripts/rc-evidence-gate.py
          python3 scripts/rc-evidence-gate.py --self-test
      - name: Self-test IBGE nominal u multi-seed diagnostic
        run: pwsh -NoLogo -NoProfile -File scripts/local-ibge-u-multiseed.ps1 -SelfTest

  unit-runtime:
    needs: [impact, dependency-lock]
    if: needs.impact.outputs.run_full == 'true' && needs.dependency-lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore checked dependency graph from CI lock evidence
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          python3 scripts/nuget-lock-gate.py --root . --summary .local/nuget-lock-input/revalidated-summary.json
          dotnet restore Jornada.sln --locked-mode
      - run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: T0.1a DevConsole HTTP behavioral acceptance (isolated, no SQL)
        env:
          JORNADA_CONSOLE_ACCEPTANCE_ISOLATED: 'true'
        run: python3 scripts/test-devconsole-http-acceptance.py
      - name: Install pinned Chromium only for browser acceptance (reuse current build)
        run: |
          python3 -m venv .local/console-browser-venv
          .local/console-browser-venv/bin/python -m pip install --disable-pip-version-check playwright==1.56.0
          .local/console-browser-venv/bin/python -m playwright install --with-deps chromium
      - name: T0.1e Console actual Chromium browser click acceptance (no SQL)
        env:
          JORNADA_CONSOLE_BROWSER_ISOLATED: 'true'
        run: .local/console-browser-venv/bin/python scripts/test-devconsole-browser-ui.py
      - name: Prove Python-to-CSharp synthetic corpus rule equivalence
        run: |
          mkdir -p .local/test-evidence/unit
          python3 scripts/synthetic-corpus-equivalence-gate.py \
            --root . \
            --summary .local/test-evidence/unit/synthetic-corpus-equivalence.json
      - name: Unit tests must execute without skips
        run: |
          mkdir -p .local/test-evidence/unit
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-build \
            --filter "TestCategory!=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory "$PWD/.local/test-evidence/unit/results" \
            --logger "trx;LogFileName=$PWD/.local/test-evidence/unit/unit.trx"
          python3 scripts/test-evidence-gate.py .local/test-evidence/unit/unit.trx \
            --forbid-skipped --minimum-tests 1 --summary .local/test-evidence/unit/summary.json
          COVERAGE=$(find .local/test-evidence/unit/results -name coverage.cobertura.xml -type f -print -quit)
          test -n "$COVERAGE"
          python3 scripts/coverage-evidence-gate.py "$COVERAGE" \
            --baseline config/release/coverage-baseline.json \
            --summary .local/test-evidence/unit/coverage-summary.json
      - name: Accept measured DT-05 synthetic snapshot cost and latency (no NAS/SQL)
        run: |
          python3 scripts/dt05-synthetic-cost-evidence-gate.py --self-test
          python3 scripts/dt05-synthetic-cost-evidence-gate.py .local/test-evidence/unit/dt05-synthetic-cost.json
      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-evidence
          path: Solution/.local/test-evidence/unit
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: OpenAPI runtime conformance must execute for all 19 operations
        run: |
          mkdir -p .local/test-evidence/openapi-runtime
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-build \
            --filter "TestCategory=OpenApiRuntime" \
            --logger "trx;LogFileName=$PWD/.local/test-evidence/openapi-runtime/openapi-runtime.trx"
          python3 scripts/test-evidence-gate.py .local/test-evidence/openapi-runtime/openapi-runtime.trx \
            --forbid-skipped --minimum-tests 19 --summary .local/test-evidence/openapi-runtime/summary.json
      - name: Upload OpenAPI runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-runtime-evidence
          path: Solution/.local/test-evidence/openapi-runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Audit transitive NuGet vulnerabilities
        run: |
          mkdir -p .local/security
          dotnet list Jornada.sln package --vulnerable --include-transitive --format json > .local/security/nuget-vulnerabilities.json
          python3 scripts/vulnerability-evidence-gate.py .local/security/nuget-vulnerabilities.json --summary .local/security/vulnerability-summary.json
          python3 scripts/vulnerability-evidence-gate.py --self-test
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p .local/sbom
          dotnet list Jornada.sln package --include-transitive --format json > .local/sbom/dotnet-packages.json
          python3 scripts/generate-sbom.py --input .local/sbom/dotnet-packages.json --output .local/sbom/sbom.cdx.json
          python3 -m json.tool .local/sbom/sbom.cdx.json >/dev/null
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: Solution/.local/sbom/sbom.cdx.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  unit:
    # Required stable check: preserve BOTH independent contractual checks and
    # compiled runtime coverage; never allow a failed/skipped child to pass.
    needs: [impact, unit-contracts, unit-runtime]
    if: always() && needs.impact.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify contractual and runtime tests both passed
        env:
          CONTRACT_RESULT: ${{ needs.unit-contracts.result }}
          RUNTIME_RESULT: ${{ needs.unit-runtime.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CONTRACT_RESULT" == success && "$RUNTIME_RESULT" == success ]] || {
            echo "UNIT: FAIL contracts=$CONTRACT_RESULT runtime=$RUNTIME_RESULT" >&2
            exit 1
          }
      - name: Download same-run unit/coverage evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: unit-test-evidence
          path: unit-evidence
      - name: Download same-run OpenAPI evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: openapi-runtime-evidence
          path: openapi-evidence
      - name: Download same-run SBOM
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: sbom-cyclonedx
          path: sbom-evidence
      - name: Fail closed if runtime evidence is absent
        shell: bash
        run: |
          set -euo pipefail
          test -s unit-evidence/unit.trx
          test -s unit-evidence/summary.json
          test -n "$(find unit-evidence -name coverage.cobertura.xml -type f -print -quit)"
          test -s openapi-evidence/openapi-runtime.trx
          test -s openapi-evidence/summary.json
          test -s sbom-evidence/sbom.cdx.json

  deterministic-build:
    needs: [impact, dependency-lock]
    if: needs.impact.outputs.run_full == 'true' && needs.dependency-lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked dependency graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
      - name: Prove deterministic double build
        run: ./scripts/deterministic-build-gate.sh . .local/deterministic-build
      - name: Upload deterministic build evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deterministic-build-evidence
          path: Solution/.local/deterministic-build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

      - name: Package SHA-provenanced Release files for same-run SQL reuse
        run: python3 scripts/ci-built-binary-gate.py produce
      - name: Upload exact-run Release binary evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-deterministic-release-binaries
          path: |
            Solution/.local/compiled-release/manifest.json
            Solution/.local/compiled-release/release-binaries.tar.gz
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  security-guards:
    needs: [impact, dependency-lock]
    if: needs.impact.outputs.run_full == 'true' && needs.dependency-lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked dependency graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
          dotnet restore tests/Jornada.Integration.Tests/Jornada.Integration.Tests.csproj --locked-mode
      - name: Test Bash SQL entrypoints keep local passwords out of argv
        run: bash scripts/test-local-sql-entrypoint-secret-transport.sh
      - name: Test SQL upgrade and synthetic preflight credential transport in Bash
        run: bash scripts/test-local-ddl-synthetic-secret-transport.sh
      - name: Gate source sanity and workflow action pins
        run: |
          mkdir -p .local/security
          python3 scripts/source-sanity-gate.py | tee .local/security/source-sanity.txt
          python3 scripts/workflow-action-pin-gate.py | tee .local/security/action-pins.txt
      - name: Test secure local SQL credential bootstrap
        run: python3 scripts/test_local_env_bootstrap.py -v
      - name: Test SQL credentials stay out of process argv in coordination probe
        run: python3 scripts/test_coordination_lock_secret_transport.py -v
      - name: Test Bash local-db SQL credentials without a Docker service
        run: bash scripts/test-local-db-secret-transport.sh
      - name: Verify Bash scale SQL secret transport without a database reset
        run: bash scripts/test-local-scale-sqlcmd-secret-transport.sh
      - name: Verify Bash backup SQL credential transport without restoring volumes
        run: bash scripts/test-local-backup-sqlcmd-secret-transport.sh
      - name: Mock linkage validation flow and read-only evaluation SQL secret transport
        run: bash scripts/test-linkage-flow-evaluation-secret-transport.sh
      - name: Mock independent linkage validation SQL secret transport
        run: bash scripts/test-linkage-validation-secret-transport.sh
      - name: Mock E2E SQL password transport without resetting DEV database
        run: bash scripts/test-local-e2e-secret-transport.sh
      - name: Verify SQL credentials never enter CI Docker argv
        run: python3 scripts/test-ci-sqlcmd-secret-transport.py
      - name: Verify RC SQL commands use temporary environment credentials
        run: python3 scripts/test-rc-sqlcmd-secret-transport.py
      - name: Test Gitleaks audit report completeness and redaction
        run: python3 scripts/gitleaks-history-audit-summary.py --self-test
      - name: Test Gitleaks scanner failure paths
        run: bash scripts/test-security-secret-scan.sh
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          mkdir -p .local/tools/gitleaks .local/security
          archive=".local/tools/gitleaks/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --
          tar -xzf "$archive" -C .local/tools/gitleaks gitleaks
          chmod 0755 .local/tools/gitleaks/gitleaks
          echo "$PWD/.local/tools/gitleaks" >> "$GITHUB_PATH"
          .local/tools/gitleaks/gitleaks version | tee .local/security/gitleaks-version.txt
      - name: Scan current tree with Gitleaks
        run: |
          set -uo pipefail
          set +e
          ./scripts/security-secret-scan.sh --current-tree-only 2>&1 | tee .local/security/gitleaks-current-tree.txt
          scan_rc=${PIPESTATUS[0]}
          set -e
          if [[ -f .local/gitleaks/current-tree.json ]]; then
            cp .local/gitleaks/current-tree.json .local/security/gitleaks-current-tree.json
          else
            printf '[]\n' > .local/security/gitleaks-current-tree.json
          fi
          exit "$scan_rc"
      - name: Audit NuGet vulnerabilities as structured evidence
        run: |
          dotnet list Jornada.sln package --vulnerable --include-transitive --format json > .local/security/nuget-vulnerabilities.json
          python3 scripts/vulnerability-evidence-gate.py .local/security/nuget-vulnerabilities.json --summary .local/security/vulnerability-summary.json
      - name: Upload security-guards evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-guards-evidence
          path: Solution/.local/security
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  security-codeql:
    needs: [impact, dependency-lock]
    if: needs.impact.outputs.run_full == 'true' && needs.dependency-lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked dependency graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
          dotnet restore tests/Jornada.Integration.Tests/Jornada.Integration.Tests.csproj --locked-mode
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build for CodeQL
        run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:csharp
          output: Solution/.local/security/codeql
          upload: never
      - name: Fail closed on blocking SARIF findings
        run: |
          python3 scripts/sarif-security-gate.py .local/security/codeql --summary .local/security/sarif-summary.json
          python3 scripts/sarif-security-gate.py --self-test
      - name: Upload security-codeql evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-codeql-evidence
          path: Solution/.local/security
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  security-analysis:
    # Preserve the required job name while keeping security guards and
    # CodeQL independent checkpoints within this SAME run and exact HEAD.
    needs: [impact, security-guards, security-codeql]
    if: always() && needs.impact.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Fail closed unless static security and CodeQL both succeeded
        env:
          GUARD_RESULT: ${{ needs.security-guards.result }}
          CODEQL_RESULT: ${{ needs.security-codeql.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GUARD_RESULT" == success && "$CODEQL_RESULT" == success ]] || {
            echo "SECURITY: FAIL guards=$GUARD_RESULT codeql=$CODEQL_RESULT" >&2
            exit 1
          }
      - name: Fetch same-run guards evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: security-guards-evidence
          path: security-evidence/guards
      - name: Fetch same-run CodeQL SARIF evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: security-codeql-evidence
          path: security-evidence/codeql
      - name: Verify and assemble complete security evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s security-evidence/guards/gitleaks-current-tree.json
          test -s security-evidence/guards/vulnerability-summary.json
          test -s security-evidence/guards/action-pins.txt
          test -s security-evidence/codeql/sarif-summary.json
          SARIF=$(find security-evidence/codeql/codeql -name '*.sarif' -type f -print -quit)
          test -n "$SARIF"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('security-evidence')
          for file in (root/'guards/gitleaks-current-tree.json',
                       root/'guards/vulnerability-summary.json',
                       root/'codeql/sarif-summary.json'):
              json.loads(file.read_text(encoding='utf-8'))
          paths=list((root/'codeql/codeql').rglob('*.sarif'))
          assert paths, 'No CodeQL SARIF output'
          for file in paths:
              result=json.loads(file.read_text(encoding='utf-8'))
              assert isinstance(result.get('runs'),list) and result['runs'], file
          print('SECURITY: two independent jobs and SARIF evidence verified')
          PY
          mkdir -p Solution/.local/security
          cp -a security-evidence/guards/. Solution/.local/security/
          cp -a security-evidence/codeql/. Solution/.local/security/
      - name: Upload combined security-analysis evidence (stable original artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-analysis-evidence
          path: Solution/.local/security
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

