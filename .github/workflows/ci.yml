      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: local-e2e-evidence
          path: e2e-console-evidence
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: e2e-private-sql-evidence
          path: e2e-private-evidence
      - name: Require evidence from both suites
        run: |
          test -n "$(find e2e-console-evidence -type f -print -quit)"
          test -s e2e-private-evidence/c3-2d-sql-bootstrap/summary.json
          grep -q '"status": "PASS"' e2e-private-evidence/c3-2d-sql-bootstrap/summary.json

