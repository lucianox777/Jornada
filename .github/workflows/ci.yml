name: jornada-ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scale_profile:
        description: 'Perfil do harness de escala para execução manual'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - medium
          - million
      rc_evidence_preflight:
        description: 'Exercitar ponta a ponta a evidência de RC sem criar tag/release remota'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jornada-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SDK_VERSION: '8.0.424'

jobs:
  dependency-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - name: Generate and validate NuGet lock files on branches and PRs
        if: github.ref_type != 'tag'
        run: ./scripts/nuget-lock-bootstrap.sh
      - name: Require committed NuGet lock files on release tags
        if: github.ref_type == 'tag'
        run: |
          mkdir -p .local/nuget-lock
          python3 scripts/nuget-lock-gate.py --root . --summary .local/nuget-lock/summary.json
          python3 scripts/nuget-lock-provenance-gate.py --root . --summary .local/nuget-lock/provenance-summary.json
          dotnet restore Jornada.sln --locked-mode
          find . -name packages.lock.json -not -path './.local/*' -print0 | sort -z | tar --null -T - -czf .local/nuget-lock/packages-locks.tar.gz
      - name: Upload NuGet lock evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-lockfiles
          path: |
            Solution/.local/nuget-lock/packages-locks.tar.gz
            Solution/.local/nuget-lock/summary.json
            Solution/.local/nuget-lock/provenance-summary.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  unit:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore checked dependency graph from CI lock evidence
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          python3 scripts/nuget-lock-gate.py --root . --summary .local/nuget-lock-input/revalidated-summary.json
          dotnet restore Jornada.sln --locked-mode
      - name: Validate local Docker Compose contract
        env:
          JORNADA_SQL_SA_PASSWORD: 'Jornada_Compose_Validation_2026!Sql'
        run: docker compose -f docker-compose.yml config >/dev/null
      - run: git -C .. diff --check
      - name: Gate OpenAPI x Minimal API
        run: python3 scripts/openapi-contract-gate.py
      - name: Gate technical closure invariants
        run: python3 scripts/technical-closure-gate.py
      - name: Gate analyzer warning baseline
        run: python3 scripts/analyzer-cleanliness-gate.py
      - name: Gate Power BI source structure
        run: python3 scripts/powerbi-static-gate.py
      - name: Gate HML contracts without fabricating approvals
        run: python3 scripts/hml-config-gate.py --root . --summary .local/hml-config-summary.json
      - name: Preflight CI toolchain and environment contract
        run: |
          python3 scripts/environment-preflight-gate.py --root . --profile ci-linux --strict --summary .local/environment-preflight.json
          python3 scripts/environment-preflight-gate.py --root . --profile ci-linux --self-test
      - name: Gate governance readiness contracts without fabricating approvals
        run: |
          python3 scripts/governance-readiness-gate.py --root . --summary .local/governance-summary.json
          python3 scripts/governance-readiness-gate.py --root . --self-test
      - name: Gate scheduler contract without inventing corporate cadence
        run: python3 scripts/scheduler-contract-gate.py --root . --summary .local/scheduler-summary.json
      - name: Self-test HML SQL/API evidence gates
        run: |
          python3 scripts/sql-performance-evidence-gate.py --self-test
          python3 scripts/api-projection-evidence-gate.py --self-test
      - name: Gate authorization matrix
        run: python3 scripts/authorization-matrix-gate.py
      - name: Gate security/data-minimization surface
        run: python3 scripts/security-surface-gate.py
      - name: Gate explicit version compatibility matrix
        run: python3 scripts/compatibility-matrix-gate.py
      - name: Gate backward compatibility against predecessor contracts
        run: |
          python3 scripts/contract-backward-compatibility-gate.py --repo .. --summary .local/contract-backward-compatibility.json
          python3 scripts/contract-backward-compatibility-gate.py --self-test
      - name: Meta-validate every JSON Schema contract
        run: |
          python3 scripts/json-schema-meta-gate.py --summary .local/json-schema-meta.json
          python3 scripts/json-schema-meta-gate.py --self-test
      - name: Gate project dependency architecture
        run: |
          python3 scripts/architecture-dependency-gate.py --summary .local/architecture-dependencies.json
          python3 scripts/architecture-dependency-gate.py --self-test
      - name: Gate destructive DDL changes
        run: |
          python3 scripts/ddl-destructive-change-gate.py --repo .. --summary .local/ddl-destructive-change.json
          python3 scripts/ddl-destructive-change-gate.py --self-test
      - name: Gate dependency drift
        run: python3 scripts/dependency-drift-gate.py --repo .. --summary .local/dependency-drift.json
      - name: Gate source sanity and pinned workflow actions
        run: |
          python3 scripts/source-sanity-gate.py
          python3 scripts/workflow-action-pin-gate.py
      - name: Gate observability/SLO contract
        run: python3 scripts/observability-contract-gate.py
      - name: Gate calibration freshness contract without fabricating approvals
        run: python3 scripts/hml-staleness-gate.py
      - name: Gate versioned Possibility rules without inventing institutional criteria
        run: |
          python3 scripts/possibility-rules-gate.py config/possibilities/rule-catalog.json --root . --summary .local/possibility-rules-summary.json
          python3 scripts/possibility-rules-gate.py --self-test
      - name: Self-test aggregate release and technical RC evidence gates
        run: |
          python3 scripts/release-evidence-gate.py --self-test
          python3 -m py_compile scripts/technical-rc-gate.py scripts/rc-evidence-gate.py
          python3 scripts/rc-evidence-gate.py --self-test
      - name: Self-test IBGE nominal u multi-seed diagnostic
        run: pwsh -NoLogo -NoProfile -File scripts/local-ibge-u-multiseed.ps1 -SelfTest
      - run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: Prove Python-to-CSharp synthetic corpus rule equivalence
        run: |
          mkdir -p .local/test-evidence/unit
          python3 scripts/synthetic-corpus-equivalence-gate.py \
            --root . \
            --summary .local/test-evidence/unit/synthetic-corpus-equivalence.json
      - name: Unit tests must execute without skips
        run: |
          mkdir -p .local/test-evidence/unit
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-build \
            --filter "TestCategory!=Integration" \
            --collect:"XPlat Code Coverage" \
            --results-directory "$PWD/.local/test-evidence/unit/results" \
            --logger "trx;LogFileName=$PWD/.local/test-evidence/unit/unit.trx"
          python3 scripts/test-evidence-gate.py .local/test-evidence/unit/unit.trx \
            --forbid-skipped --minimum-tests 1 --summary .local/test-evidence/unit/summary.json
          COVERAGE=$(find .local/test-evidence/unit/results -name coverage.cobertura.xml -type f -print -quit)
          test -n "$COVERAGE"
          python3 scripts/coverage-evidence-gate.py "$COVERAGE" \
            --baseline config/release/coverage-baseline.json \
            --summary .local/test-evidence/unit/coverage-summary.json
      - name: Upload unit test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-evidence
          path: Solution/.local/test-evidence/unit
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: OpenAPI runtime conformance must execute for all 19 operations
        run: |
          mkdir -p .local/test-evidence/openapi-runtime
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-build \
            --filter "TestCategory=OpenApiRuntime" \
            --logger "trx;LogFileName=$PWD/.local/test-evidence/openapi-runtime/openapi-runtime.trx"
          python3 scripts/test-evidence-gate.py .local/test-evidence/openapi-runtime/openapi-runtime.trx \
            --forbid-skipped --minimum-tests 19 --summary .local/test-evidence/openapi-runtime/summary.json
      - name: Upload OpenAPI runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-runtime-evidence
          path: Solution/.local/test-evidence/openapi-runtime
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Audit transitive NuGet vulnerabilities
        run: |
          mkdir -p .local/security
          dotnet list Jornada.sln package --vulnerable --include-transitive --format json > .local/security/nuget-vulnerabilities.json
          python3 scripts/vulnerability-evidence-gate.py .local/security/nuget-vulnerabilities.json --summary .local/security/vulnerability-summary.json
          python3 scripts/vulnerability-evidence-gate.py --self-test
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p .local/sbom
          dotnet list Jornada.sln package --include-transitive --format json > .local/sbom/dotnet-packages.json
          python3 scripts/generate-sbom.py --input .local/sbom/dotnet-packages.json --output .local/sbom/sbom.cdx.json
          python3 -m json.tool .local/sbom/sbom.cdx.json >/dev/null
      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: Solution/.local/sbom/sbom.cdx.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  deterministic-build:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked dependency graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
      - name: Prove deterministic double build
        run: ./scripts/deterministic-build-gate.sh . .local/deterministic-build
      - name: Upload deterministic build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-build-evidence
          path: Solution/.local/deterministic-build
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  security-analysis:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked dependency graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
          dotnet restore tests/Jornada.Integration.Tests/Jornada.Integration.Tests.csproj --locked-mode
      - name: Gate source sanity and workflow action pins
        run: |
          mkdir -p .local/security
          python3 scripts/source-sanity-gate.py | tee .local/security/source-sanity.txt
          python3 scripts/workflow-action-pin-gate.py | tee .local/security/action-pins.txt
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          mkdir -p .local/tools/gitleaks .local/security
          archive=".local/tools/gitleaks/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error             "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"             --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --
          tar -xzf "$archive" -C .local/tools/gitleaks gitleaks
          chmod 0755 .local/tools/gitleaks/gitleaks
          echo "$PWD/.local/tools/gitleaks" >> "$GITHUB_PATH"
          .local/tools/gitleaks/gitleaks version | tee .local/security/gitleaks-version.txt
      - name: Scan current tree with Gitleaks
        run: |
          set -uo pipefail
          set +e
          ./scripts/security-secret-scan.sh --current-tree-only 2>&1 | tee .local/security/gitleaks-current-tree.txt
          scan_rc=${PIPESTATUS[0]}
          set -e
          if [[ -f .local/gitleaks/current-tree.json ]]; then
            cp .local/gitleaks/current-tree.json .local/security/gitleaks-current-tree.json
          else
            printf '[]\n' > .local/security/gitleaks-current-tree.json
          fi
          exit "$scan_rc"
      - name: Audit NuGet vulnerabilities as structured evidence
        run: |
          dotnet list Jornada.sln package --vulnerable --include-transitive --format json > .local/security/nuget-vulnerabilities.json
          python3 scripts/vulnerability-evidence-gate.py .local/security/nuget-vulnerabilities.json --summary .local/security/vulnerability-summary.json
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended
      - name: Build for CodeQL
        run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          category: /language:csharp
          output: Solution/.local/security/codeql
          upload: never
      - name: Fail closed on blocking SARIF findings
        run: |
          python3 scripts/sarif-security-gate.py .local/security/codeql --summary .local/security/sarif-summary.json
          python3 scripts/sarif-security-gate.py --self-test
      - name: Upload security analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-analysis-evidence
          path: Solution/.local/security
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90

  integration-sql:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!Sql'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!Sql' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      JORNADA_TEST_SQL_CONNECTION: 'Server=localhost,1433;Database=JornadaTest;User Id=sa;Password=Jornada_${{ github.run_id }}!Sql;TrustServerCertificate=true;Encrypt=false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked NuGet graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
      - run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: Create integration database
        run: |
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!Sql' -C -Q "IF DB_ID('JornadaTest') IS NULL CREATE DATABASE JornadaTest;"
      - name: SQL runtime semantic smoke on canonical 3.70
        run: |
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          docker exec "$CID" mkdir -p /var/opt/mssql/data/jornada/database
          docker cp database/. "$CID":/var/opt/mssql/data/jornada/database/
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!Sql' -C -b -d JornadaTest -i database/Jornada_Fase1_v3.70.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!Sql' -C -b -d JornadaTest -i database/Jornada_Seed_Dev.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!Sql' -C -b -d JornadaTest -i database/migrations/20260907_Cpf_Ancora.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!Sql' -C -b -d JornadaTest -i database/migrations/20260910_Schema_Consolidation_370.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!Sql' -C -b -d JornadaTest -i database/Jornada_Runtime_Smoke.sql
      - name: Integration tests must execute without skips
        run: |
          mkdir -p .local/test-evidence/integration
          dotnet test tests/Jornada.Integration.Tests/Jornada.Integration.Tests.csproj --configuration Release --no-build \
            --logger "trx;LogFileName=$PWD/.local/test-evidence/integration/integration.trx"
          python3 scripts/test-evidence-gate.py .local/test-evidence/integration/integration.trx \
            --forbid-skipped --minimum-tests 1 --summary .local/test-evidence/integration/summary.json
      - name: Upload integration test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-evidence
          path: Solution/.local/test-evidence/integration
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Fault injection must execute without skips
        run: |
          mkdir -p .local/fault-injection
          dotnet test tests/Jornada.Integration.Tests/Jornada.Integration.Tests.csproj --configuration Release --no-build \
            --filter "TestCategory=FaultInjection" \
            --logger "trx;LogFileName=$PWD/.local/fault-injection/fault-injection.trx"
          python3 scripts/test-evidence-gate.py .local/fault-injection/fault-injection.trx \
            --forbid-skipped --minimum-tests 2 --summary .local/fault-injection/summary.json
      - name: Upload fault-injection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fault-injection-evidence
          path: Solution/.local/fault-injection
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  harness-smoke:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Solution
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!HarnessSql'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      ConnectionStrings__Jornada: 'Server=localhost,1433;Database=JornadaHarness;User Id=sa;Password=Jornada_${{ github.run_id }}!HarnessSql;TrustServerCertificate=true;Encrypt=false'
      PipelineCoordination__HeartbeatSeconds: '2'
      PipelineCoordination__ExclusiveIntentTimeoutSeconds: '5'
      LinkageParameters__RunOnce: 'true'
      LinkageParameters__TrainingSampleSize: '2000'
      LinkageParameters__TrainingSamplePoolSize: '5000'
      LinkageParameters__MinimumIndependentMatchedPairs: '500'
      LinkageParameters__ReadCommandTimeoutSeconds: '300'
      LinkageParameters__BlockingSearch__MinimumTrueMatchRecall: '0.95'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked NuGet graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
      - run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: Create harness database and seed canonical IBGE-weighted synthetic corpus on 3.70
        run: |
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          docker exec "$CID" mkdir -p /var/opt/mssql/data/jornada/database
          docker cp database/. "$CID":/var/opt/mssql/data/jornada/database/
          docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -Q "CREATE DATABASE JornadaHarness;"
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -i database/Jornada_Fase1_v3.70.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -i database/Jornada_Seed_Dev.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -i database/migrations/20260907_Cpf_Ancora.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -i database/migrations/20260910_Schema_Consolidation_370.sql
          DOTNET_ENVIRONMENT=Development \
          LinkageParameters__Operation=LOAD_NAME_FREQUENCY_SNAPSHOT \
          NameFrequencySnapshot__ManifestPath="$PWD/data/reference/ibge-nomes-2022/manifest.json" \
            dotnet run --project src/Jornada.Linkage.Parameters.Worker --configuration Release --no-build
          ACTIVE_NAME_REFERENCE=$(docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP(1) codigo FROM ref.frequencia_nome_versao WHERE status=N'ATIVA';" | tr -d '\r' | xargs)
          test "$ACTIVE_NAME_REFERENCE" = 'CENSO2022_NOMES_BRASIL_V1'
          # 4.000 pares preservam cerca de 2.400 pessoas-base TRAIN sob holdout 60/20/20,
          # permitindo amostra m=2.000 sem reutilizar VALIDATION/TEST. O gate de recall
          # continua 0,95 e não é relaxado para acomodar a calibração.
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -v SCALE_PEOPLE=5000 SCALE_PAIRED=4000 SCALE_PENDING=1000 SCALE_SEED=355 SCALE_COLLISION_MODULO=37 SCALE_BIRTH_SHIFT_MODULO=29 -i database/Jornada_Dev_SyntheticScale.sql
          docker exec -w /var/opt/mssql/data/jornada "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -v SCALE_PEOPLE=5000 SCALE_SEED=355 SCALE_COLLISION_MODULO=37 -i database/Jornada_Dev_SyntheticScale_Diversify.sql
      - name: Materialize canonical blocking projection for synthetic harness
        env:
          DOTNET_ENVIRONMENT: Development
          Processor__Operation: REBUILD_LOCAL_BLOCKING
        run: |
          dotnet run --project src/Jornada.Processor.Worker --configuration Release --no-build
          CID=$(docker ps -q --filter publish=1433 | head -1)
          KEY_COUNT=$(docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT_BIG(*) FROM identidade.blocking_chave;" | tr -d '\r' | xargs)
          test "${KEY_COUNT:-0}" -gt 0
      - name: Generate, validate and activate model
        run: |
          export LinkageParameters__Operation=GENERATE_DRAFT
          dotnet run --project src/Jornada.Linkage.Parameters.Worker --configuration Release --no-build
          CID=$(docker ps -q --filter publish=1433 | head -1)
          MODEL_VERSION=$(docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP(1) versao FROM identidade.modelo_linkage WHERE status='RASCUNHO' ORDER BY versao DESC;" | tr -d '\r' | xargs)
          test -n "$MODEL_VERSION"
          MODEL_ID=$(docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; SELECT CONVERT(varchar(36),modelo_id) FROM identidade.modelo_linkage WHERE versao=$MODEL_VERSION;" | tr -d '\r' | xargs)
          test -n "$MODEL_ID"

          TEST_CONFERENCE_TOLERANCE="$RUNNER_TEMP/jornada-conference-tolerance.json"
          cat > "$TEST_CONFERENCE_TOLERANCE" <<'JSON'
          {
            "schemaVersion": 1,
            "methodVersion": "JORNADA_IMPLEMENTATION_CONFERENCE_STATE_VECTOR_V1",
            "status": "FROZEN",
            "scope": "SCORER_POLICY_ONLY_STATES_AND_GUARD_INPUTS_PRECOMPUTED_COMPARATORS_OUT_OF_SCOPE",
            "maxAbsolutePairLlrDifference": 0.000001,
            "decisionEquivalence": "EXACT_FINAL_OPERATIONAL_DECISION",
            "primaryGates": [
              "PAIR_LLR_WITHIN_FROZEN_TOLERANCE",
              "EXACT_FINAL_OPERATIONAL_DECISION"
            ],
            "diagnosticsOnly": [
              "SPEARMAN_RANK_CORRELATION",
              "SAME_TOP1",
              "MAX_ABSOLUTE_LOG_ODDS_DIFFERENCE"
            ],
            "statisticalValidation": "SEPARATE_ISSUE_31",
            "note": "TEST_ONLY CI fixture; never a production governance tolerance.",
            "toleranceVersion": "TEST_ONLY_CI_${{ github.run_id }}"
          }
          JSON

          dotnet run --project src/Jornada.Linkage.Conference --configuration Release --no-build -- \
            --model-id "$MODEL_ID" \
            --tolerance-config "$TEST_CONFERENCE_TOLERANCE" \
            --source-revision "${GITHUB_SHA}"

          export LinkageParameters__ConferenceToleranceConfigPath="$TEST_CONFERENCE_TOLERANCE"
          export LinkageParameters__TargetVersion="$MODEL_VERSION"
          export LinkageParameters__Operation=VALIDATE
          dotnet run --project src/Jornada.Linkage.Parameters.Worker --configuration Release --no-build
          export LinkageParameters__Operation=ACTIVATE
          dotnet run --project src/Jornada.Linkage.Parameters.Worker --configuration Release --no-build
          echo "MODEL_VERSION=$MODEL_VERSION" >> "$GITHUB_ENV"
      - name: Run linkage model-validation smoke
        run: |
          dotnet run --project src/Jornada.Linkage.Runner --configuration Release --no-build -- \
            --mode MODEL_VALIDATION --model-version "$MODEL_VERSION" --since 2026-08-31T01:00:00Z --max-records 1000 \
            --batch-size 500 --max-parallelism 2 --publish false \
            --requested-by CI_HARNESS --reason ci-harness-evidence
      - name: Reconcile no-candidate counter on generic synthetic smoke
        run: |
          CID=$(docker ps -q --filter publish=1433 | head -1)
          RUN_ID=$(docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP(1) CONVERT(varchar(36),linkage_run_id) FROM identidade.linkage_run WHERE solicitado_por=N'CI_HARNESS' ORDER BY iniciado_em DESC;" | tr -d '\r' | xargs)
          test -n "$RUN_ID"
          AUDIT=$(docker exec -i "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -P 'Jornada_${{ github.run_id }}!HarnessSql' -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; WITH rr AS (SELECT r.motivo FROM identidade.linkage_resultado r JOIN silver.pessoa_observacao po ON po.pessoa_observacao_id=r.pessoa_observacao_id WHERE r.linkage_run_id='$RUN_ID' AND po.codigo_pessoa_origem LIKE N'SCALE-PEND-%'), nc AS (SELECT * FROM rr WHERE motivo LIKE N'SEM_CANDIDATO_%') SELECT CONCAT((SELECT sem_candidato_no_bloco FROM identidade.linkage_run WHERE linkage_run_id='$RUN_ID'),'|',(SELECT COUNT_BIG(*) FROM nc),'|',(SELECT COUNT_BIG(*) FROM rr));" | tr -d '\r' | xargs)
          IFS='|' read -r REPORTED_NO_CANDIDATE ACTUAL_NO_CANDIDATE TOTAL_SYNTHETIC_RESULTS <<< "$AUDIT"
          echo "NO-CANDIDATE AUDIT: reported=$REPORTED_NO_CANDIDATE actual=$ACTUAL_NO_CANDIDATE total=$TOTAL_SYNTHETIC_RESULTS"
          test "$REPORTED_NO_CANDIDATE" = "$ACTUAL_NO_CANDIDATE"
          test "$TOTAL_SYNTHETIC_RESULTS" = '1000'
          # O piso de recall do blocking é responsabilidade do ruleset calibrado e da
          # validação independente adversarial. SCALE-PEND é apenas smoke operacional
          # genérico; não é conjunto rotulado independente e não deve duplicar esse gate.
      - name: Run read-only linkage evaluation smoke
        env:
          JORNADA_EVALUATION_SQL_PASSWORD: 'Jornada_${{ github.run_id }}!HarnessSql'
          JORNADA_EVALUATION_DATABASE: 'JornadaHarness'
          JORNADA_EVALUATION_SCALE_PEOPLE: '5000'
          JORNADA_EVALUATION_SCALE_SEED: '355'
          JORNADA_EVALUATION_LABEL_COUNT: '100'
        run: ./scripts/linkage-evaluation-smoke.sh
      - name: Upload linkage evaluation smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linkage-evaluation-smoke
          path: Solution/.local/linkage-evaluation-smoke
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

  ddl-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - name: Validate DDL upgrade and idempotency
        run: ./scripts/local-ddl-upgrade.sh
      - name: Upload DDL upgrade evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ddl-upgrade-evidence
          path: Solution/.local/ddl-upgrade
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
      - name: Stop local SQL Server
        if: always()
        run: docker compose --env-file .env down -v || true

  e2e:
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Install locked NuGet graph
        run: tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
      - name: Run HTTP-to-Gold end-to-end gate
        env:
          JORNADA_E2E_LOCKED_RESTORE: 'true'
        run: ./scripts/local-e2e.sh
      - name: Upload E2E evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-e2e-evidence
          path: Solution/.local/e2e
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30
      - name: Stop local SQL Server
        if: always()
        run: docker compose --env-file .env down -v || true

  bronze-restore-drill:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Install committed lock graph
        run: tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
      - name: SQL + Bronze restore drill with negative storage faults
        env:
          JORNADA_LOCKED_RESTORE: 'true'
        run: ./scripts/local-backup-restore-drill.sh
      - name: Upload restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bronze-restore-drill
          path: Solution/.local/backup-drill
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Stop local SQL Server
        if: always()
        run: docker compose --env-file .env down -v || true

  scale-harness:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: dependency-lock
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Install committed lock graph
        run: tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
      - name: Run scale harness and validate evidence
        env:
          JORNADA_LOCKED_RESTORE: 'true'
          SCALE_PROFILE: ${{ github.ref_type == 'tag' && 'smoke' || inputs.scale_profile }}
        run: ./scripts/local-scale.sh "${SCALE_PROFILE:-smoke}"
      - name: Upload scale evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scale-harness-${{ github.ref_type == 'tag' && 'smoke' || inputs.scale_profile }}
          path: Solution/.local/performance
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Stop local SQL Server
        if: always()
        run: docker compose --env-file .env down -v || true

  rc-evidence:
    if: (github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && contains(github.ref_name, '-rc.')) || (github.event_name == 'workflow_dispatch' && inputs.rc_evidence_preflight)
    needs: [dependency-lock, unit, deterministic-build, security-analysis, integration-sql, harness-smoke, ddl-upgrade, e2e, bronze-restore-drill, scale-harness]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      JORNADA_RC_SQL_PASSWORD: Jornada_${{ github.run_id }}_Rc9!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Jornada_${{ github.run_id }}_Rc9!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve technical RC identity for tag or dispatch preflight
        shell: bash
        run: |
          set -euo pipefail
          declared_tag=$(python3 -c 'import json; print(json.load(open("CANDIDATE_INFO.json", encoding="utf-8"))["candidate"]["technical_rc"]["identifier"])')
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "$declared_tag"
            rc_tag="$GITHUB_REF_NAME"
            rc_mode="tag"
          else
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "${{ inputs.rc_evidence_preflight }}" = "true"
            rc_tag="$declared_tag"
            rc_mode="preflight"
            existing=$(git rev-parse --verify "refs/tags/${rc_tag}^{commit}" 2>/dev/null || true)
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              echo "RC preflight recusado: a tag local/remota $rc_tag já aponta para $existing, não para $GITHUB_SHA." >&2
              exit 1
            fi
            if [[ -z "$existing" ]]; then
              git tag "$rc_tag" "$GITHUB_SHA"
            fi
          fi
          echo "JORNADA_RC_TAG=$rc_tag" >> "$GITHUB_ENV"
          echo "JORNADA_RC_MODE=$rc_mode" >> "$GITHUB_ENV"
      - name: Require prior successful same-commit RC preflight before tag cut
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs_json=$(gh api "/repos/${GH_REPO}/actions/workflows/ci.yml/runs?event=workflow_dispatch&status=success&head_sha=${GITHUB_SHA}&per_page=100")
          run_ids=$(printf '%s' "$runs_json" | python3 -c 'import json,sys; print(" ".join(str(x["id"]) for x in json.load(sys.stdin).get("workflow_runs", [])))')
          test -n "$run_ids"

          matched=""
          for run_id in $run_ids; do
            jobs_json=$(gh api "/repos/${GH_REPO}/actions/runs/${run_id}/jobs?per_page=100")
            if printf '%s' "$jobs_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); raise SystemExit(0 if any(j.get("name")=="rc-evidence" and j.get("conclusion")=="success" for j in d.get("jobs", [])) else 1)'; then
              matched="$run_id"
              break
            fi
          done

          test -n "$matched"
          echo "Same-commit RC preflight verified: run_id=$matched head=${GITHUB_SHA}"
      - name: Install sqlcmd
        run: |
          set -euo pipefail
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update -qq
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mssql-tools18
          echo '/opt/mssql-tools18/bin' >> "$GITHUB_PATH"
      - name: Wait for SQL Server
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$JORNADA_RC_SQL_PASSWORD" -C -Q 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Verify technical RC tag without promoting sealed release
        run: >-
          python3 Solution/scripts/technical-rc-gate.py
          --repo .
          --candidate-info CANDIDATE_INFO.json
          --release-info RELEASE_INFO.txt
          --expected-tag "${JORNADA_RC_TAG}"
          --require-clean
      - name: Download exact-run prerequisite evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: '*'
          path: Solution/.local/rc-evidence-input
          merge-multiple: false
      - name: Build technical RC source bundle
        run: |
          set -euo pipefail
          bash Solution/scripts/build-rc-source-bundle.sh \
            . \
            Solution/.local/rc-source/Jornada_RC_Source.bundle \
            Solution/.local/rc-source/RC_SOURCE_PROVENANCE.json \
            CANDIDATE_INFO.json \
            "$JORNADA_RC_TAG"
          mkdir -p Solution/.local/rc-evidence-input/rc-source-provenance
          cp Solution/.local/rc-source/Jornada_RC_Source.bundle Solution/.local/rc-evidence-input/rc-source-provenance/
          cp Solution/.local/rc-source/RC_SOURCE_PROVENANCE.json Solution/.local/rc-evidence-input/rc-source-provenance/
      - name: Recompute durable schema fingerprint on the RC tag
        working-directory: Solution
        run: |
          set -euo pipefail
          mkdir -p .local/rc-evidence-input/rc-structural-provenance
          sqlcmd -S localhost -U sa -P "$JORNADA_RC_SQL_PASSWORD" -C -b -Q "CREATE DATABASE JornadaRcSchema;"
          sqlcmd -S localhost -U sa -P "$JORNADA_RC_SQL_PASSWORD" -C -b -d JornadaRcSchema -i database/Jornada_Fase1_v3.70.sql
          sqlcmd -S localhost -U sa -P "$JORNADA_RC_SQL_PASSWORD" -C -b -d JornadaRcSchema -W -h -1 -i database/Jornada_Dev_DdlFingerprint.sql \
            | sed '/^[[:space:]]*$/d' > .local/rc-evidence-input/rc-structural-provenance/fingerprint.txt

          declared_fingerprint=$(python3 -c 'import json; print(json.load(open("../CANDIDATE_INFO.json", encoding="utf-8"))["candidate"]["schema_provenance"]["structural_fingerprint_sha256"])')
          declared_manifest=$(python3 -c 'import json; print(json.load(open("../CANDIDATE_INFO.json", encoding="utf-8"))["candidate"]["schema_provenance"]["migration_manifest_sha256"])')
          actual_fingerprint=$(sha256sum .local/rc-evidence-input/rc-structural-provenance/fingerprint.txt | awk '{print $1}')
          actual_manifest=$(python3 - <<'PY'
          from pathlib import Path
          import hashlib
          text=Path("database/migrations/manifest.txt").read_bytes().decode("utf-8-sig")
          text=text.replace("\r\n","\n").replace("\r","\n")
          print(hashlib.sha256(text.encode("utf-8")).hexdigest())
          PY
          )
          test "$actual_fingerprint" = "$declared_fingerprint"
          test "$actual_manifest" = "$declared_manifest"

          ACTUAL_FP="$actual_fingerprint" DECLARED_FP="$declared_fingerprint" ACTUAL_MANIFEST="$actual_manifest" DECLARED_MANIFEST="$declared_manifest" python3 - <<'PY'
          import json, os
          from pathlib import Path
          candidate=json.loads(Path("../CANDIDATE_INFO.json").read_text(encoding="utf-8"))
          provenance=candidate["candidate"]["schema_provenance"]
          result={
              "schemaVersion":1,
              "status":"PASS",
              "tag":os.environ["JORNADA_RC_TAG"],
              "headSha":os.environ["GITHUB_SHA"],
              "declaredFingerprintSha256":os.environ["DECLARED_FP"],
              "actualFingerprintSha256":os.environ["ACTUAL_FP"],
              "declaredManifestSha256":os.environ["DECLARED_MANIFEST"],
              "actualManifestSha256":os.environ["ACTUAL_MANIFEST"],
              "structuralCheckpointCommit":provenance["source_commit"],
              "schemaEvidenceModel":provenance["evidence_model"],
              "executionMode":os.environ["JORNADA_RC_MODE"],
              "note":"Fresh technical-RC evidence execution on the exercised commit. In preflight mode the declared RC tag exists only in the runner; no remote tag or GitHub Release is created."
          }
          out=Path(".local/rc-evidence-input/rc-structural-provenance/RC_SCHEMA_PROVENANCE.json")
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          cp ../CANDIDATE_INFO.json .local/rc-evidence-input/rc-structural-provenance/CANDIDATE_INFO.json
      - name: Consolidate technical RC evidence
        working-directory: Solution
        run: |
          set -euo pipefail
          mkdir -p .local/rc-evidence
          python3 scripts/rc-evidence-gate.py \
            --input-root .local/rc-evidence-input \
            --candidate-info ../CANDIDATE_INFO.json \
            --output .local/rc-evidence/RC_EVIDENCE.json
      - name: Attest RC evidence, source and schema provenance
        id: attest-rc
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            Solution/.local/rc-evidence/RC_EVIDENCE.json
            Solution/.local/rc-source/Jornada_RC_Source.bundle
            Solution/.local/rc-source/RC_SOURCE_PROVENANCE.json
            Solution/.local/rc-evidence-input/rc-structural-provenance/RC_SCHEMA_PROVENANCE.json
            Solution/.local/rc-evidence-input/rc-structural-provenance/fingerprint.txt
            Solution/.local/rc-evidence-input/sbom-cyclonedx/sbom.cdx.json
      - name: Persist RC attestation and release notes
        run: |
          set -euo pipefail
          cp "${{ steps.attest-rc.outputs.bundle-path }}" Solution/.local/rc-evidence/ATTESTATION.sigstore.json
          actual_fingerprint=$(python3 -c 'import json; print(json.load(open("Solution/.local/rc-evidence-input/rc-structural-provenance/RC_SCHEMA_PROVENANCE.json", encoding="utf-8"))["actualFingerprintSha256"])')
          ACTUAL_FINGERPRINT="$actual_fingerprint" python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["JORNADA_RC_TAG"]
          mode = os.environ["JORNADA_RC_MODE"]
          sha = os.environ["GITHUB_SHA"]
          fingerprint = os.environ["ACTUAL_FINGERPRINT"]
          text = f"""# {tag} — evidência de checkpoint técnico

          Modo de execução: `{mode}`.

          Esta evidência corresponde ao conteúdo candidato ao checkpoint técnico da Solution Engenharia v5.00.
          Em modo `preflight`, a tag `{tag}` é criada **somente no runner** para exercitar a mesma cadeia de validação; nenhuma tag remota ou GitHub Release é criada.
          Em modo `tag`, a tag identifica o checkpoint de fonte imutável.

          O checkpoint **não é homologação estatística**, **não autoriza ativação/publicação probabilística** e **não autoriza Produção**. A última release normativa selada continua sendo a declarada em `RELEASE_INFO.txt`.

          Gates externos que permanecem pendentes:
          - #31 — validação estatística representativa do Linkage;
          - #93 — volumetria HML e decisão institucional de acesso;
          - #378 — autenticação PRODAM e separação ambiental;
          - #379 — mudanças de política que exigem decisão externa;
          - decisão de finalidade/base legal GTPR declarada em `CANDIDATE_INFO.json`.

          Evidência desta execução:
          - commit: `{sha}`;
          - fingerprint estrutural recomputado nesta execução: `{fingerprint}`;
          - `RC_EVIDENCE.json`, bundle de fonte, proveniência de schema e attestation Sigstore no artifact `technical-rc-evidence`.

          Mutabilidade: a **tag/fonte do checkpoint é imutável**; os assets do pre-release são `REPLACEABLE_BY_RERUN_WITH_CLOBBER`, conforme `CANDIDATE_INFO.json`. A autoridade de digest é `SIGSTORE_ATTESTATION_SUBJECT_DIGESTS`.

          `release_effect=NONE`: o checkpoint não reescreve `RELEASE_INFO.txt`.
          """
          Path("Solution/.local/rc-evidence/RC_NOTES.md").write_text(text, encoding="utf-8")
          PY
      - name: Upload RC evidence as Actions backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: technical-rc-evidence
          path: |
            Solution/.local/rc-evidence
            Solution/.local/rc-source
            Solution/.local/rc-evidence-input/rc-structural-provenance
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 365
      - name: Stop RC SQL Server
        if: always()
        run: docker ps -q --filter publish=1433 | xargs -r docker stop >/dev/null || true

  rc-publish:
    if: github.ref_type == 'tag' && github.ref_name == 'v5.00-rc.1'
    needs: rc-evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download attested technical RC evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: technical-rc-evidence
          path: Solution/.local/rc-publish
      - name: Verify declared release-asset mutability
        run: |
          set -euo pipefail
          candidate=Solution/.local/rc-publish/rc-evidence-input/rc-structural-provenance/CANDIDATE_INFO.json
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate"]["technical_rc"]["release_assets_mutability"])' "$candidate")" = "REPLACEABLE_BY_RERUN_WITH_CLOBBER"
      - name: Publish or refresh durable GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          root="Solution/.local/rc-publish"
          title="Jornada ${GITHUB_REF_NAME} — technical checkpoint"
          notes="$root/rc-evidence/RC_NOTES.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --prerelease --title "$title" --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --title "$title" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$root/rc-evidence/RC_EVIDENCE.json" \
            "$root/rc-evidence/ATTESTATION.sigstore.json" \
            "$root/rc-evidence/RC_NOTES.md" \
            "$root/rc-source/Jornada_RC_Source.bundle" \
            "$root/rc-source/RC_SOURCE_PROVENANCE.json" \
            "$root/rc-evidence-input/rc-structural-provenance/RC_SCHEMA_PROVENANCE.json" \
            "$root/rc-evidence-input/rc-structural-provenance/fingerprint.txt" \
            "$root/rc-evidence-input/rc-structural-provenance/CANDIDATE_INFO.json"
  release-promotion:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'jornada-solution-v')
    needs: [dependency-lock, unit, deterministic-build, security-analysis, integration-sql, harness-smoke, ddl-upgrade, e2e, bronze-restore-drill, scale-harness]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Download all prerequisite release evidence
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          pattern: '*'
          path: Solution/.local/release-evidence-input
          merge-multiple: false
      - name: Verify release tag and Git ancestry
        run: >-
          python3 Solution/scripts/release-source-gate.py
          --repo .
          --release-info RELEASE_INFO.txt
          --expected-tag "${GITHUB_REF_NAME}"
          --require-clean
      - name: Recheck committed NuGet locks
        run: python3 Solution/scripts/nuget-lock-gate.py --root Solution --summary /tmp/jornada-release-locks.json
      - name: Recheck and persist static release gates
        working-directory: Solution
        run: |
          set -o pipefail
          mkdir -p .local/release-static/config/hml .local/release-static/config/possibilities .local/release-static/config/security .local/release-static/config/release .local/release-static/config/observability .local/release-static/config/governance .local/release-static/config/operations
          python3 scripts/openapi-contract-gate.py | tee .local/release-static/openapi.txt
          python3 scripts/technical-closure-gate.py | tee .local/release-static/technical-closure.txt
          python3 scripts/analyzer-cleanliness-gate.py | tee .local/release-static/analyzer-cleanliness.txt
          python3 scripts/powerbi-static-gate.py | tee .local/release-static/powerbi-static.txt
          python3 scripts/hml-config-gate.py --root . --summary .local/release-static/hml-config.json
          python3 scripts/environment-preflight-gate.py --root . --profile ci-linux --strict --summary .local/release-static/environment-preflight.json
          python3 scripts/governance-readiness-gate.py --root . --summary .local/release-static/governance-readiness.json
          python3 scripts/scheduler-contract-gate.py --root . --summary .local/release-static/scheduler-contract.json
          python3 scripts/sql-performance-evidence-gate.py --self-test | tee .local/release-static/sql-performance-selftest.txt
          python3 scripts/api-projection-evidence-gate.py --self-test | tee .local/release-static/api-projection-selftest.txt
          python3 scripts/hml-staleness-gate.py | tee .local/release-static/hml-staleness.txt
          python3 scripts/authorization-matrix-gate.py | tee .local/release-static/authorization-matrix.txt
          python3 scripts/security-surface-gate.py | tee .local/release-static/security-surface.txt
          python3 scripts/compatibility-matrix-gate.py | tee .local/release-static/compatibility-matrix.txt
          python3 scripts/contract-backward-compatibility-gate.py --repo .. --summary .local/release-static/contract-backward-compatibility.json
          python3 scripts/json-schema-meta-gate.py --summary .local/release-static/json-schema-meta.json
          python3 scripts/architecture-dependency-gate.py --summary .local/release-static/architecture-dependencies.json
          python3 scripts/ddl-destructive-change-gate.py --repo .. --summary .local/release-static/ddl-destructive-change.json
          python3 scripts/dependency-drift-gate.py --repo .. --summary .local/release-static/dependency-drift.json
          python3 scripts/source-sanity-gate.py | tee .local/release-static/source-sanity.txt
          python3 scripts/workflow-action-pin-gate.py | tee .local/release-static/workflow-action-pins.txt
          python3 scripts/observability-contract-gate.py | tee .local/release-static/observability-contract.txt
          python3 scripts/possibility-rules-gate.py config/possibilities/rule-catalog.json --root . --summary .local/release-static/possibility-rules.json
          cp config/hml/parameters.json config/hml/performance-baseline.json config/hml/linkage-evaluation-policy.json config/hml/calibration-validity-policy.json .local/release-static/config/hml/
          cp config/hml/sql-performance-policy.json config/hml/api-projection-load-policy.json .local/release-static/config/hml/
          cp config/governance/schema-approvals.json config/governance/retention-dr-policy.json config/governance/identity-pending-lifecycle.json .local/release-static/config/governance/
          cp config/operations/scheduler-jobs.json .local/release-static/config/operations/
          cp config/release/environment-requirements.json .local/release-static/config/release/
          cp config/possibilities/rule-catalog.json .local/release-static/config/possibilities/
          cp config/security/authorization-matrix.json config/security/data-minimization-policy.json .local/release-static/config/security/
          cp config/release/compatibility-matrix.json .local/release-static/config/release/
          cp config/release/ddl-change-policy.json config/release/coverage-baseline.json config/release/dependency-drift-policy.json config/release/architecture-dependencies.json .local/release-static/config/release/
          cp config/security/source-sanity-policy.json .local/release-static/config/security/
          cp config/observability/metrics-slo-catalog.json .local/release-static/config/observability/
      - name: Build portable Git source bundle
        run: >-
          Solution/scripts/build-release-source-bundle.sh
          .
          Solution/.local/release-source/Jornada_Source.bundle
          Solution/.local/release-source/SOURCE_PROVENANCE.json
          RELEASE_INFO.txt
      - name: Consolidate complete release evidence bundle
        working-directory: Solution
        run: |
          mkdir -p .local/release-evidence-input/release-source-provenance .local/release-evidence-input/release-static-gates .local/release-evidence
          cp .local/release-source/Jornada_Source.bundle .local/release-evidence-input/release-source-provenance/Jornada_Source.bundle
          cp .local/release-source/SOURCE_PROVENANCE.json .local/release-evidence-input/release-source-provenance/SOURCE_PROVENANCE.json
          cp -R .local/release-static/. .local/release-evidence-input/release-static-gates/
          python3 scripts/release-evidence-gate.py \
            --input-root .local/release-evidence-input \
            --policy config/release/release-evidence-policy.json \
            --release-info ../RELEASE_INFO.txt \
            --output .local/release-evidence/RELEASE_EVIDENCE.json
      - name: Attest release evidence, source bundle and SBOM with GitHub OIDC/Sigstore
        id: attest-release
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            Solution/.local/release-evidence/RELEASE_EVIDENCE.json
            Solution/.local/release-source/Jornada_Source.bundle
            Solution/.local/release-source/SOURCE_PROVENANCE.json
            Solution/.local/release-evidence-input/sbom-cyclonedx/sbom.cdx.json
      - name: Persist Sigstore attestation bundle as release evidence
        run: cp "${{ steps.attest-release.outputs.bundle-path }}" Solution/.local/release-evidence/ATTESTATION.sigstore.json
      - name: Upload consolidated release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: Solution/.local/release-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 365
      - name: Upload release source provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-provenance
          path: |
            Solution/.local/release-source/Jornada_Source.bundle
            Solution/.local/release-source/SOURCE_PROVENANCE.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 365
