    # Reusable job keeps the SAME status check and lock-artifact provenance.
    # Only DT10-triggering PRs pay for the SQL service and .NET build.
    uses: ./.github/workflows/dt10-evidence.yml

  harness-smoke:
    needs: [impact, dependency-lock]
    if: needs.impact.outputs.run_full == 'true' && needs.dependency-lock.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Solution
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!HarnessSql'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      JORNADA_SQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!HarnessSql'
      ConnectionStrings__Jornada: 'Server=localhost,1433;Database=JornadaHarness;User Id=sa;Password=Jornada_${{ github.run_id }}!HarnessSql;TrustServerCertificate=true;Encrypt=false'
      PipelineCoordination__HeartbeatSeconds: '2'
      PipelineCoordination__ExclusiveIntentTimeoutSeconds: '5'
      LinkageParameters__RunOnce: 'true'
      LinkageParameters__TrainingSampleSize: '2000'
      LinkageParameters__TrainingSamplePoolSize: '5000'
      LinkageParameters__MinimumIndependentMatchedPairs: '500'
      LinkageParameters__ReadCommandTimeoutSeconds: '300'
      LinkageParameters__BlockingSearch__MinimumTrueMatchRecall: '0.95'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.113'
          # Packages are cached by the hash of every committed project lockfile.
          # Locked restore and the dependency-lock artifact remain mandatory.
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked NuGet graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
      - run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: Create harness database and seed canonical IBGE-weighted synthetic corpus on 3.70
        run: |
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          docker exec "$CID" mkdir -p /var/opt/mssql/data/jornada/database
          docker cp database/. "$CID":/var/opt/mssql/data/jornada/database/
          SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -Q "CREATE DATABASE JornadaHarness;"
          SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -w /var/opt/mssql/data/jornada -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d JornadaHarness -i database/Jornada_Fase1_v3.70.sql
          SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -w /var/opt/mssql/data/jornada -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d JornadaHarness -i database/Jornada_Seed_Dev.sql
          SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -w /var/opt/mssql/data/jornada -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d JornadaHarness -i database/migrations/20260907_Cpf_Ancora.sql
          SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -w /var/opt/mssql/data/jornada -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d JornadaHarness -i database/migrations/20260910_Schema_Consolidation_370.sql -i database/migrations/20260930_Linkage_Z_Model_Config_Bundle_Fingerprint.sql
          DOTNET_ENVIRONMENT=Development \
          LinkageParameters__Operation=LOAD_NAME_FREQUENCY_SNAPSHOT \
          NameFrequencySnapshot__ManifestPath="$PWD/data/reference/ibge-nomes-2022/manifest.json" \
            dotnet run --project src/Jornada.Linkage.Parameters.Worker --configuration Release --no-build
          ACTIVE_NAME_REFERENCE=$(SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -i -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d JornadaHarness -h -1 -W -Q "SET NOCOUNT ON; SELECT TOP(1) codigo FROM ref.frequencia_nome_versao WHERE status=N'ATIVA';" | tr -d '\r' | xargs)
          test "$ACTIVE_NAME_REFERENCE" = 'CENSO2022_NOMES_BRASIL_V1'
          # Derivado versionado deve existir antes de gerar o corpus e o modelo.
          DOTNET_ENVIRONMENT=Development LinkageParameters__Operation=ENSURE_IBGE_NOMINAL_U_REFERENCE \
            dotnet run --project src/Jornada.Linkage.Parameters.Worker --configuration Release --no-build
          mkdir -p .local/ibge-u-portable
          DOTNET_ENVIRONMENT=Development \
          LinkageParameters__Operation=EXPORT_IBGE_NOMINAL_U_ARTIFACT \
          LinkageParameters__IbgeNominalU__PortableArtifactOutputPath="$PWD/.local/ibge-u-portable/ibge-nominal-u-portable-v1.json" \
            dotnet run --project src/Jornada.Linkage.Parameters.Worker --configuration Release --no-build
          # 4.000 pares preservam cerca de 2.400 pessoas-base TRAIN sob holdout 60/20/20,
          # permitindo amostra m=2.000 sem reutilizar VALIDATION/TEST. O gate de recall
