      - name: Measure physical SQL active-ruleset plus C1 candidates and wrong links for 3 frozen-model 30k corpora
        env:
          DOTNET_ENVIRONMENT: Development
        run: |
          set -euo pipefail
          for seed in 42 43 44; do
            case "$seed" in
              42) root="$PWD/.local/e2-demographic-primary" ;;
              *) root="$PWD/.local/v9-synthetic-seed-$seed" ;;
            esac
            dotnet run --project src/Jornada.Linkage.Evaluation --configuration Release --no-build -- \
              --v9-physical-sql-blocking "$root" \
              "$PWD/.local/e2-demographic-primary/v9-frozen-model.json" \
              "$PWD/.local/v9-sql-physical-seed-$seed.json" "$seed"
          done
          python3 - <<'PY'
          import json, decimal
          from pathlib import Path
          D=decimal.Decimal
          docs=[json.loads(Path(f".local/v9-sql-physical-seed-{seed}.json").read_text(),parse_float=D) for seed in (42,43,44)]
          assert [d["Seed"] for d in docs]==[42,43,44]
          assert len({d["FrozenModelSha256"] for d in docs})==1
          assert len({d["FrozenThresholdLogOdds"] for d in docs})==1
          assert all(d["FrozenSourceSeed"]==42 and d["FrozenSourceInputFingerprint"].upper()==docs[0]["CorpusInputFingerprint"].upper() for d in docs)
          agg=dict(eligible=0, retrieved_true=0, false_candidates=0, accepted_correct=0, accepted_wrong=0)
          # Diagnostic ablations are PRE-REGISTERED and independent of one
          # another. Each row is additional to the same baseline, never a
          # reason to select a SQL policy based on blind TEST results.
          ablation_names=("PERSON_EXACT_PLUS_BIRTH_EXACT",
              "MOTHER_EXACT_PLUS_BIRTH_EXACT",
              "PERSON_EXACT_PLUS_MOTHER_EXACT_ANY_BIRTH",
              "PERSON_PHONETIC_PLUS_BIRTH_EXACT",
              "MOTHER_PHONETIC_PLUS_BIRTH_EXACT",
              "PERSON_AND_MOTHER_PHONETIC_PLUS_BIRTH_EXACT")
          ablation_agg={p:dict(extra_true=0,extra_false=0,extra_tp=0,extra_fp=0) for p in ablation_names}
          ablation_by_seed=[]
          union_search_by_seed=[]
          union_fanout_by_seed=[]
          birth_year_family_by_seed=[]
          eleven_pass_union_by_seed=[]
          three_anchor_residual_by_seed=[]
          mother_prefix3_by_seed=[]
          clustered_m_recall_by_seed=[]
          u_network_bootstrap_by_seed=[]
          loss_by_seed=[]
          parity_by_seed=[]
          sql_support_by_seed=[]
          birth_support_by_seed=[]
          mu_identifiability_by_seed=[]
          cluster_concentration_by_seed=[]
          fanout_by_seed=[]
          for d in docs:
              assert d["Version"]=="V9_PHYSICAL_SQL_ACTIVE_DYNAMIC_PLUS_C1_FULL_CANDIDATE_CENSUS_V1"
              assert d["BlockingPolicy"]=="ACTIVE_LINKAGE_RULESET_SQL_UNION_COMBINED_IDENTITY_CANDIDATES_V1"
              assert d["ActiveRulesetFingerprint"] and d["ActiveRulesetPassCount"]>0
              assert d["Scope"]=="ACTUAL_SQL_ACTIVE_DYNAMIC_PASSES_PLUS_C1_CURRENT_KEYS_NO_ALIAS_HISTORY"
              assert d["ProjectionVersion"]=="BLOCKING_PROJECTION_KEY_PROJECTOR_V4"
              assert d["CorpusPeople"]==30000 and d["OperationalConclusion"]=="NOT_OPERATIONAL_ALIAS_HISTORY_OR_CALIBRATED_TF"
              audit=d["TrainBaseFrequencyAudit"]
              assert audit["Version"]=="V9_SYNTHETIC_BASE_TRAIN_FREQUENCY_AUDIT_V1"
              assert audit["Status"]=="TRAIN_BASE_DISTRIBUTION_ONLY_NO_CONDITIONAL_U_OR_CALIBRATED_TF"
              assert audit["Partition"]=="TRAIN" and audit["CorpusBasePeople"]==30000
              assert 0<audit["TrainingBasePeople"]<30000 and len(audit["Units"])==8
              assert audit["PopulationFrameFingerprint"].upper().startswith(d["CorpusInputFingerprint"].upper()+":")
              assert all(u["TrainingBasePeople"]==audit["TrainingBasePeople"] and u["PresentTrainingBasePeople"]+u["MissingTrainingBasePeople"]==audit["TrainingBasePeople"] and u["BasesCoveredByValuesObservedAtLeastFive"]<=u["PresentTrainingBasePeople"] and 0<=u["ValuesObservedAtLeastFiveBases"]<=u["DistinctValues"] for u in audit["Units"])
              assert {(u["Side"],u["Unit"]) for u in audit["Units"]}=={(side,unit) for side in ("PERSON","MOTHER") for unit in (0,1,2,3)}
              assert [x["Partition"] for x in d["Splits"]]==["TRAIN","VALIDATION","TEST"]
              assert sum(x["SqlCandidateTruePairs"]+x["SqlCandidateFalsePairs"] for x in d["Splits"])==d["SqlCandidatePairsTotal"]
              # SQL TRAIN support is counted on the ACTUAL candidate union,
              # never on proxy negatives, repeated endpoints as base people,
              # or synthetic marginal frequency histogram.
              support=d["TrainSqlNominalSupportAudit"]
              assert support["Version"]=="V9_SQL_TRAIN_CONDITIONED_JOINT_NOMINAL_81_SUPPORT_V1"
              assert support["Status"]=="TRAIN_SQL_CANDIDATE_COUNTS_ONLY_NO_INDEPENDENT_MU_PRIOR_TF_OR_PRODUCTION"
              assert support["Partition"]=="TRAIN"
              train=d["Splits"][0]
              assert support["SqlCandidateM"]==train["SqlCandidateTruePairs"]>0
              assert support["SqlCandidateU"]==train["SqlCandidateFalsePairs"]>0
              assert support["SqlCandidatePairs"]==support["SqlCandidateM"]+support["SqlCandidateU"]
              joint=support["Cells"]
              assert len(joint)==81
              assert {(x["PersonLevel"],x["MotherLevel"]) for x in joint}=={
                  (p,m) for p in range(9) for m in range(9)}
              assert sum(x["MCount"] for x in joint)==support["SqlCandidateM"]
              assert sum(x["UCount"] for x in joint)==support["SqlCandidateU"]
              assert support["CellsWithObservedM"]==sum(x["MCount"]>0 for x in joint)
              assert support["CellsWithObservedU"]==sum(x["UCount"]>0 for x in joint)
              assert support["CellsWithBothMAndU"]==sum(x["MCount"]>0 and x["UCount"]>0 for x in joint)
              assert all(0<=x["DistinctMBasePeople"]<=x["MCount"]
                  and 0<=x["DistinctUBasePairs"]<=x["UCount"]
                  and 0<=x["DistinctUBasePeople"]<=2*x["DistinctUBasePairs"]
                  and (x["UCount"]==0 or x["DistinctUBasePeople"]>=2)
                  for x in joint)
              sql_support_by_seed.append({"seed":d["Seed"],"train":support})
              # Independent Python reconciliation of seven semantic DOB
              # states against both classes of the exact SQL TRAIN union.
              birth=d["TrainSqlBirthSupportAudit"]
              assert birth["Version"]=="V9_SQL_TRAIN_BIRTH_SEMANTIC_AND_BINARY_MU_SUPPORT_V1"
              assert birth["Status"]=="TRAIN_SQL_OBSERVED_BIRTH_COUNTS_NOT_CALIBRATED_MU_PRIOR_ESS_OR_OPERATIONAL"
              assert birth["Partition"]=="TRAIN"
              assert birth["SqlCandidatePairs"]==support["SqlCandidatePairs"]
              assert birth["SqlCandidateM"]==support["SqlCandidateM"]
              assert birth["SqlCandidateU"]==support["SqlCandidateU"]
              assert birth["BirthExactM"]+birth["BirthDifferentM"]==birth["SqlCandidateM"]
              assert birth["BirthExactU"]+birth["BirthDifferentU"]==birth["SqlCandidateU"]
              dob=birth["SemanticCells"]
              dob_states={"EXACT","DAY_MONTH_SWAP","CENTURY_SHIFT",
                  "ONE_DIGIT_ERROR","TWO_DIGIT_ERROR",
                  "PARTIAL_COMPONENT_AGREEMENT","OTHER_DISAGREEMENT"}
              assert len(dob)==7
              assert {x["SemanticBirthState"] for x in dob}==dob_states
              assert sum(x["MCount"] for x in dob)==birth["SqlCandidateM"]
              assert sum(x["UCount"] for x in dob)==birth["SqlCandidateU"]
              exact_birth=next(x for x in dob if x["SemanticBirthState"]=="EXACT")
              assert birth["BirthExactM"]==exact_birth["MCount"]
              assert birth["BirthExactU"]==exact_birth["UCount"]
              assert birth["StatesWithObservedM"]==sum(x["MCount"]>0 for x in dob)
              assert birth["StatesWithObservedU"]==sum(x["UCount"]>0 for x in dob)
              assert birth["StatesWithBothMAndU"]==sum(x["MCount"]>0 and x["UCount"]>0 for x in dob)
              assert all(0<=x["DistinctMBasePeople"]<=x["MCount"]
                  and 0<=x["DistinctUBasePairs"]<=x["UCount"]
                  and 0<=x["DistinctUBasePeople"]<=2*x["DistinctUBasePairs"]
                  and (x["UCount"]==0 or x["DistinctUBasePeople"]>=2) for x in dob)
              birth_support_by_seed.append({"seed":d["Seed"],"train":birth})
              # TRAIN observational cell proportions are arithmetic, not
              # operational FS parameters. Missing support must NOT become
              # neutral BF=1, TF weight=0 or a made-up smoothing constant.
              mu=d["TrainSqlMuIdentifiabilityAudit"]
              assert mu["Version"]=="V9_SQL_TRAIN_MU_EMPIRICAL_IDENTIFIABILITY_NO_WEIGHTS_V1"
              assert mu["Status"]=="INCONCLUSIVE_NO_INDEPENDENT_ESS_PRIOR_TF_VALIDATION_OR_OPERATIONAL_WEIGHTS"
              assert mu["Partition"]=="TRAIN"
              assert mu["MayPromoteModelParameters"] is False
              assert mu["NominalSupportVersion"]==support["Version"]
              assert mu["BirthSupportVersion"]==birth["Version"]
              assert mu["UniqueTrainBasePeople"]==audit["TrainingBasePeople"]
              assert mu["SqlCandidateM"]==support["SqlCandidateM"]
              assert mu["SqlCandidateU"]==support["SqlCandidateU"]
              assert abs(mu["EmpiricalPairMatchShareNotPopulationPrior"]
