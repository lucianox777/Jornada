name: v9-j-compat-offline-tests
on:
  push:
    branches:
      - feat/v9-multiparameter-v2-permanent-witness-20261107
    paths:
      - '.github/workflows/v9-j-compat-offline-tests.yml'
permissions:
  contents: read
jobs:
  j-csharp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Restore locked solution and run compatibility unit tests
        shell: bash
        working-directory: Solution
        run: |
          set -euo pipefail
          dotnet restore Jornada.sln --locked-mode
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-restore \
            --filter 'FullyQualifiedName~V9OptionalCompatibilityParametersTests|FullyQualifiedName~V9MuEstimationSearchSpaceTests' \
            --logger 'console;verbosity=normal'
