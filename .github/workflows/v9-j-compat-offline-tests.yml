name: v9-j-compat-offline-tests
on:
  push:
    branches:
      - feat/v9-multiparameter-v2-permanent-witness-20261107
    paths:
      - '.github/workflows/v9-j-compat-offline-tests.yml'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9OptionalCompatibilityParameters.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9NestedCalibrationCoordinator.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/V9NestedCalibrationCli.cs'
      - 'Solution/tests/Jornada.Tests/Unit/V9OptionalCompatibilityParametersTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/V9MuEstimationSearchSpaceTests.cs'
      - 'Solution/scripts/v9-j-historical-analytic-comparison.py'
      - 'Solution/tests/scripts/test_v9_j_historical_analytic_comparison.py'
permissions:
  contents: read
jobs:
  j-csharp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Restore locked solution and run compatibility unit tests
        shell: bash
        working-directory: Solution
        run: |
          set -euo pipefail
          dotnet restore Jornada.sln --locked-mode
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-restore \
            --filter 'FullyQualifiedName~V9OptionalCompatibilityParametersTests|FullyQualifiedName~V9MuEstimationSearchSpaceTests' \
            --logger 'console;verbosity=normal'
          python3 -m unittest discover -s tests/scripts -p 'test_v9_j_historical_analytic_comparison.py' -v
