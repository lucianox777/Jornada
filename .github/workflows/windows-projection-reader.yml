name: windows-projection-reader

on:
  push:
    paths:
      - 'Solution/tests/Jornada.Tests/Unit/SyntheticCorpusFoundationTests.cs'
      - 'Solution/src/Jornada.Linkage.SyntheticCorpus/IbgeProjectionReader.cs'
      - '.github/workflows/windows-projection-reader.yml'
  pull_request:
    paths:
      - 'Solution/tests/Jornada.Tests/Unit/SyntheticCorpusFoundationTests.cs'
      - 'Solution/src/Jornada.Linkage.SyntheticCorpus/IbgeProjectionReader.cs'
      - '.github/workflows/windows-projection-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection-fixture-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'
      - name: Restore test project
        shell: pwsh
        run: dotnet restore tests/Jornada.Tests/Jornada.Tests.csproj
      - name: Verify projection fixture stream disposal on Windows NTFS
        shell: pwsh
        run: |
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~Projection_reader_verifies_physical_and_canonical_hashes" --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw "Windows projection fixture test failed ($LASTEXITCODE)." }
