name: jornada-dt10-evidence

# Invoked exclusively by the guarded dt10-evidence job in jornada-ci.
# Same GitHub run: dependency-lock artifact is downloaded without rerestoring
# unlocked dependencies; no second CI workflow/runner is dispatched here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dt10-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Solution
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!Sql'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "SQLCMDPASSWORD=$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 20
    env:
      JORNADA_SQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!Sql'
      JORNADA_TEST_SQL_CONNECTION: 'Server=localhost,1433;Database=JornadaSyntheticDev;User Id=sa;Password=Jornada_${{ github.run_id }}!Sql;TrustServerCertificate=true;Encrypt=false'
      JORNADA_DT10_EVIDENCE: '1'
      JORNADA_TEST_SQL_USE_EXISTING_DATABASE: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.112'
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: nuget-lockfiles
          path: Solution/.local/nuget-lock-input
      - name: Restore locked NuGet graph
        run: |
          tar -xzf .local/nuget-lock-input/packages-locks.tar.gz -C .
          dotnet restore Jornada.sln --locked-mode
      - run: dotnet build Jornada.sln --configuration Release --no-restore
      - name: Create isolated DT-10 evidence database
        run: |
          CID=$(docker ps -q --filter publish=1433 | head -1)
          test -n "$CID"
          SQLCMDPASSWORD="$JORNADA_SQL_SA_PASSWORD" docker exec -e SQLCMDPASSWORD "$CID" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -Q "IF DB_ID('JornadaSyntheticDev') IS NULL CREATE DATABASE JornadaSyntheticDev;"
      - name: Execute DT-10 concurrency rollback and plan-volume evidence
        run: |
          mkdir -p .local/test-evidence/dt10
          dotnet test tests/Jornada.Integration.Tests/Jornada.Integration.Tests.csproj --configuration Release --no-build \
            --filter "TestCategory=DT10Evidence" \
            --results-directory "$PWD/.local/test-evidence/dt10/results" \
            --logger "trx;LogFileName=$PWD/.local/test-evidence/dt10/dt10.trx"
          python3 scripts/test-evidence-gate.py .local/test-evidence/dt10/dt10.trx \
            --forbid-skipped --minimum-tests 4 --summary .local/test-evidence/dt10/summary.json
          find . -type f -name 'dt10-plan-volume-*.json' -exec cp {} .local/test-evidence/dt10/ \;
      - name: Upload DT-10 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dt10-evidence
          path: Solution/.local/test-evidence/dt10
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
