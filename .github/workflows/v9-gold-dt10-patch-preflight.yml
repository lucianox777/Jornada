name: v9-gold-dt10-patch-preflight
# One-shot diagnostic branch. Never execute production SQL or Gold trials.
on:
  push:
    branches:
      - fix/v9-gold-dt10-patch-preflight-20261024
    paths:
      - '.github/workflows/v9-gold-dt10-patch-preflight.yml'
      - 'Solution/src/Jornada.Linkage.Runner/Program.cs'
      - 'Solution/src/Jornada.Linkage.Runner/V9GoldDisposableLowerProcedurePatch.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owned-localdb-dt10:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: Solution/global.json
      - name: Find Windows LocalDB without operational fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue
          if (-not $binary) {
            $root = Join-Path $env:ProgramFiles 'Microsoft SQL Server'
            if (Test-Path -LiteralPath $root) {
              $binary = Get-ChildItem -LiteralPath $root -Filter SqlLocalDB.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            }
          }
          if (-not $binary) { throw 'LocalDB unavailable; abort.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Split-Path -Parent $(if ($binary.Source) { $binary.Source } else { $binary.FullName }))
          & $(if ($binary.Source) { $binary.Source } else { $binary.FullName }) info
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB info failed.' }
      - name: Test canonical DT10 patch on fresh owned LocalDB (read-only module probe)
        shell: pwsh
        working-directory: Solution
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build src/Jornada.Linkage.Runner/Jornada.Linkage.Runner.csproj -c Release
          $runner = Join-Path $PWD 'src/Jornada.Linkage.Runner/bin/Release/net10.0/Jornada.Linkage.Runner.dll'
          $db = Join-Path $env:RUNNER_TEMP 'v9-gold-dt10-probe-owned-localdb'
          dotnet $runner --v9-gold-harness-create $db "$PWD/database"
          $ready = Get-Content (Join-Path $db 'schema-ready.json') -Raw | ConvertFrom-Json
          if ($ready.completed -ne $true -or $ready.database -ne 'JornadaHarness' -or
              $ready.instance -cnotmatch '^JornadaV9Gold[0-9]{8}_[a-f0-9]{8}$') {
            throw 'Fresh disposable LocalDB manifest invalid'
          }
          $env:ConnectionStrings__Jornada = "Server=(localdb)\$($ready.instance);Database=JornadaHarness;Integrated Security=true;Encrypt=Optional"
          dotnet $runner --v9-gold-dt10-patch-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Disposable canonical DT10 patch preflight failed' }
