name: v9-http-volume-10k-e2e-technical

# Physical 10k stage proof SUCCESS 42542220115. Re-run only by explicit human
# workflow_dispatch from protected master, never by branch or master push.
# No ZIP/CPF/JSONL artifacts. This does not alter 30k master push policy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v9-http-10k-${{ github.ref }}
  cancel-in-progress: false

jobs:
  http-to-serving-10k:
    name: "HTTP 10k synthetic: 10 deliveries, Bronze, Silver, Gold, Serving (DEV)"
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Exact stage SHA and event guard
        run: |
          set -euo pipefail
          test "$(git -C .. rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/master
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.113'
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Test disjoint synthetic 10k identities and limits offline
        run: python3 -m unittest discover -s tests/scripts -p test_v9_http_volume_fixture.py -v
      - name: Lock NuGet graph before SQL workload
        run: ./scripts/nuget-lock-bootstrap.sh
      - name: Execute 10 x 1000 real HTTP ingestion batches and original small E2Es
        timeout-minutes: 135
        env:
          JORNADA_E2E_LOCKED_RESTORE: 'true'
          JORNADA_E2E_CONSOLE_ZIP: 'false'
          JORNADA_E2E_HTTP_VOLUME_COUNT: '10000'
          JORNADA_E2E_STATUS_POLL_SECONDS: '4'
        run: python3 scripts/jornada-runner.py --profile e2e --allow-reset e2e
      - name: Fail unless exact 10k SQL chain and per-batch timing exists
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path(".local/e2e/http-volume-10k-summary.json").read_text())
          assert d["status"]=="PASS" and d["commitSha"]==os.environ["GITHUB_SHA"]
          assert d["seed"]==355 and d["batchCount"]==10
          assert d["personCount"]==10000 and d["uniqueCpfCount"]==10000
          assert d["deliveryCount"]==10 and d["bronzeFiles"]==10
          assert d["silverPersons"]==10000 and d["silverRecords"]==10000
          assert d["processedItems"]==20000 and d["goldPersons"]==10000
          assert d["servingRecords"]==10000 and d["idempotentReplaysValidated"]==2
          assert len(d["batches"])==10 and d["httpPostP95MsTenBatches"]>0
          assert d["perPersonHttpP95Ms"] is None and not d["activated"]
          print("PASS: 10x1k deliveries reconciled; per-person p95 intentionally not measured.")
          PY
      - name: Upload aggregate metrics only (no fixture, ZIP or identity data)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v9-http-volume-10k-summary-${{ github.sha }}
          path: Solution/.local/e2e/http-volume-10k-summary.json
          retention-days: 30
          if-no-files-found: warn
      - name: Always delete disposable SQL and Docker volumes
        if: always()
        run: docker compose --env-file .env down -v || true
