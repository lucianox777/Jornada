name: jornada-postgresql-regression-fix

on:
  push:
    branches:
      - work/postgresql-persistence-review
    paths:
      - .github/workflows/postgresql-regression-fix.yml

permissions:
  contents: write

jobs:
  apply-reviewed-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Reuse serializer options and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Solution/scripts/postgresql-processor-regression.cs')
          text = path.read_text(encoding='utf-8')
          old = 'var cases = new List<string>();'
          new = 'var jsonOptions = new JsonSerializerOptions { WriteIndented = true };\n' + old
          assert text.count(old) == 1
          assert text.count('new JsonSerializerOptions { WriteIndented = true }') == 2
          text = text.replace(old, new, 1)
          text = text.replace('new JsonSerializerOptions { WriteIndented = true }));', 'jsonOptions));')
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/postgresql-regression-fix.yml
          git add Solution/scripts/postgresql-processor-regression.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: reuse JSON serialization options in PostgreSQL regression'
          git push origin HEAD:refs/heads/work/postgresql-persistence-review
