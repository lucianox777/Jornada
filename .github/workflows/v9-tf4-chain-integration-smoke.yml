name: V9 TF4 mandatory TRAIN-AUDIT-VALIDATION cross-job integration (synthetic only)

# Fast real GitHub-hosted job/artifact integration. This workflow NEVER runs
# --v9-calibrate, scientific AUDIT, VALIDATION holdout, or physical TEST.
# The mock VALIDATION result controls the TEST job. It uses only fixture receipts.
on:
  pull_request:
    paths:
      - '.github/workflows/v9-v3-four-name-100k.yml'
      - '.github/workflows/v9-tf4-chain-integration-smoke.yml'
      - 'Solution/scripts/v9-v3-four-name-100k-preaudit.py'
      - 'Solution/scripts/v9-tf4-chain-integration-smoke.py'
      - 'Solution/tests/scripts/test_v9_tf4_chain_integration.py'
  workflow_dispatch:
    inputs:
      synthetic_winner:
        description: "Simulate VALIDATION selecting a winner and require the mock TEST job"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  train-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned v4
        with:
          persist-credentials: false
      - name: Verify mandatory-chain and tamper-fail contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_tf4_chain_integration.py -v
          python3 -m unittest discover -s Solution/tests/scripts -p test_v9_v3_four_name_100k_preaudit.py -v
      - name: Produce fake TRAIN metadata and real hash-checked preaudit bundle
        run: |
          set -euo pipefail
          python3 Solution/scripts/v9-tf4-chain-integration-smoke.py train \
            --source "$RUNNER_TEMP/v9-train-synthetic" \
            --handoff "$GITHUB_WORKSPACE/.local/v9-tf4-cross-job/preaudit" \
            --code-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Transfer the same pinned preaudit artifact format as the physical TRAIN
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-synthetic-preaudit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/v9-tf4-cross-job/preaudit/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  audit-fixture:
    needs: train-fixture
    if: ${{ always() && !cancelled() && needs.train-fixture.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - name: Download and verify TRAIN's real immutable artifact structure
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned
        with:
          name: v9-synthetic-preaudit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/v9-tf4-cross-job/preaudit/
      - name: Check origin SHA, run ID and byte hashes; create non-scientific audit bridge
        run: |
          set -euo pipefail
          python3 Solution/scripts/v9-tf4-chain-integration-smoke.py audit \
            --handoff "$GITHUB_WORKSPACE/.local/v9-tf4-cross-job/preaudit" \
            --audit "$GITHUB_WORKSPACE/.local/v9-tf4-cross-job/audit" \
            --code-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Transfer synthetic audit receipt (not scientific PASS)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-synthetic-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/v9-tf4-cross-job/audit/
          if-no-files-found: error
          retention-days: 2

  validation-fixture:
    needs: audit-fixture
    if: ${{ always() && !cancelled() && needs.audit-fixture.result == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      has_winner: ${{ steps.winner.outputs.has_winner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - name: Download independently transferred TRAIN evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned
        with:
          name: v9-synthetic-preaudit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/v9-tf4-cross-job/preaudit/
      - name: Download independently transferred AUDIT receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned
        with:
          name: v9-synthetic-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/v9-tf4-cross-job/audit/
      - name: Verify cross-job SHA consistency, simulated status and strict file lists
        run: |
          set -euo pipefail
          python3 Solution/scripts/v9-tf4-chain-integration-smoke.py validation \
            --handoff "$GITHUB_WORKSPACE/.local/v9-tf4-cross-job/preaudit" \
            --audit "$GITHUB_WORKSPACE/.local/v9-tf4-cross-job/audit" \
            --code-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          echo "V9_TRAIN_AUDIT_VALIDATION_CHAIN_INTEGRATION_SUCCESS"

      - name: Issue mock VALIDATION receipt and decision
        id: winner
        env:
          FIXTURE_HAS_WINNER: ${{ github.event_name == 'pull_request' || inputs.synthetic_winner }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/synthetic-validation-e2e.json" <<'PY'
          import json,os,runpy,sys
          from pathlib import Path
          fixture=runpy.run_path("Solution/tests/scripts/test_v9_tf4_e2e_closeout.py")
          has_winner=os.environ["FIXTURE_HAS_WINNER"] == "true"
          body=fixture["validation_doc"](fixture["W"] if has_winner else None)
          Path(sys.argv[1]).write_text(json.dumps(body),encoding="utf-8")
          PY
          echo "has_winner=$FIXTURE_HAS_WINNER" >> "$GITHUB_OUTPUT"
      - name: Transfer mock VALIDATION receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-synthetic-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-validation-e2e.json
          if-no-files-found: error
          retention-days: 2

  test-fixture:
    needs: validation-fixture
    if: ${{ always() && !cancelled() && needs.validation-fixture.result == 'success' && needs.validation-fixture.outputs.has_winner == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - name: Produce an aggregate fixture receipt
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/synthetic-test"
          python3 - "$RUNNER_TEMP/synthetic-test/independent-test.json" <<'PY'
          import json,runpy,sys
          from pathlib import Path
          fixture=runpy.run_path("Solution/tests/scripts/test_v9_tf4_e2e_closeout.py")
          Path(sys.argv[1]).write_text(json.dumps(fixture["standard_test_doc"]()),encoding="utf-8")
          PY
          (cd "$RUNNER_TEMP/synthetic-test" && sha256sum independent-test.json > SHA256SUMS)
      - name: Transfer aggregate fixture evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-synthetic-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-test/
          if-no-files-found: error
          retention-days: 2

  e2e-fixture-closeout:
    needs: [train-fixture, audit-fixture, validation-fixture, test-fixture]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      FIXTURE_HAS_WINNER: ${{ needs.validation-fixture.outputs.has_winner }}
      PHYSICAL_RESULT: ${{ needs.train-fixture.result }}
      AUDIT_RESULT: ${{ needs.audit-fixture.result }}
      VALIDATION_RESULT: ${{ needs.validation-fixture.result }}
      TEST_RESULT: ${{ needs.test-fixture.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned
        with:
          name: v9-synthetic-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - if: ${{ needs.test-fixture.result == 'success' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned
        with:
          name: v9-synthetic-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-test
      - name: Verify strict CLOSEOUT on actual fixture job results
        run: |
          set -euo pipefail
          extra=()
          preparation=skipped
          if [[ "$FIXTURE_HAS_WINNER" == "true" ]]; then
            preparation=success
            extra+=(--test-file "$RUNNER_TEMP/synthetic-test/independent-test.json")
          fi
          python3 Solution/scripts/v9-tf4-e2e-closeout.py \
            --physical "$PHYSICAL_RESULT" --audit "$AUDIT_RESULT" \
            --validation "$VALIDATION_RESULT" --preparation "$preparation" \
            --test "$TEST_RESULT" --test-requested "$FIXTURE_HAS_WINNER" --strict-test \
            --validation-file "$RUNNER_TEMP/synthetic-validation-e2e.json" "${extra[@]}" \
            --code-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --out "$RUNNER_TEMP/synthetic-e2e-status.json"
          python3 - "$RUNNER_TEMP/synthetic-e2e-status.json" "$FIXTURE_HAS_WINNER" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          if sys.argv[2] == "true":
              assert r["independentTestReportStatus"] == "VERIFIED"
              assert r["winnerSha256"] == "a"*64
          else:
              assert r["status"] == "E2E_PHYSICAL_CORE_FINISHED_NO_WINNER_TEST_NOT_REQUESTED"
              assert r["winnerSha256"] is None and r["testResult"] == "skipped"
          assert not r["certified"] and not r["activated"] and not r["productionPublication"]
          print("V9_SYNTHETIC_GITHUB_E2E_CLOSEOUT_CONTRACT_PASS_NOT_PHYSICAL_NOT_TEST")
          PY
