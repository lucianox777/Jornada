name: v9-standard-linear-contract-ci

on:
  pull_request:
    paths:
      - '.github/workflows/v9-standard-linear-100k.yml'
      - '.github/workflows/v9-standard-linear-contract-ci.yml'
      - 'Solution/scripts/v9-standard-prepare-handoff.py'
      - 'Solution/tests/scripts/test_v9_standard_*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: "V9 standard: syntax and PREPARE transfer contract (no physical TRAIN)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - name: Validate GitHub Actions YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'PyYAML==6.0.2'
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for filename in (
              ".github/workflows/v9-standard-linear-100k.yml",
              ".github/workflows/v9-standard-linear-contract-ci.yml",
          ):
              parsed = yaml.safe_load(Path(filename).read_text(encoding="utf-8"))
              assert isinstance(parsed, dict) and isinstance(parsed.get("jobs"), dict)
              assert len(parsed["jobs"]) > 0
              print(f"YAML_VALID {filename}")
          PY
      - name: Execute standard linear and transfer unit tests
        working-directory: Solution
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/scripts -p 'test_v9_standard_*.py' -v
          python3 -m py_compile scripts/v9-standard-prepare-handoff.py

  prepare-transfer-smoke:
    name: "PREPARE smoke: upload synthetic fixture artifact"
    needs: contract-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - name: Create fixture and package using production handoff script
        working-directory: Solution
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v9-prepare-smoke"
          mkdir -p "$root/people-100k" "$root/prepare-transfer"
          printf 'fixture-only-not-100k\n' > "$root/people-100k/observacoes.csv"
          python3 scripts/v9-standard-prepare-handoff.py pack --root "$root" --out "$root/prepare-transfer/train-inputs.tar.gz"
          printf '%s' "$GITHUB_SHA" > "$root/prepare-transfer/code-sha.txt"
          printf '%s' "$GITHUB_RUN_ID" > "$root/prepare-transfer/run-id.txt"
          (cd "$root/prepare-transfer" && sha256sum train-inputs.tar.gz code-sha.txt run-id.txt > SHA256SUMS)
      - name: Upload artifact across job boundary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-standard-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v9-prepare-smoke/prepare-transfer/
          if-no-files-found: error
          retention-days: 1

  train-transfer-smoke:
    name: "TRAIN smoke: download and verify PREPARE artifact"
    needs: prepare-transfer-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - name: Download immutable artifact in independent runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # pinned
        with:
          name: v9-standard-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v9-train-smoke/prepare-transfer
      - name: Verify provenance and extract with production handoff script
        working-directory: Solution
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/v9-train-smoke"
          transfer="$root/prepare-transfer"
          (cd "$transfer" && sha256sum -c SHA256SUMS)
          test "$(cat "$transfer/code-sha.txt")" = "$GITHUB_SHA"
          test "$(cat "$transfer/run-id.txt")" = "$GITHUB_RUN_ID"
          python3 scripts/v9-standard-prepare-handoff.py unpack --root "$root" --archive "$transfer/train-inputs.tar.gz"
          test "$(cat "$root/people-100k/observacoes.csv")" = 'fixture-only-not-100k'
          echo "V9_PREPARE_TRAIN_CROSS_JOB_HANDOFF_SMOKE_PASS"
