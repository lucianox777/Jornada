name: DT-05 Real Runner CPF Late E2E

on:
  pull_request:
    paths:
      - '.github/workflows/dt05-cpf-late-e2e.yml'
      - 'Solution/scripts/dt05-cpf-late-wave.ps1'
      - 'Solution/scripts/local-e2e.ps1'
      - 'Solution/docs/DT05_Assinatura_Semantica_V1.md'
      - 'Solution/docs/Dividas_Tecnicas.md'
      - 'Solution/docs/evidence/E2E_*_Baseline_*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dt05-three-waves:
    name: Synthetic Bronze to Runner, three waves
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Solution
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.112'
      - name: Prepare isolated synthetic database configuration
        shell: bash
        env:
          JORNADA_SQL_SA_PASSWORD: 'Jornada_${{ github.run_id }}!Sql'
        run: |
          set -euo pipefail
          command -v pwsh
          command -v docker
          command -v dotnet
          command -v curl
          command -v python3
          mkdir -p .local/dt05-bin
          ln -s "$(command -v curl)" .local/dt05-bin/curl.exe
          ln -s "$(command -v python3)" .local/dt05-bin/python
          echo "$PWD/.local/dt05-bin" >> "$GITHUB_PATH"
          printf 'JORNADA_SQL_SA_PASSWORD=%s\nJORNADA_SQL_PORT=14333\nJORNADA_SQL_DATABASE=JornadaSyntheticDev\n' "$JORNADA_SQL_SA_PASSWORD" > .env
          chmod 600 .env
      - name: Three real Runner waves with actual synthetic late-CPF ingestion
        shell: pwsh
        run: ./scripts/local-e2e.ps1 -VerifyLinkageRunner -Dt05CpfLate -AllowSyntheticReset
      - name: Upload three-wave evidence, SQL assertions and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dt05-cpf-late-e2e-evidence
          path: |
            Solution/.local/e2e/dt05-cpf-late-evidence.json
            Solution/.local/e2e/api.log
            Solution/.local/e2e/api.err.log
            Solution/.local/e2e/processor.log
            Solution/.local/e2e/processor.err.log
          if-no-files-found: warn
          retention-days: 30
      - name: Stop isolated test SQL Server
        if: always()
        shell: bash
        run: |
          if [ -f .env ]; then docker compose --env-file .env down -v || true; fi
          rm -f .env
