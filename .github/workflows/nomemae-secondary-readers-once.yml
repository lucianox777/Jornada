name: nomemae-secondary-readers-once

on:
  push:
    paths:
      - '.github/workflows/nomemae-secondary-readers-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/nome-mae-nullable-v3
          fetch-depth: 0
      - name: Apply nullable secondary-reader patch
        run: python3 Solution/scripts/patch-nomemae-nullable-secondary-readers-once.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Solution/src/Jornada.Api/SqlApiServices.cs Solution/src/Jornada.Processor.Worker/BlockingProjectionPersistence.cs Solution/src/Jornada.Linkage.Parameters.Worker/PostgreSqlCandidateSampler.cs Solution/src/Jornada.Linkage.Parameters.Worker/PostgreSqlCandidateUniverse.cs
          git diff --cached --quiet && exit 0
          git commit -m "fix: aceita nomeMae NULL em projeções e blocking"
          git push origin HEAD:feat/nome-mae-nullable-v3
