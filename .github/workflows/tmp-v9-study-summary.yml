name: tmp-v9-study-summary
# Temporary, read-only: inspect seed42 frozen source artifact (run 41900357031). No merge. Delete after use.
on:
  push:
    branches: [tmp/v9-study-summary-41681714081]
permissions:
  actions: read
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download artifact inside GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p art && cd art
          gh run download 41900357031 -R "$GITHUB_REPOSITORY" -n v9-tf-45-physical-41900357031-935f704edd2bceb6a125ecfe532ad5b71f9c89b9
          find . -type f | wc -l
          find . -type f ! -name '*.fitted.json' -printf '%s\t%p\n' | sort -k2
          sha256sum $(find . -type f ! -name '*.fitted.json' | sort)
          find . -name '*.fitted.json' | wc -l
      - name: Inspect (metadata only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, hashlib, os
          study = glob.glob('art/**/study-tf/study.json', recursive=True)[0]; d = os.path.dirname(study)
          s = json.load(open(study, encoding='utf-8'))
          print("STUDY", study, hashlib.sha256(open(study,'rb').read()).hexdigest())
          print("KEYS", list(s.keys()))
          fc = s.get('FrozenConfigurations') or []
          print("FROZEN_CONFIGS", len(fc))
          if fc: print("FC0 KEYS", list(fc[0].keys()), "SNAP KEYS", list(fc[0]['Snapshot'].keys()), "PAYLOAD KEYS", list(fc[0]['Snapshot']['Payload'].keys()))
          for c in fc:
              oid = c['OptionId'][65:]
              if oid in ('T0.95_TF0', 'TF_ONE_MF_W1_M0_A0.5_T0.95'):
                  p = c['Snapshot']['Payload']; sha = c['Snapshot']['ContentSha256']
                  f = os.path.join(d, sha + '.fitted.json')
                  fsha = hashlib.sha256(open(f,'rb').read()).hexdigest() if os.path.exists(f) else None
                  print("SNAP", json.dumps({k: v for k, v in c.items() if k != 'Snapshot' and not isinstance(v,(dict,list))}), sha, "file_sha", fsha,
                        json.dumps({k: p.get(k) for k in ('Threshold','TfWeight','ConflictMargin','ProjectionFingerprintSha256')}))
          pl = json.load(open(os.path.join(d, 'plan.json'), encoding='utf-8'))
          print("PLAN KEYS", list(pl.keys()))
          for k in ('Execution','MaximumAcceptedPerBaseIdentity','ObservationCapDeclaration','ConflictMargins','Thresholds','PinnedIbgeReferenceVersionId','PinnedIbgeBootstrap','SelectionPolicy','Budget','Seed'):
              if k in pl: print("PLAN", k, json.dumps(pl[k])[:3000])
          pt = glob.glob('art/**/plan-tf.json', recursive=True)[0]
          print("PLAN_TF_SHA", hashlib.sha256(open(pt,'rb').read()).hexdigest())
          sm = s.get('SourceMeasurements') or []
          if sm: print("SM KEYS", list(sm[0].keys()))
          PY
