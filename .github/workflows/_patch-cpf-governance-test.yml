name: patch-cpf-governance-test

on:
  push:
    branches:
      - work/cpf-anchor-governed-correction
    paths:
      - .github/workflows/_patch-cpf-governance-test.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/cpf-anchor-governed-correction
          persist-credentials: true
      - name: Patch legacy atomicity fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Solution/tests/Jornada.Integration.Tests/Integration/IdentityGovernanceTests.cs')
          text = path.read_text(encoding='utf-8')

          old = '''        await SqlBatchRunner.ExecuteFileAsync(connection, Path.Combine(databaseDir, "Jornada_Fase1.sql"));
        await SqlBatchRunner.ExecuteFileAsync(connection, Path.Combine(databaseDir, "Jornada_Seed_Dev.sql"));

        const string cpf = "11144477735";
        long mapId;
'''
          new = '''        await SqlBatchRunner.ExecuteFileAsync(connection, Path.Combine(databaseDir, "Jornada_Fase1.sql"));
        await SqlBatchRunner.ExecuteFileAsync(connection, Path.Combine(databaseDir, "Jornada_Seed_Dev.sql"));
        await SqlBatchRunner.ExecuteFileAsync(connection, Path.Combine(databaseDir, "migrations", "20260907_Cpf_Ancora.sql"));

        const string cpf = "11144477735";
        long mapId;
        Guid anchorUuid;
'''
          if text.count(old) != 1:
              raise SystemExit(f'bootstrap alvo não único: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            map.CommandText = "SELECT TOP(1) identity_map_id,estado,estado_motivo,estado_em FROM identidade.identity_map WHERE tipo='CPF' AND identificador=@cpf AND vigencia_fim IS NULL;";
            map.Parameters.AddWithValue("@cpf", cpf);
            await using var reader = await map.ExecuteReaderAsync(); Assert.That(await reader.ReadAsync(), Is.True);
            mapId = reader.GetInt64(0); originalState = reader.GetString(1);
            originalReason = reader.IsDBNull(2) ? null : reader.GetString(2);
            originalStateAt = reader.IsDBNull(3) ? null : reader.GetDateTimeOffset(3);
'''
          new = '''            map.CommandText = """
                SELECT TOP(1) m.identity_map_id,m.estado,m.estado_motivo,m.estado_em,a.pessoa_uuid
                FROM identidade.identity_map m
                JOIN identidade.cpf_ancora a
                  ON a.cpf=CONVERT(CHAR(11),m.identificador) COLLATE Latin1_General_100_BIN2
                WHERE m.tipo='CPF' AND m.identificador=@cpf AND m.vigencia_fim IS NULL;
                """;
            map.Parameters.AddWithValue("@cpf", cpf);
            await using var reader = await map.ExecuteReaderAsync(); Assert.That(await reader.ReadAsync(), Is.True);
            mapId = reader.GetInt64(0); originalState = reader.GetString(1);
            originalReason = reader.IsDBNull(2) ? null : reader.GetString(2);
            originalStateAt = reader.IsDBNull(3) ? null : reader.GetDateTimeOffset(3);
            anchorUuid = reader.GetGuid(4);
'''
          if text.count(old) != 1:
              raise SystemExit(f'query mapa alvo não única: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''        var groups = JsonSerializer.Serialize(new[] { new { grupoCodigo = "NOVO", pessoaUuidDestino = (Guid?)null, pessoaObservacaoIds = observations.ToArray() } });'''
          new = '''        var groups = JsonSerializer.Serialize(new[] { new { grupoCodigo = "ANCORA", pessoaUuidDestino = (Guid?)anchorUuid, pessoaObservacaoIds = observations.ToArray() } });'''
          if text.count(old) != 1:
              raise SystemExit(f'grupo alvo não único: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''            apply.Parameters.AddWithValue("@grupo_titular", "NOVO"); apply.Parameters.AddWithValue("@grupos_json", groups);'''
          new = '''            apply.Parameters.AddWithValue("@grupo_titular", "ANCORA"); apply.Parameters.AddWithValue("@grupos_json", groups);'''
          if text.count(old) != 1:
              raise SystemExit(f'titular alvo não único: {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''                Assert.That(peopleAfter, Is.EqualTo(peopleBefore), "UUID novo criado antes da falha deve ser revertido.");'''
          new = '''                Assert.That(peopleAfter, Is.EqualTo(peopleBefore), "Falha injetada não pode alterar o conjunto de Pessoas.");'''
          if text.count(old) != 1:
              raise SystemExit(f'assert alvo não único: {text.count(old)}')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- Solution/tests/Jornada.Integration.Tests/Integration/IdentityGovernanceTests.cs
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'jornada-ci'
          git config user.email 'jornada-ci@users.noreply.github.com'
          git add Solution/tests/Jornada.Integration.Tests/Integration/IdentityGovernanceTests.cs
          git commit -m 'test: preservar âncora no cenário de atomicidade CPF'
          git push origin HEAD:work/cpf-anchor-governed-correction
