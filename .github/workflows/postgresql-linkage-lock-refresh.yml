name: jornada-postgresql-linkage-lock-refresh
on:
  push:
    branches: [work/postgresql-linkage-v2-candidate-universe]
    paths:
      - 'Solution/scripts/nuget-lock-refresh.py'
      - '.github/workflows/postgresql-linkage-lock-refresh.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: linkage-lock-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/work/postgresql-linkage-v2-candidate-universe'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: Solution
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Regenerate and verify the locked graph
        run: python3 scripts/nuget-lock-refresh.py
      - name: Commit only validated locks and provenance
        env:
          JORNADA_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -- '**/packages.lock.json' config/release/nuget-lock-provenance.json
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines()
          assert paths and all(p.endswith('/packages.lock.json') or p == 'config/release/nuget-lock-provenance.json' for p in paths), paths
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: regenerate PR32 project-reference locks with SDK 8.0.424'
          ASKPASS="$RUNNER_TEMP/jornada-gh-askpass.sh"
          printf '%s\n' '#!/usr/bin/env bash' 'case "$1" in *Username*) printf "%s\n" x-access-token;; *Password*) printf "%s\n" "$JORNADA_PUSH_TOKEN";; *) exit 1;; esac' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$ASKPASS" git -c credential.helper= push origin HEAD:refs/heads/work/postgresql-linkage-v2-candidate-universe
          rm -f "$ASKPASS"
      - name: Upload refresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: postgresql-linkage-lock-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: Solution/.local/nuget-lock-refresh/
          retention-days: 30
          if-no-files-found: warn
