name: jornada-windows-production-installer

on:
  push:
    paths:
      - 'Solution/install/windows-production/**'
      - 'Solution/clients/Jornada.Integrador.CSharp/**'
      - 'Solution/tests/Jornada.Integrador.Tests/**'
      - 'Solution/src/Jornada.Api/**'
      - 'Solution/src/Jornada.Resultado.Api/**'
      - 'Solution/src/Jornada.Processor.Worker/**'
      - 'Solution/src/Jornada.Operations.Maintenance.Worker/**'
      - 'Solution/src/Jornada.Bronze.Maintenance.Worker/**'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/**'
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Linkage.Conference/**'
      - 'Solution/config/linkage/**'
      - 'Solution/database/Jornada_Fase1.sql'
      - 'Solution/database/Jornada_Fase1_v3.70.sql'
      - 'Solution/database/Jornada_Identidade_Progressiva.sql'
      - 'Solution/database/migrations/**'
      - 'Solution/scripts/schema-manifest.py'
      - '.github/workflows/windows-production-installer.yml'
  pull_request:
    paths:
      - 'Solution/install/windows-production/**'
      - 'Solution/clients/Jornada.Integrador.CSharp/**'
      - 'Solution/tests/Jornada.Integrador.Tests/**'
      - 'Solution/src/Jornada.Api/**'
      - 'Solution/src/Jornada.Resultado.Api/**'
      - 'Solution/src/Jornada.Processor.Worker/**'
      - 'Solution/src/Jornada.Operations.Maintenance.Worker/**'
      - 'Solution/src/Jornada.Bronze.Maintenance.Worker/**'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/**'
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Linkage.Conference/**'
      - 'Solution/config/linkage/**'
      - 'Solution/database/Jornada_Fase1.sql'
      - 'Solution/database/Jornada_Fase1_v3.70.sql'
      - 'Solution/database/Jornada_Identidade_Progressiva.sql'
      - 'Solution/database/migrations/**'
      - 'Solution/scripts/schema-manifest.py'
      - '.github/workflows/windows-production-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-production-bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Solution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'

      - name: Parse production PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem install/windows-production -Filter *.ps1 -File
          foreach ($file in $files) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${($file.Name)}: $($_.Message)" }
              throw "PowerShell inválido: $($file.Name)"
            }
          }
          Write-Host "PowerShell parse: OK ($($files.Count) scripts)"

      - name: Validate canonical schema manifest
        shell: pwsh
        run: |
          python scripts/schema-manifest.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore and run C# integrator contract tests
        shell: pwsh
        run: |
          dotnet restore tests/Jornada.Integrador.Tests/Jornada.Integrador.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Jornada.Integrador.Tests/Jornada.Integrador.Tests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Jornada.Integrador.Tests/Jornada.Integrador.Tests.csproj -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows production bundle
        shell: pwsh
        run: |
          .\install\windows-production\Build-WindowsProductionBundle.ps1 -OutputDirectory "$PWD\.local\windows-production-bundle"

      - name: Verify canonical schema payload in bundle
        shell: pwsh
        run: |
          $root = "$PWD\.local\windows-production-bundle"
          $ddl = Join-Path $root 'database\Jornada_Fase1.sql'
          $bundleManifest = Join-Path $root 'database\migrations\manifest.txt'
          if (-not (Test-Path -LiteralPath $ddl)) { throw 'DDL achatado ausente no bundle.' }
          if (-not (Test-Path -LiteralPath $bundleManifest)) { throw 'Manifesto de schema ausente no bundle.' }
          if (Select-String -LiteralPath $ddl -Pattern '^\s*:r\s+' -Quiet) { throw 'DDL do bundle ainda contém diretiva sqlcmd :r.' }
          foreach ($token in @(
            'Jornada.SolutionSchema',
            'ref.frequencia_nome_versao',
            'identidade.linkage_quality_estimate',
            'serving.v_bi_qualidade_resolucao_operacional',
            'identidade.tr_modelo_linkage_promotion_contract'
          )) {
            if (-not (Select-String -LiteralPath $ddl -SimpleMatch $token -Quiet)) { throw "DDL do bundle não contém contrato: $token" }
          }
          $sourceManifest = (Get-Content -Raw -Encoding UTF8 'database\migrations\manifest.txt').Replace("`r`n","`n")
          $bundledManifest = (Get-Content -Raw -Encoding UTF8 $bundleManifest).Replace("`r`n","`n")
          if ($sourceManifest -ne $bundledManifest) { throw 'Manifesto empacotado diverge do manifesto canônico.' }
          foreach ($raw in Get-Content -Encoding UTF8 $bundleManifest) {
            $entry = ($raw -split '#', 2)[0].Trim()
            if ([string]::IsNullOrWhiteSpace($entry)) { continue }
            $path = Join-Path (Join-Path $root 'database') ($entry.Replace('/','\'))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Fonte do manifesto ausente no bundle: $entry" }
          }
          Write-Host 'Schema canônico do bundle: OK'

      - name: Prove CLI help aliases from published executable
        shell: pwsh
        run: |
          $exe = "$PWD\.local\windows-production-bundle\clients\Jornada.Integrador\Jornada.Integrador.CSharp.exe"
          foreach ($arg in @('/help','--help','-h')) {
            $output = & $exe $arg | Out-String
            if ($LASTEXITCODE -ne 0) { throw "$arg retornou $LASTEXITCODE" }
            if ($output -notmatch '--enviar-todos' -or $output -notmatch '--resultado') { throw "$arg não exibiu help completo" }
          }

      - name: Validate installer against generated production bundle
        shell: pwsh
        run: |
          $config = Get-Content -Raw install/windows-production/Jornada.Production.example.json | ConvertFrom-Json
          $config.installationRoot = 'C:\Jornada-CI'
          $config.dataRoot = 'C:\Jornada-CI-Data'
          $config.sql.mode = 'External'
          $config.sql.connectionString = 'Server=localhost;Database=Jornada;Integrated Security=true;Encrypt=true;TrustServerCertificate=false'
          $config.sql.initializeDatabase = $false
          $config.integrator.enabled = $false
          foreach ($task in $config.tasks) { $task.enabled = $false }
          $ciConfig = "$PWD\.local\Jornada.Production.ci.json"
          $config | ConvertTo-Json -Depth 30 | Set-Content -Encoding UTF8 $ciConfig
          .\install\windows-production\Install-JornadaProduction.ps1 `
            -ConfigPath $ciConfig `
            -PayloadRoot "$PWD\.local\windows-production-bundle" `
            -ValidateOnly

      - name: Validate canonical cluster profiles and installer
        shell: pwsh
        run: |
          .\install\windows-production\Install-JornadaCluster.ps1 `
            -ConfigPath .\install\windows-production\Jornada.Cluster.Test.json `
            -PayloadRoot "$PWD\.local\windows-production-bundle" `
            -NodeId NODE1 `
            -ValidateOnly

          .\install\windows-production\Install-JornadaCluster.ps1 `
            -ConfigPath .\install\windows-production\Jornada.Cluster.Production.example.json `
            -PayloadRoot "$PWD\.local\windows-production-bundle" `
            -NodeId NODE1 `
            -ValidateOnly

      - name: Reject placeholder Integrator access key
        shell: pwsh
        run: |
          $config = Get-Content -Raw install/windows-production/Jornada.Production.example.json | ConvertFrom-Json
          $config.installationRoot = 'C:\Jornada-CI'
          $config.dataRoot = 'C:\Jornada-CI-Data'
          $config.sql.mode = 'External'
          $config.sql.connectionString = 'Server=localhost;Database=Jornada;Integrated Security=true;Encrypt=true;TrustServerCertificate=false'
          $config.sql.initializeDatabase = $false
          $config.integrator.enabled = $true
          $config.integrator.accessKey = 'CHANGE_ME'
          foreach ($task in $config.tasks) { $task.enabled = $false }
          $negativeConfig = "$PWD\.local\Jornada.Production.invalid-key.json"
          $config | ConvertTo-Json -Depth 30 | Set-Content -Encoding UTF8 $negativeConfig
          try {
            .\install\windows-production\Install-JornadaProduction.ps1 `
              -ConfigPath $negativeConfig `
              -PayloadRoot "$PWD\.local\windows-production-bundle" `
              -ValidateOnly
            throw 'O instalador aceitou accessKey placeholder.'
          }
          catch {
            if ($_.Exception.Message -eq 'O instalador aceitou accessKey placeholder.') { throw }
            Write-Host 'Placeholder de accessKey rejeitado: OK'
          }

      - name: Verify production bundle manifest
        shell: pwsh
        run: |
          $root = "$PWD\.local\windows-production-bundle"
          $manifest = Join-Path $root 'MANIFEST.sha256'
          if (-not (Test-Path $manifest)) { throw 'MANIFEST.sha256 ausente' }
          foreach ($line in Get-Content $manifest) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s{2}', 2
            $expected = $parts[0]
            $path = Join-Path $root ($parts[1].Replace('/','\'))
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Hash divergente: $($parts[1])" }
          }
          Write-Host 'MANIFEST.sha256: OK'

      - name: Upload Windows production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jornada-windows-production-bundle
          path: Solution/.local/windows-production-bundle
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
