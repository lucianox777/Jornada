name: jornada-scale-observability-contract

on:
  pull_request:
    paths:
      - 'Solution/.dockerignore'
      - 'Solution/data/reference/ibge-nomes-2022/**'
      - 'Solution/database/Jornada_Dev_SyntheticScale.sql'
      - 'Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql'
      - 'Solution/scripts/local-scale.sh'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/scale-observability-evidence-gate.py'
      - '.github/workflows/scale-observability-contract.yml'
  push:
    branches: [ master ]
    paths:
      - 'Solution/.dockerignore'
      - 'Solution/data/reference/ibge-nomes-2022/**'
      - 'Solution/database/Jornada_Dev_SyntheticScale.sql'
      - 'Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql'
      - 'Solution/scripts/local-scale.sh'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/scale-observability-evidence-gate.py'
      - '.github/workflows/scale-observability-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate scale harness contract
        run: |
          set -euo pipefail
          python3 Solution/scripts/scale-observability-evidence-gate.py --self-test
          for script in Solution/scripts/local-scale.sh Solution/scripts/local-scale.ps1; do
            grep -F 'blockingPressure' "$script" >/dev/null
            grep -F 'decisionQuality' "$script" >/dev/null
            grep -F 'coordinationProbe' "$script" >/dev/null
            grep -F 'Jornada.Pipeline.ExclusiveRequest' "$script" >/dev/null
            grep -F 'Jornada.Pipeline.Corpus' "$script" >/dev/null
            grep -F 'scale-observability-evidence-gate.py' "$script" >/dev/null
            grep -F 'REBUILD_LOCAL_BLOCKING' "$script" >/dev/null
            grep -F 'Jornada.Processor.Worker' "$script" >/dev/null
            grep -F "codigo_pessoa_origem LIKE N'SCALE-%'" "$script" >/dev/null
            grep -F 'Jornada_Dev_SyntheticScale_Diversify.sql' "$script" >/dev/null
            grep -F 'Projeção de blocking' "$script" >/dev/null
            grep -F '20260912_Frequencia_Nomes_Referencia.sql' "$script" >/dev/null
            grep -F 'LOAD_NAME_FREQUENCY_SNAPSHOT' "$script" >/dev/null
            grep -F 'data/reference/ibge-nomes-2022/manifest.json' "$script" >/dev/null
          done
          grep -F 'falsePositives' Solution/scripts/scale-observability-evidence-gate.py >/dev/null
          grep -F 'REQUIRED_DIVERSE_ATTRIBUTES' Solution/scripts/scale-observability-evidence-gate.py >/dev/null
          grep -F 'SCALE-PEND-%' Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null
          grep -F 'ref.frequencia_nome' Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null
          grep -F "status=N'ATIVA'" Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null
          grep -F "HASHBYTES('SHA2_256'" Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null
          grep -F 'frequencia' Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null
          if grep -F 'OPENROWSET' Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null; then
            echo 'ERRO: o diversificador SCALE não deve reimplementar o loader de snapshot no SQL.' >&2
            exit 1
          fi
          if grep -F 'DECLARE @first TABLE' Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null; then
            echo 'ERRO: o corpus SCALE voltou a usar catálogo fixo uniforme de primeiros nomes.' >&2
            exit 1
          fi
          if grep -F 'DECLARE @surname TABLE' Solution/database/Jornada_Dev_SyntheticScale_Diversify.sql >/dev/null; then
            echo 'ERRO: o corpus SCALE voltou a usar catálogo fixo uniforme de sobrenomes.' >&2
            exit 1
          fi
          grep -Fx '**/bin/' Solution/.dockerignore >/dev/null
          grep -Fx '**/obj/' Solution/.dockerignore >/dev/null
          grep -Fx '.local/' Solution/.dockerignore >/dev/null
          grep -Fx '.git' Solution/.dockerignore >/dev/null
          bash -n Solution/scripts/local-scale.sh
      - name: Parse PowerShell scale harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Solution/scripts/local-scale.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Run scale harness smoke end to end
        working-directory: Solution
        run: ./scripts/local-scale.sh smoke
      - name: Upload scale smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scale-observability-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: Solution/.local/performance
          if-no-files-found: warn
