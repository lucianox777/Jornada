name: jornada-scale-observability-contract

on:
  pull_request:
    paths:
      - 'Solution/scripts/local-scale.sh'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/scale-observability-evidence-gate.py'
      - '.github/workflows/scale-observability-contract.yml'
  push:
    branches: [ master ]
    paths:
      - 'Solution/scripts/local-scale.sh'
      - 'Solution/scripts/local-scale.ps1'
      - 'Solution/scripts/scale-observability-evidence-gate.py'
      - '.github/workflows/scale-observability-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate observability evidence contract
        run: |
          set -euo pipefail
          python3 Solution/scripts/scale-observability-evidence-gate.py --self-test
          for script in Solution/scripts/local-scale.sh Solution/scripts/local-scale.ps1; do
            grep -F 'blockingPressure' "$script" >/dev/null
            grep -F 'coordinationProbe' "$script" >/dev/null
            grep -F 'Jornada.Pipeline.ExclusiveRequest' "$script" >/dev/null
            grep -F 'Jornada.Pipeline.Corpus' "$script" >/dev/null
            grep -F 'scale-observability-evidence-gate.py' "$script" >/dev/null
          done
      - name: Parse PowerShell scale harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'Solution/scripts/local-scale.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
