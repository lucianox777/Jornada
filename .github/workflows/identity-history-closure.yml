name: jornada-identity-history-closure
on:
  pull_request:
    paths:
      - 'Solution/src/Jornada.Contracts/Identity*History*.cs'
      - 'Solution/src/Jornada.Contracts/IdentityHistorical*.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityComposition*.cs'
      - 'Solution/tests/Jornada.Tests/Unit/Identity*History*.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IdentityHistorical*.cs'
      - '.github/workflows/identity-history-closure.yml'
  push:
    paths:
      - 'Solution/src/Jornada.Contracts/Identity*History*.cs'
      - 'Solution/src/Jornada.Contracts/IdentityHistorical*.cs'
      - 'Solution/src/Jornada.Operational.Sql/IdentityComposition*.cs'
      - 'Solution/tests/Jornada.Tests/Unit/Identity*History*.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IdentityHistorical*.cs'
      - '.github/workflows/identity-history-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Solution
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'
      - name: Restore and build
        run: |
          set -euo pipefail
          mkdir -p .local/history-evidence
          git rev-parse HEAD > .local/history-evidence/commit.txt
          git diff --check
          dotnet restore tests/Jornada.Tests/Jornada.Tests.csproj --locked-mode -bl:.local/history-evidence/restore.binlog
          dotnet build tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-restore -warnaserror -bl:.local/history-evidence/build.binlog 2>&1 | tee .local/history-evidence/build.log
      - name: Historical domain tests
        run: |
          set -euo pipefail
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~IdentityHistoricalResolverTests|FullyQualifiedName~IdentityCompositionAppliedHistoryTests|FullyQualifiedName~IdentityCompositionHistoryClosureTests' --logger 'trx;LogFileName=history.trx' --results-directory .local/history-evidence 2>&1 | tee .local/history-evidence/tests.log
          python3 scripts/test-evidence-gate.py .local/history-evidence/history.trx --forbid-skipped --minimum-tests 22 --summary .local/history-evidence/tests.json
      - name: Evidence summary
        if: always()
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path('.local/history-evidence')
          required=['commit.txt','restore.binlog','build.binlog','tests.json']
          checks={p:(root/p).is_file() and (root/p).stat().st_size>0 for p in required}
          try:
              tests=json.loads((root/'tests.json').read_text())
              checks['tests']=tests['status']=='PASS' and tests['aggregate']['passed']>=22 and tests['aggregate']['failed']==0 and tests['aggregate']['skipped']==0
          except (OSError,ValueError,KeyError):checks['tests']=False
          outcome='passed' if all(checks.values()) else 'failed'
          root.mkdir(parents=True,exist_ok=True)
          (root/'summary.json').write_text(json.dumps({'schema_version':1,'commit':os.environ['GITHUB_SHA'],'outcome':outcome,'checks':checks,'scope':'historical_domain_only','database_integration_proven':False,'operational_activation':False,'gold_publication':False},indent=2)+'\n')
          if outcome!='passed':sys.exit(1)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-history-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: Solution/.local/history-evidence/
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
