name: v9-seed42-generator-byte-comparison
on:
  pull_request:
    paths:
      - 'Solution/scripts/v9-seed42-generator-byte-comparison.sh'
      - '.github/workflows/v9-seed42-generator-byte-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare-historical-and-current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.113'
      - name: Generate seed42 historical and current in isolation and compare bytes
        run: bash Solution/scripts/v9-seed42-generator-byte-comparison.sh
      - name: Archive SHA comparison without corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: v9-seed42-generator-byte-comparison-${{ github.run_id }}
          path: v9-seed42-generator-byte-comparison.json
          if-no-files-found: warn
          retention-days: 30
