name: dt02-lock-refresh-once
on:
  push:
    branches:
      - fix/dt02-net10-after-e2ea
permissions:
  contents: write
concurrency:
  group: dt02-lock-refresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.100'
      - name: Regenerate Jornada lock graph and candidate provenance
        working-directory: Solution
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = '10.0.100'
          dotnet restore Jornada.sln --use-lock-file --force-evaluate
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.')
          manifest=root/'config/release/nuget-lock-provenance.json'
          data=json.loads(manifest.read_text(encoding='utf-8'))
          locks=sorted(p for p in root.rglob('packages.lock.json') if not ({'.local','obj','bin'} & set(p.parts)))
          rows=[{'path':p.as_posix(),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in locks]
          combined=hashlib.sha256(('\n'.join(f"{r['sha256']}  {r['path']}" for r in rows)).encode()).hexdigest()
          data['candidateGraph']={
            'candidate':'v5.00',
            'status':'CI_FORCE_EVALUATED_LOCK_GRAPH',
            'sourceCommit':os.environ.get('GITHUB_SHA'),
            'githubRunId':os.environ.get('GITHUB_RUN_ID'),
            'sdk':'10.0.100',
            'reason':'DT-02: grafo candidato regenerado após migração para net10.0 e Microsoft.Data.SqlClient 7.1.1; histórico v4.05/.NET 8 preservado separadamente.',
            'lockCount':len(rows),
            'changedLockCount':len(rows),
            'combinedSha256':combined,
            'overrides':rows
          }
          manifest.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('DT-02 candidate locks:',len(rows),combined)
          PY
          python3 scripts/nuget-lock-gate.py --root .
          python3 scripts/nuget-lock-provenance-gate.py --root .
          dotnet restore Jornada.sln --locked-mode
      - name: Regenerate ApoioSecretarias lock graph
        working-directory: ApoioSecretarias
        shell: bash
        run: |
          set -euo pipefail
          test "$(dotnet --version)" = '10.0.100'
          dotnet restore SolucaoApoioSecretarias.sln --use-lock-file --force-evaluate
          dotnet restore SolucaoApoioSecretarias.sln --locked-mode
      - name: Commit generated lock graphs only
        shell: bash
        run: |
          set -euo pipefail
          git add 'Solution/**/packages.lock.json' 'ApoioSecretarias/**/packages.lock.json' Solution/config/release/nuget-lock-provenance.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(dt02): regenerate .NET 10 lock graphs'
          git push origin HEAD:fix/dt02-net10-after-e2ea
