name: nomemae-schema-seed-once

on:
  push:
    paths:
      - '.github/workflows/nomemae-schema-seed-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/nome-mae-nullable-v3
          fetch-depth: 0
      - name: Apply deterministic schema and seed patch
        run: python3 Solution/scripts/patch-nomemae-schema-seed-once.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Solution/database/postgresql/Jornada_Processor_Persistence_Core.sql Solution/database/Jornada_Seed_Dev.sql
          git diff --cached --quiet && exit 0
          git commit -m "feat: ativa Pessoa v3 com nomeMae anulável"
          git push origin HEAD:feat/nome-mae-nullable-v3
