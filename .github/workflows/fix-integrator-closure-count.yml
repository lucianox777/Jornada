name: fix-integrator-closure-count

on:
  push:
    branches:
      - work/integrador-identificador-config
    paths:
      - '.github/workflows/fix-integrator-closure-count.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Align closure gate with current lock inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Solution/scripts/technical-closure-gate.py')
          text = path.read_text(encoding='utf-8')
          old = 'generation.get("lockCount") != 15'
          new = 'generation.get("lockCount") != 18'
          if old not in text:
              raise SystemExit('expected lock-count invariant not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-integrator-closure-count.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Solution/scripts/technical-closure-gate.py
          git commit -m 'ci: align technical closure with 18 lock files'
          git push origin "HEAD:${GITHUB_REF_NAME}"
