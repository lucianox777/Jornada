name: jornada-ci-diagnostics

on:
  workflow_run:
    workflows: [jornada-ci]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize completed CI jobs without changing PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "Manual run: no completed CI run was provided." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The workflow_run payload is untrusted. Do not checkout or execute its code.
          # GitHub API access is read-only and event values enter via environment variables.
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .status, (.conclusion // "pending")] | @tsv' > jobs.tsv
          # Failures are identified from job conclusions, not inferred from workflow status.
          failed_count=$(awk -F '\t' '$3 == "failure" || $3 == "timed_out" || $3 == "action_required" { n++ } END { print n+0 }' jobs.tsv)
          {
            echo "## Jornada CI diagnostic"
            echo
            printf 'Run: %s\n\n' "$RUN_ID"
            printf 'Head SHA: %s\n\n' "$RUN_HEAD_SHA"
            printf 'Conclusion: %s\n\n' "$RUN_CONCLUSION"
            printf 'Failed or blocked jobs: %s\n\n' "$failed_count"
            echo '| Job | Status | Conclusion |'
            echo '| --- | --- | --- |'
            while IFS=$'\t' read -r name status conclusion; do
              name="${name//|/\\|}"
              printf '| %s | %s | %s |\n' "$name" "$status" "$conclusion"
            done < jobs.tsv
            echo
            echo 'Read-only report: no reruns, cancellations, PR edits or merges.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout trusted master profiler (never PR event code)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: master
      - name: Profile runtime and repeated builds from completed jobs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID" > ci-run.json
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100&filter=latest" > ci-jobs.json
          python3 Solution/scripts/ci-run-profile.py --run ci-run.json --jobs ci-jobs.json >> "$GITHUB_STEP_SUMMARY"
          python3 Solution/scripts/ci-failure-checkpoint.py --run ci-run.json --jobs ci-jobs.json \
            --out Solution/.local/ci-diagnostics/incident.json >> "$GITHUB_STEP_SUMMARY"
          rm -f ci-run.json ci-jobs.json

      - name: Publish read-only SHA-scoped failure checkpoint
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-checkpoints
          path: Solution/.local/ci-diagnostics/incident.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
