name: jornada-ci-diagnostics

on:
  workflow_run:
    workflows: [jornada-ci]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize completed CI jobs without changing PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "workflow_run" ]]; then
            echo "Manual run: no completed CI run was provided." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The workflow_run payload is untrusted. Do not checkout or execute its code.
          # GitHub API access is read-only and event values enter via environment variables.
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | [.name, .status, (.conclusion // "pending")] | @tsv' > jobs.tsv
          {
            echo "## Jornada CI diagnostic"
            echo
            printf 'Run: %s\n\n' "$RUN_ID"
            printf 'Head SHA: %s\n\n' "$RUN_HEAD_SHA"
            printf 'Conclusion: %s\n\n' "$RUN_CONCLUSION"
            echo '| Job | Status | Conclusion |'
            echo '| --- | --- | --- |'
            while IFS=$'\t' read -r name status conclusion; do
              name="${name//|/\\|}"
              printf '| %s | %s | %s |\n' "$name" "$status" "$conclusion"
            done < jobs.tsv
            echo
            echo 'Read-only report: no reruns, cancellations, PR edits or merges.'
          } >> "$GITHUB_STEP_SUMMARY"
