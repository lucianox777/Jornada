name: jornada-calibrador-splink-reference

on:
  push:
    paths:
      - 'Solution/tools/calibrador-splink/**'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/SplinkCalibrationExchange.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/FactorialCalibrationCandidates.cs'
      - 'Solution/tests/Jornada.Tests/Unit/SplinkCalibrationExchangeTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IbgeNominalBenchmarkTests.cs'
      - '.github/workflows/calibrador-splink-reference.yml'
  pull_request:
    paths:
      - 'Solution/tools/calibrador-splink/**'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/SplinkCalibrationExchange.cs'
      - 'Solution/src/Jornada.Linkage.Parameters.Worker/FactorialCalibrationCandidates.cs'
      - 'Solution/tests/Jornada.Tests/Unit/SplinkCalibrationExchangeTests.cs'
      - 'Solution/tests/Jornada.Tests/Unit/IbgeNominalBenchmarkTests.cs'
      - '.github/workflows/calibrador-splink-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  splink-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Solution
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.424'

      - name: Create isolated Python environment
        run: |
          set -euo pipefail
          python3 --version
          python3 -m venv .local/calibrador-splink-venv
          .local/calibrador-splink-venv/bin/python -m pip install --disable-pip-version-check --no-input -r tools/calibrador-splink/requirements.txt
          .local/calibrador-splink-venv/bin/python -c 'import importlib.metadata; assert importlib.metadata.version("splink") == "4.0.17"'

      - name: Run deterministic Splink calibration smoke twice
        run: |
          set -euo pipefail
          mkdir -p .local/calibrador-splink-evidence
          .local/calibrador-splink-venv/bin/python tools/calibrador-splink/run_calibration.py \
            --input tools/calibrador-splink/smoke_input.json \
            --output .local/calibrador-splink-evidence/estimates-a.json \
            --seed 20260913 \
            --max-pairs 1000
          .local/calibrador-splink-venv/bin/python tools/calibrador-splink/run_calibration.py \
            --input tools/calibrador-splink/smoke_input.json \
            --output .local/calibrador-splink-evidence/estimates-b.json \
            --seed 20260913 \
            --max-pairs 1000
          cmp .local/calibrador-splink-evidence/estimates-a.json .local/calibrador-splink-evidence/estimates-b.json

      - name: Validate runner evidence contract
        run: |
          set -euo pipefail
          .local/calibrador-splink-venv/bin/python - <<'PY'
          import json
          import re
          from pathlib import Path

          p = json.loads(Path('.local/calibrador-splink-evidence/estimates-a.json').read_text(encoding='utf-8'))
          assert p['schema_version'] == 'JORNADA_SPLINK_ESTIMATES_V1'
          assert p['source_schema_version'] == 'JORNADA_SPLINK_EXCHANGE_V1'
          assert p['splink_version'] == '4.0.17'
          assert p['runner'] == 'calibrador-splink/run_calibration.py'
          assert p['scope'] == 'NOME'
          assert p['nominal_semantics_version'] == 'IDENTITY_NAME_STATES_V1'
          assert p['generator_version'] == 'IBGE_NOMINAL_BENCHMARK_V1'
          assert p['ibge_source_version'] == 'SMOKE-IBGE'
          assert re.fullmatch(r'[0-9a-fA-F]{64}', p['ibge_fingerprint_sha256'])
          assert p['partition'] == 0
          assert p['seed'] == 20260913
          assert p['max_pairs'] == 1000
          assert p['u_population_records'] == 9
          assert p['m_positive_pairs'] == 9
          assert p['name_thresholds'] == [0.92, 0.8]
          assert [x['level'] for x in p['estimates']] == ['EXACT', 'HIGH', 'MEDIUM', 'LOW']
          assert all(x['feature'] == 'NOME' for x in p['estimates'])
          assert all(0 < x['m_probability'] < 1 for x in p['estimates'])
          assert all(0 < x['u_probability'] < 1 for x in p['estimates'])
          PY

      - name: Validate C# exchange and factorial contracts
        run: |
          set -euo pipefail
          dotnet restore Jornada.sln --locked-mode
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj \
            --configuration Release \
            --no-restore \
            --filter 'FullyQualifiedName~SplinkCalibrationExchangeTests|FullyQualifiedName~IbgeNominalBenchmarkTests' \
            --logger 'console;verbosity=normal'

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: calibrador-splink-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: Solution/.local/calibrador-splink-evidence/
          retention-days: 30
          if-no-files-found: warn
