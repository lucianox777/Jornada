name: v9-corpus-persistence-contract
on:
  pull_request:
    paths:
      - 'Solution/scripts/v9-corpus-*.py'
      - 'Solution/tests/scripts/test_v9_corpus_*.py'
      - '.github/workflows/v9-corpus-persistence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned
        with:
          persist-credentials: false
      - name: Python syntax and snapshot contracts
        working-directory: Solution
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v9-corpus-snapshot.py scripts/v9-corpus-input-receipt.py scripts/v9-corpus-prepare.py
          python3 -m unittest discover -s tests/scripts -p 'test_v9_corpus_*.py' -v
