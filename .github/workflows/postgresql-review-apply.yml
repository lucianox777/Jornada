name: jornada-postgresql-review-apply

on:
  push:
    branches:
      - work/postgresql-persistence-review
    paths:
      - .github/workflows/postgresql-review-apply.yml

permissions:
  contents: write

jobs:
  apply-reviewed-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Apply exact reviewed changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path('Solution/src/Jornada.Processor.Worker')
          def patch(name, expected_sha, replacements):
              path = root / name
              actual = subprocess.check_output(['git','hash-object',str(path)], text=True).strip()
              if actual != expected_sha:
                  raise RuntimeError(f'{name}: unexpected source SHA {actual}; refusing patch')
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if text.count(old) != 1:
                      raise RuntimeError(f'{name}: expected exactly one occurrence of {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          patch('PostgreSqlProcessorRepository.cs',
                'ab4d747e5d19695aa5ae7534a36b7f8c503ef30f', [
              ('await tx.RollbackAsync(CancellationToken.None);\n            throw;',
               'await PostgreSqlPersistenceSupport.RollbackPreservingOriginalAsync(tx);\n            throw;'),
              ('parameter.Value = value ?? DBNull.Value;',
               'parameter.Value = PostgreSqlPersistenceSupport.NormalizeParameterValue(type, value);'),
              ('DateTimeOffset dto => dto,', 'DateTimeOffset dto => dto.ToUniversalTime(),')
          ])
          patch('PostgreSqlIdentityMapRepository.cs',
                '9b5342c4c0c732b8712bf54da89b9692419f94c6', [
              ('await tx.RollbackAsync(CancellationToken.None);\n            throw;',
               'await PostgreSqlPersistenceSupport.RollbackPreservingOriginalAsync(tx);\n            throw;')
          ])
          PY
          git rm .github/workflows/postgresql-review-apply.yml
          git add Solution/src/Jornada.Processor.Worker/PostgreSqlProcessorRepository.cs Solution/src/Jornada.Processor.Worker/PostgreSqlIdentityMapRepository.cs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind PostgreSQL timestamps in UTC and retain original transaction failures'
          git push origin HEAD:refs/heads/work/postgresql-persistence-review
