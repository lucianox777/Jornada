name: chatgpt-cpf-source-fallback

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/chatgpt-cpf-source-fallback.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '8.0.x'
      - name: Apply transformation
        run: python3 Solution/scripts/_once_cpf_fallback.py
      - name: Validate static gates
        working-directory: Solution
        run: |
          python3 scripts/technical-closure-gate.py
          python3 scripts/governance-readiness-gate.py --root .
          python3 scripts/json-schema-meta-gate.py config/contracts
          git -C .. diff --check
      - name: Build and unit tests
        working-directory: Solution
        run: |
          dotnet restore Jornada.sln --locked-mode
          dotnet build Jornada.sln --configuration Release --no-restore -warnaserror
          dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --configuration Release --no-build --filter 'TestCategory=Unit'
      - name: Commit
        run: |
          git config user.name 'lucianox777'
          git config user.email 'lucianovianna.backup@gmail.com'
          git add RELEASE_INFO.txt Solution
          git commit -m 'Usa CPF como código de origem quando código da Pessoa estiver ausente'
          git push origin HEAD:master
