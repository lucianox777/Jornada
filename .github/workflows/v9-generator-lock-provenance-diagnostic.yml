name: v9-generator-lock-provenance-diagnostic
on:
  pull_request:
    paths:
      - 'Solution/scripts/v9-generator-lock-provenance-diagnostic.py'
      - 'Solution/tests/scripts/test_v9_generator_lock_provenance_diagnostic.py'
      - 'Solution/docs/V9_TF_SEEDS_44_47_LOCK.json'
      - 'Solution/docs/V9_TF_SEEDS_48_57_LOCK.json'
      - '.github/workflows/v9-generator-lock-provenance-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test deterministic digest implementation
        run: python3 -m unittest discover -s Solution/tests/scripts -p test_v9_generator_lock_provenance_diagnostic.py
      - name: Compare historic LOCK against checked-out generator (no corpus)
        run: |
          python3 Solution/scripts/v9-generator-lock-provenance-diagnostic.py --repo . --output v9-generator-lock-provenance.json
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v9-generator-lock-provenance-${{ github.run_id }}
          path: v9-generator-lock-provenance.json
          if-no-files-found: warn
          retention-days: 30
