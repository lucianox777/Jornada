name: V9 full-schema real RunAsync smoke (nonpublishing, no scientific TEST)

# Independent disposable harness, not invoked by the calibration workflow.
on:
  workflow_dispatch:
  # A new workflow introduced only on a PR branch may not be eligible for
  # pull_request execution until it exists on the default branch. Validate
  # the exact feature branch on push as well; do not wait for merge.
  push:
    branches:
      - docs/gov-v9-grafo-operacional-coorte-20261117
  pull_request:
    paths:
      - 'Solution/src/Jornada.Linkage.Runner/**'
      - 'Solution/src/Jornada.Linkage.Core/**'
      - 'Solution/tests/Jornada.Tests/**'
      - 'Solution/tests/scripts/test_v9_*'
      - 'Solution/scripts/v9-e2e-dev-*.sh'
      - 'Solution/scripts/v9-e2e-dev-*.py'
      - 'Solution/scripts/local-e2e.sh'
      - 'Solution/scripts/v9-e2e-ibge-http.sh'
      - '.github/workflows/v9-test-fullschema-runasync-smoke.yml'

permissions:
  contents: read

jobs:
  full-schema-runasync-nonpublish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JORNADA_RUNTIME_MODE: DEV
      DOTNET_ENVIRONMENT: DEV
      ASPNETCORE_ENVIRONMENT: DEV
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # pinned
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # pinned
        with:
          dotnet-version: '10.0.113'
          cache: true
          cache-dependency-path: 'Solution/**/packages.lock.json'
      - name: Validate TEST guards and fixture isolation
        run: |
          set -euo pipefail
          python3 -m unittest Solution/tests/scripts/test_v9_fullschema_runasync_smoke.py Solution/tests/scripts/test_v9_physical_runasync_graph_guards.py Solution/tests/scripts/test_v9_configured_artifact_loader.py -v
          python3 Solution/scripts/v9-e2e-dev-r1-independent-oracle.py --self-test
          bash -n Solution/scripts/v9-e2e-dev-full-1k.sh
          bash -n Solution/scripts/local-e2e.sh
          bash -n Solution/scripts/v9-e2e-ibge-http.sh
          git diff --check
      - name: Build real Runner and SQL fixture
        working-directory: Solution
        run: dotnet build -c Release tests/Jornada.Tests/Jornada.Tests.csproj -warnaserror
      - name: Launch isolated SQL Server with ephemeral masked password
        run: bash Solution/scripts/v9-tf-start-disposable-sql.sh
      - name: Apply canonical complete operational schema and read-only preflight
        run: |
          set -euo pipefail
          sql_name="v9-probe-sql-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker exec -u 0 "$sql_name" sh -c 'mkdir -p /work/Solution && chmod 755 /work /work/Solution'
          docker cp Solution/database "$sql_name":/work/Solution/
          run_sql() {
            docker exec "$sql_name" sh -c \
              'cd /work/Solution && SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d "$1" -i "$2"' \
              sh "$1" "$2"
          }
          docker exec "$sql_name" sh -c \
            'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -Q "CREATE DATABASE JornadaHarness;"'
          run_sql JornadaHarness database/Jornada_Fase1_v3.70.sql >"$RUNNER_TEMP/v9-fullschema-schema.log" 2>&1 || {
            echo "::error::Full operational SQL schema failed"; tail -n 35 "$RUNNER_TEMP/v9-fullschema-schema.log"; exit 1;
          }
          run_sql JornadaHarness database/migrations/20261113_V9_Operational_Frozen_Model_Conversion.sql >"$RUNNER_TEMP/v9-fullschema-v9-model.log" 2>&1 || {
            echo "::error::V9 TEST_ONLY SQL migration failed"; exit 1;
          }
          run_sql JornadaHarness database/testing/20261114_V9_Operational_Schema_Readonly_Preflight.sql >"$RUNNER_TEMP/v9-fullschema-preflight.log" 2>&1 || {
            echo "::error::Full SQL preflight rejected disposable schema"; exit 1;
          }
          grep -q 'SCHEMA_PREFLIGHT_PASS_NOT_RUNTIME_PARITY' "$RUNNER_TEMP/v9-fullschema-preflight.log"
          # Same SQL container, but a distinct, never-reused DEV attempt with
          # resident authorization and SNAPSHOT. No scientific TEST data.
          dev_attempt="$(python3 -c 'import uuid;print(uuid.uuid4())')"
          dev_db="JornadaV9Dev_${dev_attempt//-/}"
          docker exec "$sql_name" sh -c \
            'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d master -Q "$1"' \
            sh "CREATE DATABASE [$dev_db];"
          docker exec "$sql_name" sh -c \
            'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d master -Q "$1"' \
            sh "ALTER DATABASE [$dev_db] SET ALLOW_SNAPSHOT_ISOLATION ON;"
          run_sql "$dev_db" database/Jornada_Fase1_v3.70.sql >"$RUNNER_TEMP/v9-dev-full-schema.log" 2>&1 || {
            echo "::error::DEV SQL complete schema failed"; tail -n 40 "$RUNNER_TEMP/v9-dev-full-schema.log"; exit 1;
          }
          run_sql "$dev_db" database/migrations/20261113_V9_Operational_Frozen_Model_Conversion.sql >"$RUNNER_TEMP/v9-dev-model.log" 2>&1 || {
            echo "::error::DEV SQL model migration failed"; tail -n 25 "$RUNNER_TEMP/v9-dev-model.log"; exit 1;
          }
          docker exec "$sql_name" sh -c \
            'SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -I -S localhost -U sa -C -b -d "$1" -Q "$2"' \
            sh "$dev_db" "EXEC sys.sp_addextendedproperty @name=N'Jornada.EnvironmentProfile',@value=N'Development'; EXEC sys.sp_addextendedproperty @name=N'Jornada.V9.DevAttempt',@value=N'$dev_attempt';"
          echo "JORNADA_V9_DEV_ATTEMPT_DB=$dev_db" >>"$GITHUB_ENV"
      - name: Execute actual RunAsync in 200 synthetic observations and induced second-batch failure
        working-directory: Solution
        run: |
          set -euo pipefail
          # Masked connection was written by the canonical SQL bootstrap.
          test -n "$ConnectionStrings__Jornada"
          JORNADA_V9_FULL_SCHEMA_NONPUBLISH_SQL="$ConnectionStrings__Jornada" \
            dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
              --filter 'FullyQualifiedName~V9FullSchemaNonPublishingRunnerTests.Full_schema_RunAsync_200_two_batches_no_publication_and_second_batch_failure' \
              --logger 'console;verbosity=normal'
          printf '%s\n' \
            "scope=V9_FULL_SCHEMA_RUNASYNC_SYNTHETIC_NONPUBLISH" \
            "source_sha=$GITHUB_SHA" \
            "sql=CANONICAL_FULL_SCHEMA_JORNADAHARNESS" \
            "runasync=ACTUAL_RUNNER_METHOD" \
            "synthetic_observations=200" \
            "expected_batch_sizes=100,100" \
            "second_batch_failure=INJECTED_AND_VERIFIED" \
            "gold_serving_invariant=EMPTY_BEFORE_AND_AFTER" \
            "test_corpus_opened=false" \
            "scientific_test_100k=BLOCKED" \
            "production_equivalence_certified=false" \
            >"$RUNNER_TEMP/v9-fullschema-runasync-receipt.txt"
      - name: Execute controlled DEV FULL r1 physically against isolated SQL Gold (no scientific TEST)
        working-directory: Solution
        run: |
          set -euo pipefail
          test -n "$ConnectionStrings__Jornada"
          test -n "$JORNADA_V9_DEV_ATTEMPT_DB"
          results="$RUNNER_TEMP/v9-dev-r1-trx"
          oracle="$RUNNER_TEMP/v9-dev-r1-oracle"
          mkdir -p "$results" "$oracle"
          JORNADA_V9_R1_SQL_ORACLE_OUTPUT="$oracle" \
          JORNADA_V9_FULL_SCHEMA_NONPUBLISH_SQL="$ConnectionStrings__Jornada" \
            dotnet test tests/Jornada.Tests/Jornada.Tests.csproj --no-build -c Release \
              --filter 'FullyQualifiedName~V9ControlledDevFullSqlR1Tests.FULL_200_real_SQL_publishes_Gold_with_frozen_r1_and_no_implicit_identity_inheritance' \
              --logger 'console;verbosity=normal' --logger 'trx;LogFileName=r1-full.trx' \
              --results-directory "$results"
          # A successful dotnet test exit code with zero selected tests or skips is NOT PASS.
          python3 - "$results/r1-full.trx" <<'PY'
          import sys
          from xml.etree import ElementTree as ET
          counters = [node.attrib for node in ET.parse(sys.argv[1]).getroot().iter()
                      if node.tag.rsplit('}', 1)[-1] == 'Counters']
          if len(counters) != 1:
              raise SystemExit("V9_DEV_R1_TRX_COUNTERS_MISSING_OR_AMBIGUOUS")
          c = counters[0]
          if (int(c["total"]) != 1 or int(c["passed"]) != 1
              or int(c["failed"]) != 0 or int(c["notExecuted"]) != 0
              or int(c.get("skipped", 0)) != 0):
              raise SystemExit(f"V9_DEV_R1_PHYSICAL_SQL_TEST_NOT_1_PASS_0_SKIP: {c}")
          print("V9_DEV_R1_PHYSICAL_SQL_TEST: 1 aprovado, 0 pulados")
          PY
          # Reuse the existing independent decision oracle on the actual SQL
          # publication recorte. No scientific TEST data or external ZIP is used.
          (cd "$oracle" && sha256sum --check --status truth.sha256) || {
            echo "::error::V9_R1_GABARITO_SHA256_DIVERGENT"; exit 1;
          }
          python3 - "$oracle/truth.json" "$oracle/truth-oracle.json" "$oracle/observed.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          truth = Path(sys.argv[1]).read_bytes()
          actual = hashlib.sha256(truth).hexdigest()
          envelope = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          observed = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          if (envelope["zipSha256"] != actual or observed["zipSha256"] != actual
              or envelope["expectedDecisions"] != json.loads(truth)["expectedDecisions"]):
              raise SystemExit("V9_R1_GABARITO_REAL_CONTENT_SEAL_MISMATCH")
          print("V9_R1_GABARITO_SEAL: SHA256(truth.json) verified")
          PY
          python3 scripts/e2e-independent-decision-oracle.py \
            --truth "$oracle/truth-oracle.json" --observed "$oracle/observed.json" \
            --receipt "$oracle/receipt.json"
          python3 - "$oracle/receipt.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          receipt = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (receipt.get("status") != "PASS"
              or receipt.get("expectedCount") != 3
              or receipt.get("observedCount") != 3
              or receipt.get("missingObservations") != []
              or receipt.get("unexpectedObservations") != []
              or receipt.get("divergentObservations") != []
              or receipt.get("scope") !=
                  "OFFLINE_DECISION_ROWS_ONLY_NOT_RUNNER_PARITY_OR_SCIENTIFIC_TEST"):
              raise SystemExit(f"V9_DEV_R1_EXISTING_ORACLE_REJECTED: {receipt}")
          print("V9_DEV_R1_EXISTING_ORACLE: PASS; 3 synthetic source decisions")
          PY
          printf '%s\n' "dev_full_r1_physical_sql=PASS" "dev_full_r1_gold_publication=PASS" \
            "dev_full_r1_trx=1 aprovado, 0 pulados" \
            "dev_full_r1_s1_existing_gold=PASS" \
            "dev_full_r1_s2_gold_conflict_veto=PASS" \
            "dev_full_r1_s6_protected_reference=PASS" \
            "dev_full_r1_existing_decision_oracle=PASS" \
            "dev_attempt_db=$JORNADA_V9_DEV_ATTEMPT_DB" >>"$RUNNER_TEMP/v9-fullschema-runasync-receipt.txt"
      - name: Archive sanitized noncertifying receipt
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pinned
        with:
          name: v9-fullschema-real-runasync-nonpublishing
          path: |
            ${{ runner.temp }}/v9-fullschema-runasync-receipt.txt
            ${{ runner.temp }}/v9-dev-r1-oracle/receipt.json
            ${{ runner.temp }}/v9-dev-r1-oracle/truth.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Dispose private SQL container on success and failure
        if: always()
        run: docker rm -f "v9-probe-sql-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
