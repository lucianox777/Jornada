name: "V9 TF4 100k - Diagnóstico legado de TRAIN"

# Owner-only entry point for the already-governed V9 TF4 physical pipeline.
# This selector does not implement or unblock synthetic scientific TEST.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA exato (40 caracteres) da master selecionada para TRAIN 100k"
        required: true
        type: string
      security_preflight_approved:
        description: "Confirmar runner/segredos seguros, SQL descartavel e preflight autorizado"
        required: true
        type: boolean
        default: false
      test_mode:
        description: "Use sem_test para diagnóstico. O modo banco_existente_readonly foi revogado."
        required: true
        type: choice
        default: sem_test
        options:
          - sem_test
          - banco_existente_readonly
      test_database:
        description: "Entrada revogada no workflow legado. Deixe vazia."
        required: false
        default: ""
        type: string
      disable_python_sql_budget:
        description: "Manter default do calibrador: SQL com orcamento nativo, sem dimensionamento Python"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  admission:
    name: "V9 - validar SHA, autorizacao e escolha de TEST antes de gastar 100k"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      EXACT_SHA: ${{ inputs.expected_sha }}
      APPROVED: ${{ inputs.security_preflight_approved }}
      TEST_MODE: ${{ inputs.test_mode }}
      TEST_DATABASE: ${{ inputs.test_database }}
    steps:
      - name: Fail-closed owner-only, one-use, exact master SHA and TEST mode
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER" || {
            echo "::error::V9_OWNER_ONLY_DISPATCH"
            exit 1
          }
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            echo "::error::V9_ONE_USE_ATTEMPT_REQUIRED"
            exit 1
          }
          test "$GITHUB_REF" = "refs/heads/master"
          [[ "$EXACT_SHA" =~ ^[a-f0-9]{40}$ ]] && test "$EXACT_SHA" = "$GITHUB_SHA" || {
            echo "::error::V9_EXPECTED_MASTER_SHA_MISMATCH"
            exit 1
          }
          test "$APPROVED" = "true" || {
            echo "::error::V9_SECURITY_PREFLIGHT_REQUIRED"
            exit 1
          }
          if [[ "$TEST_MODE" != "sem_test" || -n "$TEST_DATABASE" ]]; then
            echo "::error::V9_LEGACY_EXTERNAL_TEST_ROUTE_DISABLED_PREPARE_ONLY"
            exit 1
          fi
          echo "V9_LEGACY_TRAIN_DIAGNOSTIC_ONLY"

  calibrate-audit-validate:
    name: "V9 - diagnóstico físico legado"
    needs: admission
    if: ${{ needs.admission.result == 'success' }}
    # Reuse the historical diagnostic, with the original owner/SHA guards.
    uses: ./.github/workflows/v9-v3-four-name-100k.yml
    # The called workflow requires this as an upper bound for its existing
    # one-use scientific TEST tag job; it narrows all other jobs to read-only.
    # This launcher never enables that still-blocked scientific TEST path.
    permissions:
      contents: write
      actions: read
    with:
      expected_sha: ${{ inputs.expected_sha }}
      security_preflight_approved: ${{ inputs.security_preflight_approved }}
      test_required: false
      test_database: ""
      expected_test_cert_sha256: ""
      disable_python_sql_budget: ${{ inputs.disable_python_sql_budget }}
