name: V9 frozen seed42 30k historical recovery
on:
  workflow_dispatch:
    inputs:
      historical_sha:
        description: 'Frozen generator SHA (must match registered historical origin)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout workflow revision for immutable registry
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify requested historical SHA against immutable registry
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.historical_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          registry = json.loads(Path("Solution/data/reference/v9-synthetic-seed42-30000/manifest.json").read_text())
          sha = os.environ["REQUESTED_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha), "Invalid SHA"
          assert sha == registry["evidence"]["original_source_sha"], "Not the frozen historical generator SHA"
          assert registry["population"] == 30000 and registry["seed"] == 42
          print("PASS: immutable historical generator commit confirmed")
          PY
      - name: Checkout exact frozen historical generator and scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.historical_sha }}
          path: historical
          persist-credentials: false
      - name: Verify actual checkout
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.historical_sha }}
        run: |
          set -euo pipefail
          test "$(git -C historical rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Start disposable SQL using maintained masked bootstrap
        run: bash Solution/scripts/v9-tf-start-disposable-sql.sh
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.113'
      - name: Build historical producer and pin exporter
        working-directory: historical/Solution
        run: |
          dotnet build -c Release src/Jornada.Linkage.SyntheticCorpus/Jornada.Linkage.SyntheticCorpus.csproj
          dotnet build -c Release src/Jornada.Linkage.Parameters.Worker/Jornada.Linkage.Parameters.Worker.csproj
      - name: Reproduce 30k with historical generator, no calibration
        working-directory: historical/Solution
        run: bash scripts/v9-tf-prepare-pin.sh "$PWD/.local/frozen-seed42-recovery" pinned-ibge.json
      - name: Independently verify physical hashes against frozen registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          base = Path("historical/Solution/.local/frozen-seed42-recovery/people-30k")
          r = json.loads(Path("Solution/data/reference/v9-synthetic-seed42-30000/manifest.json").read_text())
          def sha(p):
              h = hashlib.sha256()
              with p.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest().upper()
          raw = (base / "generation-manifest.json").read_bytes()
          actual_path = b"/home/runner/work/Jornada/Jornada/historical/Solution/"
          frozen_path = b"/home/runner/work/Jornada/Jornada/Solution/"
          assert raw.count(actual_path) == 1, "Unexpected historical manifest path"
          canonical = raw.replace(actual_path, frozen_path)
          assert hashlib.sha256(canonical).hexdigest().upper() == r["generation_manifest_sha256"], "Canonical historical manifest bytes differ"
          manifest = json.loads((base / "generation-manifest.json").read_text())
          assert manifest["input_fingerprint_sha256"].upper() == r["generator_input_sha256"], "Input differs"
          expected = {x["file"]: x["sha256"] for x in r["generated_files"]}
          declared = {x["path"]: x["sha256"] for x in manifest["outputs"]}
          assert declared == expected, "Generated manifest declares different physical outputs"
          assert set(expected) == {"pessoas_verdade.csv", "observacoes.csv", "gabarito.json"}
          for name, digest in expected.items():
              assert sha(base / name) == digest, f"Historical physical hash differs: {name}"
          print("PASS: exact historical physical 30k hashes match frozen V1; no model certification")
          PY
      - name: Upload only non-nominal evidence, even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v9-frozen-seed42-recovery-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            historical/Solution/.local/frozen-seed42-recovery/people-30k/generation-manifest.json
            historical/Solution/.local/frozen-seed42-recovery/bootstrap.json
            historical/Solution/.local/frozen-seed42-recovery/pinned-ibge.json
      - name: Remove disposable SQL
        if: always()
        run: docker ps -aq --filter 'name=v9-probe-sql-' | xargs -r docker rm -f
