# OPT-IN disposable DEV sandbox; NEVER compose-merge this with Solution/docker-compose.yml.
# Project name and separate secret are required; there are no container_names,
# published host ports, bind mounts, external networks or globally named volumes.
name: jornada-workers-e2e-${JORNADA_WORKERS_E2E_ID:?Explicit disposable E2E ID is required}

x-worker-image: &worker-image
  image: jornada-workers-e2e:${JORNADA_WORKERS_E2E_IMAGE_TAG:-test}
  build:
    context: ../..
    dockerfile: install/container-test/Dockerfile

x-worker-env: &worker-env
  JORNADA_RUNTIME_MODE: DEV
  JORNADA_WORKER_ISOLATED_PROFILE: "true"
  JORNADA_E2E_SQL_DATABASE: JornadaE2E
  JORNADA_SQL_DATABASE_OVERRIDE: JornadaE2E
  JORNADA_NODE_ID: NODE2
  DOTNET_ENVIRONMENT: Development
  ASPNETCORE_ENVIRONMENT: Development
  # Private CI E2E SQL uses a self-signed certificate. Encrypt remains ON;
  # accepting this certificate is allowed ONLY in the unexposed disposable network.
  ConnectionStrings__Jornada: "Server=sqlserver,1433;Database=JornadaE2E;User Id=sa;Password=${JORNADA_WORKERS_E2E_SQL_PASSWORD:?Separate disposable E2E SQL password required};Encrypt=true;TrustServerCertificate=true"
  Contracts__RepositoryRoot: /opt/jornada
  BronzeStorage__Provider: FileSystem
  BronzeStorage__RootPath: /data/bronze
  IngestionStaging__RootPath: /data/staging

x-worker-service: &worker-service
  <<: *worker-image
  profiles: ["continuous"]
  restart: unless-stopped
  depends_on:
    sqlserver:
      condition: service_healthy
    sql-bootstrap:
      condition: service_completed_successfully
  environment:
    <<: *worker-env
  volumes:
    - bronze:/data/bronze
    - staging:/data/staging
  entrypoint: ["/usr/local/bin/jornada-worker-entrypoint"]

x-api-service: &api-service
  <<: *worker-image
  # A morte de worker nenhum deve reiniciar ou encerrar as APIs.
  restart: unless-stopped
  depends_on:
    sqlserver:
      condition: service_healthy
    sql-bootstrap:
      condition: service_completed_successfully
  entrypoint: ["/usr/local/bin/jornada-api-entrypoint"]
  environment:
    <<: *worker-env
  volumes:
    - bronze:/data/bronze
    - staging:/data/staging

services:
  # Isolated SQL Server instance with project-prefixed volume; NO host port.
  # Schema/bootstrap and application-level integration are separate C3.2 gates:
  # this profile must not silently point to the existing JornadaLocal server.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${JORNADA_WORKERS_E2E_SQL_PASSWORD:?Separate disposable E2E SQL password required}"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: "no"

  # One-shot create-only schema and synthetic DEV seed on this PRIVATE SQL server.
  sql-bootstrap:
    build:
      context: ../..
      dockerfile: install/console-dev-e2e/sql-bootstrap/Dockerfile
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      JORNADA_WORKERS_E2E_SQL_BOOTSTRAP: "true"
      JORNADA_WORKERS_E2E_ID: "${JORNADA_WORKERS_E2E_ID:?Required E2E ID}"
      JORNADA_WORKERS_E2E_SQL_HOST: sqlserver
      JORNADA_RUNTIME_MODE: DEV
      DOTNET_ENVIRONMENT: Development
      JORNADA_E2E_SQL_DATABASE: JornadaE2E
      JORNADA_SQL_DATABASE_OVERRIDE: JornadaE2E
      SQLCMDPASSWORD: "${JORNADA_WORKERS_E2E_SQL_PASSWORD:?E2E SQL secret required}"

  # Always available in OFF and ON modes; separate PID 1 / service restart.
  api:
    <<: *api-service
    command: ["Api"]
    environment:
      <<: *worker-env
      JORNADA_NODE_ID: NODE1
      ASPNETCORE_URLS: "http://0.0.0.0:5080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5080/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  resultado-api:
    <<: *api-service
    command: ["ResultadoApi"]
    environment:
      <<: *worker-env
      JORNADA_NODE_ID: NODE2
      ASPNETCORE_URLS: "http://0.0.0.0:5081"
      JornadaApiBaseUrl: "http://api:5080"
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-bootstrap:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5081/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  processor:
    <<: *worker-service
    command: ["Processor"]
    # C3.2f2c: shorter lease ONLY in this ephemeral no-port CI Compose.
    # Real deployments and the canonical NODE Compose retain their defaults.
    environment:
      <<: *worker-env
      Processor__PollingMilliseconds: "150"
      Processor__LeaseDurationSeconds: "35"
      Processor__HeartbeatSeconds: "5"
      Processor__RecoveryScanSeconds: "5"

  operations-maintenance:
    <<: *worker-service
    command: ["OperationsMaintenance"]

  bronze-maintenance:
    <<: *worker-service
    command: ["BronzeMaintenance"]

volumes:
  # Compose generates PROJECT_sql_data, PROJECT_bronze, PROJECT_staging.
  # No hard-coded names; never attach volumes of the ordinary cluster.
  sql_data: {}
  bronze: {}
  staging: {}
