title = "Jornada secret scanning"

# Keep Gitleaks' maintained rule set as the baseline. Repository-specific changes
# must be additive and narrowly scoped; do not replace the default detector set.
[extend]
useDefault = true

# Intentionally no global allowlist here.
#
# False positives must be reviewed first. If an exception is unavoidable, prefer
# a rule-targeted allowlist with an exact path/regex and a comment linking the
# review decision. Never allowlist broad directories such as Solution/, tests/,
# .github/ or Documentos/.

# Reviewed false positives: deterministic/synthetic Development access keys.
# This exception applies ONLY to the inherited generic-api-key rule; every other
# Gitleaks rule still scans these files. The API rejects these credentials outside
# Development, and broad directories remain forbidden from allowlisting.
[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Synthetic Development access keys used by canonical local/E2E fixtures."
  paths = [
    '''^Solution/config/security/test-access-keys\.json$''',
    '''^Solution/scripts/local-e2e\.(sh|ps1)$''',
    '''^Solution/install/windows-production/Jornada\.Cluster\.Test\.json$'''
  ]

  # Reviewed in PR #1160: public deterministic SHA-256 of
  # "V9_FRESH_SYNTHETIC_HOLDOUT_V1|20261020001", used only as a receipt filename.
  # Decision: Solution/docs/V9_Suporte_Massa_Backoff_20261019.md (scanner section).
  # Require BOTH this exact evidence path and this exact non-secret value.
  [[rules.allowlists]]
  description = "Reviewed public seed fingerprint for one consumed V9 holdout receipt (#1160)."
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^Solution/data/calibration/v9/mass-support-20261020/finalist-validation\.json$''']
  regexes = ['''^93387c6b861d40608d235035ca04eafe09db06ae8480069e84bb9f477f5cdd8c$''']
