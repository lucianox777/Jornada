name: Apoio Secretarias - Testes e Distribuicao
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s testes -v
  windows-executaveis:
    runs-on: windows-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s testes -v
      - run: pyinstaller --clean --onefile --windowed --name ApoioSecretarias executar_interface.py
      - run: pyinstaller --clean --onefile --console --name ApoioSecretariasCLI executar_cli.py
      - uses: actions/upload-artifact@v4
        with:
          name: apoio-secretarias-windows-x64
          path: |
            dist/ApoioSecretarias.exe
            dist/ApoioSecretariasCLI.exe
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t apoio-secretarias:test .
      - run: docker run --rm apoio-secretarias:test --help
